<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#090d17"/>
<title>XI — Football Card Club</title>
<style>
:root{--bg:#080b12;--panel:#111827;--panel2:#151e2f;--text:#f8fafc;--muted:#93a4bb;--line:rgba(255,255,255,.08);--green:#35e58a;--gold:#f5c451;--purple:#9b7cff;--red:#ff6b72;--blue:#46a7ff;--radius:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100%;overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100dvh;background:radial-gradient(circle at 85% 0%,rgba(70,167,255,.18),transparent 34%),radial-gradient(circle at 0% 35%,rgba(53,229,138,.12),transparent 30%),#080b12;position:relative;padding-bottom:92px}.hidden{display:none!important}.screen{padding:18px 16px 100px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:950;letter-spacing:.08em;font-size:25px}.coins{background:rgba(245,196,81,.12);border:1px solid rgba(245,196,81,.35);color:#ffe39a;padding:9px 12px;border-radius:999px;font-weight:800;font-size:13px}.club-mini{font-size:12px;color:var(--muted);margin-top:2px}.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:28px;min-height:220px;padding:20px;background:linear-gradient(140deg,rgba(31,41,55,.88),rgba(15,23,42,.75)),radial-gradient(circle at 76% 20%,rgba(53,229,138,.32),transparent 35%);box-shadow:0 25px 60px rgba(0,0,0,.22)}.hero:after{content:"";position:absolute;width:220px;height:220px;border:35px solid rgba(255,255,255,.035);border-radius:50%;right:-70px;top:-70px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#b8c6d9;font-weight:800}.hero h1{font-size:31px;line-height:1;margin:8px 0}.hero p{color:#a9b5c6;font-size:13px;max-width:285px}.cta{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:var(--green);border:none;color:#042413;font-weight:950;padding:12px 16px;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.tile{background:linear-gradient(160deg,rgba(21,30,47,.95),rgba(12,17,28,.97));border:1px solid var(--line);padding:16px;border-radius:21px;min-height:118px;position:relative;overflow:hidden}.tile .icon{font-size:27px}.tile b{display:block;font-size:16px;margin-top:14px}.tile span{font-size:11px;color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:end;margin:22px 2px 10px}.section-title h2{font-size:18px;margin:0}.section-title small{color:var(--muted)}.cards-row{display:flex;gap:11px;overflow:auto;padding:2px 1px 8px;scrollbar-width:none}.cards-row::-webkit-scrollbar{display:none}.card{width:142px;min-width:142px;height:198px;border-radius:18px;padding:11px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.14);box-shadow:0 15px 25px rgba(0,0,0,.24);background:linear-gradient(145deg,#273043,#121721)}.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,rgba(255,255,255,.18),transparent 32%),linear-gradient(120deg,transparent 40%,rgba(255,255,255,.05));pointer-events:none}.card.gold{background:linear-gradient(145deg,#a47720,#302711 58%,#18140b);color:#fff7d1}.card.elite{background:linear-gradient(145deg,#5938a8,#1c1535 58%,#0e0b19)}.card.immortal{background:linear-gradient(145deg,#c34358,#35131b 55%,#14090c)}.card.prospect{background:linear-gradient(145deg,#54718c,#182532 60%,#0b1017)}.ovr{font-size:30px;font-weight:950;line-height:.9}.pos{font-size:11px;font-weight:900;letter-spacing:.08em}.nation{font-size:18px;margin-top:3px}.silhouette{height:67px;margin:4px -6px 0;border-radius:12px;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.03));display:grid;place-items:center;font-size:38px}.name{font-size:13px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;font-size:9px;margin-top:5px}.stats b{font-size:10px}.pot{position:absolute;right:8px;top:8px;font-size:9px;padding:5px 7px;border-radius:999px;background:rgba(0,0,0,.28);backdrop-filter:blur(5px);font-weight:900}.bottomnav{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:rgba(7,10,16,.91);backdrop-filter:blur(22px);border-top:1px solid var(--line)}.navbtn{border:none;background:transparent;color:#748397;padding:7px 2px;border-radius:12px;font-size:10px;font-weight:800}.navbtn i{font-style:normal;font-size:19px;display:block;margin-bottom:2px}.navbtn.active{color:#fff;background:rgba(255,255,255,.06)}.panel{background:linear-gradient(160deg,var(--panel2),#0d1320);border:1px solid var(--line);border-radius:22px;padding:15px}.pitch{height:580px;border-radius:25px;border:2px solid rgba(255,255,255,.12);position:relative;background:linear-gradient(rgba(20,116,71,.84),rgba(12,91,56,.84)),repeating-linear-gradient(0deg,transparent 0 58px,rgba(255,255,255,.025) 58px 116px);overflow:hidden}.pitch:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.12);transform:translateX(-50%)}.pitch:after{content:"";position:absolute;width:120px;height:120px;border:2px solid rgba(255,255,255,.12);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.slot{position:absolute;width:68px;height:86px;border-radius:11px;background:rgba(5,13,10,.5);border:1px dashed rgba(255,255,255,.25);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:9px;z-index:2;overflow:hidden}.slot.filled{background:linear-gradient(145deg,#907025,#2c230e);border-style:solid}.slot .sovr{font-size:18px;font-weight:950}.slot .sname{font-weight:900;font-size:8px;max-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot .spos{font-size:8px;color:#d9dfeb}.toolbar{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.pill{border:1px solid var(--line);background:#101827;color:#cbd5e1;padding:9px 12px;border-radius:999px;white-space:nowrap;font-size:12px;font-weight:800}.pill.active{background:#fff;color:#111827}.collection-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.collection-grid .card{width:100%;min-width:0;height:220px}.search{width:100%;border:1px solid var(--line);background:#101827;color:#fff;border-radius:15px;padding:12px 13px;outline:none}.packbox{padding:24px 18px;border-radius:28px;background:radial-gradient(circle at 50% 30%,rgba(155,124,255,.34),transparent 32%),linear-gradient(145deg,#241a45,#101321);border:1px solid rgba(155,124,255,.28);text-align:center}.packart{width:150px;height:220px;border-radius:20px;margin:10px auto 14px;background:linear-gradient(145deg,#bb9cff,#4d2b84 55%,#201333);transform:rotate(-4deg);box-shadow:0 30px 50px rgba(0,0,0,.35);position:relative;display:grid;place-items:center;font-size:58px}.packart:after{content:"GENESIS";position:absolute;bottom:18px;font-weight:950;font-size:17px;letter-spacing:.12em}.bigbtn{width:100%;border:none;border-radius:16px;background:#fff;color:#0b1020;font-weight:950;padding:14px 16px;margin-top:12px}.bigbtn.green{background:var(--green);color:#041d11}.bigbtn.dark{background:#182131;color:white;border:1px solid var(--line)}.market-item{display:flex;align-items:center;gap:12px;padding:11px;border-radius:17px;background:#101827;border:1px solid var(--line);margin-bottom:9px}.market-badge{width:53px;height:66px;border-radius:11px;background:linear-gradient(145deg,#a47720,#302711);display:grid;place-items:center;font-size:21px;font-weight:950}.market-info{flex:1}.market-info b{display:block}.market-info small{color:var(--muted)}.price{font-weight:950;color:#ffe399}.evo-hero{padding:20px;border-radius:25px;background:radial-gradient(circle at 70% 20%,rgba(53,229,138,.25),transparent 35%),linear-gradient(145deg,#153528,#101827);border:1px solid rgba(53,229,138,.2)}.evo-path{display:flex;gap:8px;align-items:center;overflow:auto;padding:13px 0}.node{min-width:90px;padding:13px;border-radius:16px;background:#111827;border:1px solid var(--line);text-align:center;font-size:11px}.node strong{display:block;font-size:18px}.node.done{border-color:rgba(53,229,138,.45);background:rgba(53,229,138,.08)}.match-card{padding:18px;border-radius:24px;background:linear-gradient(160deg,#162032,#0c111c);border:1px solid var(--line);margin-bottom:12px}.teams{display:grid;grid-template-columns:1fr 65px 1fr;align-items:center;text-align:center;margin:16px 0}.clubcrest{width:62px;height:62px;margin:auto;border-radius:18px;background:linear-gradient(145deg,#2f8b61,#173b2b);display:grid;place-items:center;font-size:24px;font-weight:950}.score{font-size:32px;font-weight:950}.log{font-size:12px;color:#b5c0d0;background:#0b1019;border-radius:14px;padding:12px;min-height:130px;max-height:180px;overflow:auto;line-height:1.6}.setup{position:fixed;inset:0;background:radial-gradient(circle at 70% 10%,rgba(53,229,138,.16),transparent 30%),#070a10;z-index:99;display:grid;place-items:center;padding:20px}.setupbox{width:min(430px,100%);border:1px solid var(--line);border-radius:30px;padding:25px;background:linear-gradient(160deg,#121b2a,#0c111b);box-shadow:0 35px 80px rgba(0,0,0,.35)}.setup h1{font-size:42px;margin:0;letter-spacing:.06em}.setup p{color:var(--muted)}.setup input{width:100%;padding:14px;border-radius:15px;background:#0a101a;border:1px solid var(--line);color:#fff;margin-top:10px;outline:none}.loader{position:fixed;inset:0;background:#06090e;z-index:120;display:grid;place-items:center;text-align:center}.loader-logo{font-size:64px;font-weight:1000;letter-spacing:.12em}.bar{width:220px;height:6px;background:#161f2c;border-radius:999px;overflow:hidden;margin-top:18px}.bar span{display:block;height:100%;width:0;background:var(--green);animation:load 1.2s forwards}@keyframes load{to{width:100%}}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:200;background:#f8fafc;color:#111827;padding:11px 15px;border-radius:999px;font-size:12px;font-weight:900;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);z-index:80;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(520px,100%);max-height:88dvh;overflow:auto;background:#0b111c;border:1px solid var(--line);border-radius:28px 28px 0 0;padding:18px 16px 28px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.x{border:none;background:#182131;color:#fff;width:34px;height:34px;border-radius:50%}.reveal{display:flex;justify-content:center;padding:22px}.reveal .card{transform:scale(1.25);margin:28px}.tiny{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div id="loader" class="loader"><div><div class="loader-logo">XI</div><div style="color:#8795a9;font-weight:700">BUILD YOUR LEGACY</div><div class="bar"><span></span></div></div></div>
<div id="setup" class="setup hidden"><div class="setupbox"><div class="eyebrow">WELCOME TO</div><h1>XI</h1><p>Create your club and open your first pack.</p><input id="clubNameInput" maxlength="24" placeholder="Club name" value="Vertex XI"><button class="bigbtn green" onclick="startClub()">CREATE CLUB</button></div></div>
<div class="app" id="app">
  <div id="home" class="screen page"></div>
  <div id="play" class="screen page hidden"></div>
  <div id="squad" class="screen page hidden"></div>
  <div id="club" class="screen page hidden"></div>
  <div id="market" class="screen page hidden"></div>
  <nav class="bottomnav">
    <button class="navbtn active" data-page="home"><i>⌂</i>HOME</button>
    <button class="navbtn" data-page="play"><i>▶</i>PLAY</button>
    <button class="navbtn" data-page="squad"><i>▦</i>SQUAD</button>
    <button class="navbtn" data-page="club"><i>◈</i>CLUB</button>
    <button class="navbtn" data-page="market"><i>◎</i>MARKET</button>
  </nav>
</div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>
<script>
const A=['Noah','Mateo','Luca','Elias','Malik','Caio','Ren','Emil','Thiago','Javier','Kai','Leo','Milan','Nico','Yuri','Sami','Adrian','Rafael','Tomas','Iker','Hugo','Dario','Marek','Jonas','Oscar','Enzo','Ari','Deni','Luis','Marco','Felix','Anton','Kian','Ruben','Ivan','Sandro','Mika','Joel','Ben','Zane','Theo','Alex','Mauro','Rico','Nils','Bruno','Kofi','Amir','Rayan','Dylan'];
const B=['Kovac','Varela','Diarra','Hartmann','Bellandi','Serrano','Nyberg','Velez','Ishikawa','Renner','Costa','Barreto','Mendes','Laurent','Romano','Silva','Petrovic','Moreau','Adler','Santos','Ferrer','Grimaldi','Bauer','Lindstrom','Marin','Ortega','Rossi','Nakamura','Adebayo','Keller','Mercier','Navarro','Molina','Ribeiro','Toure','Novak','Jensen','Bianchi','Alvarez','Mensah','Dumont','Voss','Pereira','Klein','Souza','Mori','Gomes','Vidal','Lopes','Soler'];
const nations=['🇬🇧','🇪🇸','🇮🇹','🇩🇪','🇫🇷','🇧🇷','🇦🇷','🇭🇷','🇵🇹','🇳🇱','🇯🇵','🇸🇪','🇨🇴','🇺🇾','🇧🇪','🇩🇰','🇳🇬','🇬🇭','🇨🇭','🇦🇹'];
const positions=['GK','RB','CB','CB','LB','CDM','CM','CM','CAM','RW','LW','ST','ST'];
const clubs=['Kingsport FC','Westbridge United','Bromley Athletic','Northcastle FC','Redhaven','Riverside City','Blackthorn FC','Ashbourne United','Eastborough','Royal Vale','Greyford Wanderers','Harbour City','Real Azul','Costa Verde','Atletico Dorado','Valencia Norte','Sevilla Oro','Catalonia FC','Torino Rosso','Milano Stella','Roma Aurea','Napoli Blu','Rhein Adler','Berlin Kraft','Munich Rot','Rhine 04','Paris Royale','Lyon Argent','Marseille Bleu','Monaco Crown','Aurora Rio','Santos Nova','Brasilia SC','Porto Alegre','Buenos Plata','Cordoba Azul','Rosario Norte','Mendoza FC','Tokyo Nova','Seoul Phoenix','Lisbon Crown','Amsterdam Atlas','Brussels Union','Copenhagen Ice','Zurich 11','Vienna Imperial'];
const traits=['Burst','Rapid','Precision','Cannon','Flair','Control','Vision','Creator','Crosser','Engine','Powerhouse','Wall','Aerial','Guardian','Sweeper','Leader','Reflex','Box Dominance'];
function rng(n){let x=Math.sin(n*999.1337)*43758.5453;return x-Math.floor(x)}
function range(seed,min,max){return Math.floor(rng(seed)*(max-min+1))+min}
function genPlayers(){let arr=[];for(let i=1;i<=1500;i++){let band=rng(i*7),ovr;if(band<.08)ovr=range(i,45,54);else if(band<.253)ovr=range(i,55,64);else if(band<.513)ovr=range(i,65,74);else if(band<.786)ovr=range(i,75,84);else if(band<.913)ovr=range(i,85,89);else if(band<.973)ovr=range(i,90,94);else if(band<.997)ovr=range(i,95,99);else ovr=range(i,100,104);let pot=Math.min(145,Math.max(ovr,ovr+range(i*4,5,43)));if(i===947){ovr=57;pot=145}let pos=positions[i%positions.length];let base=(s)=>Math.max(25,Math.min(145,ovr+range(i*s,-16,15)));let st={PAC:base(2),SHO:base(3),PAS:base(5),DRI:base(7),DEF:base(11),PHY:base(13)};if(pos==='GK')st={DIV:base(2),HAN:base(3),KIC:base(5),REF:base(7),SPD:Math.max(25,ovr-20+range(i,0,20)),POS:base(11)};let age=range(i*17,16,37);let rarity=ovr>=100?'immortal':ovr>=90?'elite':ovr>=75?'gold':'prospect';arr.push({id:i,name:A[i%A.length]+' '+B[(i*7)%B.length],ovr,pot,pos,nation:nations[(i*3)%nations.length],club:clubs[(i*11)%clubs.length],age,stats:st,rarity,trait:traits[(i*5)%traits.length],owned:false,games:0,evo:0,level:1,value:Math.max(250,Math.round((ovr*ovr*(pot/100))*2.4/50)*50)});}return arr}
const db=genPlayers();
let state=JSON.parse(localStorage.getItem('xi_state')||'null')||{club:null,coins:25000,owned:[],squad:[],wins:0,losses:0,draws:0,level:1,xp:0,evoSlots:2};
function save(){localStorage.setItem('xi_state',JSON.stringify(state))}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function cardHTML(p){let s=Object.entries(p.stats).map(([k,v])=>`<div><b>${v}</b> ${k}</div>`).join('');return `<div class="card ${p.rarity}" onclick="playerModal(${p.id})"><div class="pot">POT ${state.owned.includes(p.id)?p.pot:'???'}</div><div class="ovr">${p.ovr}</div><div class="pos">${p.pos}</div><div class="nation">${p.nation}</div><div class="silhouette">⚽</div><div class="name">${p.name}</div><div class="stats">${s}</div></div>`}
function top(title){return `<div class="topbar"><div><div class="brand">XI</div><div class="club-mini">${state.club||'YOUR CLUB'} · LVL ${state.level}</div></div><div class="coins">◉ ${state.coins.toLocaleString()}</div></div>${title?`<div class="section-title"><h2>${title}</h2></div>`:''}`}
function ownedPlayers(){return state.owned.map(id=>db[id-1]).filter(Boolean)}
function renderHome(){let recent=ownedPlayers().sort((a,b)=>b.ovr-a.ovr).slice(0,5);document.getElementById('home').innerHTML=top()+`<div class="hero"><div class="eyebrow">SEASON 1 · GENESIS</div><h1>BUILD YOUR<br>LEGACY.</h1><p>Collect fictional stars, discover hidden potential and evolve favourites all the way to 145.</p><button class="cta" onclick="openPackScreen()">✦ OPEN PACK</button></div><div class="grid"><div class="tile" onclick="go('squad')"><div class="icon">▦</div><b>MY SQUAD</b><span>${state.squad.length}/11 selected</span></div><div class="tile" onclick="showEvos()"><div class="icon">⬆</div><b>EVOLUTIONS</b><span>${state.evoSlots} active slots</span></div><div class="tile" onclick="go('play')"><div class="icon">⚔</div><b>DIVISION 10</b><span>${state.wins}W · ${state.draws}D · ${state.losses}L</span></div><div class="tile" onclick="go('club')"><div class="icon">◈</div><b>COLLECTION</b><span>${state.owned.length}/1500 cards</span></div></div><div class="section-title"><h2>Top players</h2><small>${state.owned.length} owned</small></div><div class="cards-row">${recent.length?recent.map(cardHTML).join(''):'<div class="panel tiny">Open your starter pack to begin your collection.</div>'}</div>`}
function renderClub(){let own=ownedPlayers().sort((a,b)=>b.ovr-a.ovr);document.getElementById('club').innerHTML=top('My Collection')+`<input class="search" placeholder="Search players" oninput="filterCollection(this.value)"><div class="toolbar" style="margin-top:10px"><button class="pill active">ALL</button><button class="pill" onclick="showEvos()">EVOLUTIONS</button><button class="pill">FIRST EDITION</button><button class="pill">CLUB LEGENDS</button></div><div class="collection-grid" id="collectionGrid">${own.map(cardHTML).join('')||'<div class="panel">No cards yet.</div>'}</div>`}
function filterCollection(q){q=q.toLowerCase();let own=ownedPlayers().filter(p=>p.name.toLowerCase().includes(q)||p.pos.toLowerCase().includes(q)||p.club.toLowerCase().includes(q));document.getElementById('collectionGrid').innerHTML=own.map(cardHTML).join('')}
const slotPos=[[50,92],[20,78],[40,80],[60,80],[80,78],[30,60],[50,62],[70,60],[50,43],[24,28],[76,28]];
function renderSquad(){let sq=state.squad.map(id=>db[id-1]);let slots=slotPos.map((xy,i)=>{let p=sq[i];return `<div class="slot ${p?'filled':''}" style="left:${xy[0]}%;top:${xy[1]}%" onclick="pickSquad(${i})">${p?`<div class="sovr">${p.ovr}</div><div class="sname">${p.name}</div><div class="spos">${p.pos}</div>`:`<div style="font-size:20px">+</div><b>${['GK','LB','CB','CB','RB','CM','CM','CAM','ST','LW','RW'][i]}</b>`}</div>`}).join('');let ovr=sq.length?Math.round(sq.reduce((a,p)=>a+p.ovr,0)/sq.length):0;document.getElementById('squad').innerHTML=top('Squad')+`<div class="panel" style="display:flex;justify-content:space-between;margin-bottom:12px"><div><div class="eyebrow">FORMATION</div><b>4-3-3 ATTACK</b></div><div style="text-align:right"><div class="eyebrow">OVR</div><b style="font-size:25px">${ovr}</b></div></div><div class="pitch">${slots}</div><button class="bigbtn dark" onclick="autoSquad()">AUTO BUILD BEST XI</button>`}
function pickSquad(idx){let own=ownedPlayers().sort((a,b)=>b.ovr-a.ovr);document.getElementById('sheet').innerHTML=`<div class="sheet-head"><h2>Select player</h2><button class="x" onclick="closeModal()">×</button></div><div class="collection-grid">${own.map(p=>`<div onclick="setSquad(${idx},${p.id})">${cardHTML(p)}</div>`).join('')}</div>`;document.getElementById('modal').classList.remove('hidden')}
function setSquad(i,id){state.squad[i]=id;state.squad=[...state.squad];save();closeModal();renderSquad();renderHome()}
function autoSquad(){state.squad=ownedPlayers().sort((a,b)=>b.ovr-a.ovr).slice(0,11).map(p=>p.id);save();renderSquad();renderHome();toast('Best XI selected')}
function renderPlay(){document.getElementById('play').innerHTML=top('Play')+`<div class="match-card"><div class="eyebrow">RANKED · DIVISION 10</div><div class="teams"><div><div class="clubcrest">XI</div><b>${state.club}</b></div><div class="score" id="score">–</div><div><div class="clubcrest" style="background:linear-gradient(145deg,#7b3348,#3a1724)">AI</div><b>Northstar FC</b></div></div><button class="bigbtn green" onclick="simulateMatch()">PLAY MATCH</button><div class="log" id="matchlog" style="margin-top:12px">Choose your squad and start the match.</div></div><div class="grid"><div class="tile"><div class="icon">🏆</div><b>DAILY CUP</b><span>3-match mini tournament</span></div><div class="tile"><div class="icon">◇</div><b>POTENTIAL CUP</b><span>Max starting OVR 75</span></div></div>`}
function simulateMatch(){if(state.squad.length<7){toast('Build more of your squad first');return}let team=state.squad.map(id=>db[id-1]),avg=team.reduce((a,p)=>a+p.ovr,0)/team.length,opp=70+Math.random()*22;let my=Math.max(0,Math.floor((avg-55)/18+Math.random()*3)),op=Math.max(0,Math.floor((opp-60)/20+Math.random()*3));document.getElementById('score').textContent=`${my}–${op}`;let names=team.sort(()=>Math.random()-.5).slice(0,3);let lines=['12\' Midfield battle settles in.',`27\' ${names[0]?.name||'Your striker'} forces a save.`,`41\' ${op>0?'Northstar break through and score.':'Your defence shuts down the counter.'}`,`63\' ${my>0?`${names[1]?.name||'Your winger'} finds the net!`:'Chance flashes wide.'}`,`82\' ${my>1?`${names[2]?.name||'Your captain'} scores a huge late goal!`:'Tense finish as both sides push.'}`,`FT · ${my}-${op}`];document.getElementById('matchlog').innerHTML=lines.join('<br>');if(my>op){state.wins++;state.coins+=800;toast('+800 coins · Win')}else if(my<op){state.losses++;state.coins+=300;toast('+300 coins')}else{state.draws++;state.coins+=450;toast('+450 coins · Draw')}team.forEach(p=>p.games++);save();renderHome()}
function renderMarket(){let list=[...db].filter(p=>!state.owned.includes(p.id)).sort(()=>Math.random()-.5).slice(0,14);document.getElementById('market').innerHTML=top('Transfer Market')+`<input class="search" placeholder="Search market"><div style="margin-top:12px">${list.map(p=>`<div class="market-item"><div class="market-badge">${p.ovr}</div><div class="market-info"><b>${p.name}</b><small>${p.nation} ${p.pos} · ${p.club}<br>POT ??? · ${p.trait}</small></div><div><div class="price">◉ ${p.value.toLocaleString()}</div><button class="pill" style="margin-top:5px" onclick="buy(${p.id})">BUY</button></div></div>`).join('')}</div>`}
function buy(id){let p=db[id-1];if(state.coins<p.value){toast('Not enough coins');return}state.coins-=p.value;state.owned.push(id);save();renderMarket();renderHome();toast(`${p.name} signed`)}
function openPackScreen(){let price=5000;document.getElementById('sheet').innerHTML=`<div class="sheet-head"><h2>GENESIS PACK</h2><button class="x" onclick="closeModal()">×</button></div><div class="packbox"><div class="eyebrow">5 PLAYERS · 1 GUARANTEED 75+</div><div class="packart">XI</div><b style="font-size:24px">GENESIS PACK</b><p class="tiny">Every player has hidden potential. One launch card can reach 145.</p><button class="bigbtn green" onclick="buyPack(${price})">OPEN · ◉ ${price.toLocaleString()}</button></div>`;document.getElementById('modal').classList.remove('hidden')}
function buyPack(price){if(state.coins<price){toast('Not enough coins');return}state.coins-=price;let candidates=db.filter(p=>!state.owned.includes(p.id));let picks=[];for(let i=0;i<5;i++){let p=candidates[Math.floor(Math.random()*candidates.length)];if(i===0){let hi=candidates.filter(x=>x.ovr>=75);p=hi[Math.floor(Math.random()*hi.length)]}picks.push(p);candidates=candidates.filter(x=>x.id!==p.id)}picks.forEach(p=>state.owned.push(p.id));save();document.getElementById('sheet').innerHTML=`<div class="sheet-head"><h2>PACK OPENED</h2><button class="x" onclick="closeModal();renderAll()">×</button></div><div class="cards-row" style="padding:20px 2px 30px">${picks.map(cardHTML).join('')}</div><button class="bigbtn green" onclick="closeModal();renderAll()">SEND TO CLUB</button>`;renderHome()}
function playerModal(id){let p=db[id-1],owned=state.owned.includes(id);document.getElementById('sheet').innerHTML=`<div class="sheet-head"><h2>${p.name}</h2><button class="x" onclick="closeModal()">×</button></div><div class="reveal">${cardHTML(p)}</div><div class="panel"><b>${p.nation} ${p.club}</b><div class="tiny" style="margin-top:5px">Age ${p.age} · ${p.pos} · ${p.trait} · ${p.games} club apps</div><div style="display:flex;justify-content:space-between;margin-top:12px"><span>Potential</span><b>${owned?p.pot:'???'}</b></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span>Evolution level</span><b>E${p.evo}</b></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span>Market value</span><b>◉ ${p.value.toLocaleString()}</b></div></div>${owned?`<button class="bigbtn green" onclick="startEvo(${p.id})">EVOLVE PLAYER</button>`:''}`;document.getElementById('modal').classList.remove('hidden')}
function showEvos(){let own=ownedPlayers().sort((a,b)=>b.pot-a.pot).slice(0,8);document.getElementById('sheet').innerHTML=`<div class="sheet-head"><h2>EVOLUTION LAB</h2><button class="x" onclick="closeModal()">×</button></div><div class="evo-hero"><div class="eyebrow">ACTIVE SLOTS</div><h2 style="font-size:32px;margin:4px 0">${state.evoSlots} / 7</h2><p class="tiny">Upgrade cards through branching paths. Every player keeps their own potential ceiling.</p><button class="pill" onclick="buyEvoSlot()">UNLOCK NEXT SLOT</button></div><div class="section-title"><h2>Recommended</h2></div><div class="cards-row">${own.map(cardHTML).join('')}</div><div class="evo-path"><div class="node done"><strong>BASE</strong>E0</div><div>→</div><div class="node"><strong>PACE</strong>+ PAC</div><div>→</div><div class="node"><strong>ASCEND</strong>Trait+</div><div>→</div><div class="node"><strong>LEGACY</strong>E10</div></div>`;document.getElementById('modal').classList.remove('hidden')}
function buyEvoSlot(){if(state.evoSlots>=7){toast('Maximum slots unlocked');return}let costs=[0,0,25000,75000,200000,500000,1000000],cost=costs[state.evoSlots];if(state.coins<cost){toast(`Need ${cost.toLocaleString()} coins`);return}state.coins-=cost;state.evoSlots++;save();showEvos();renderHome();toast('Evolution slot unlocked')}
function startEvo(id){let p=db[id-1];let cost=Math.round((5000+p.ovr*140+p.evo*12000)/500)*500;if(state.coins<cost){toast(`Need ${cost.toLocaleString()} coins`);return}document.getElementById('sheet').innerHTML=`<div class="sheet-head"><h2>CHOOSE PATH</h2><button class="x" onclick="closeModal()">×</button></div><div class="reveal">${cardHTML(p)}</div><div class="grid"><div class="tile" onclick="applyEvo(${id},'pace',${cost})"><div class="icon">⚡</div><b>VELOCITY</b><span>+4 PAC · +2 DRI · +1 OVR</span></div><div class="tile" onclick="applyEvo(${id},'tech',${cost})"><div class="icon">✦</div><b>MAESTRO</b><span>+3 PAS · +3 DRI · +1 OVR</span></div><div class="tile" onclick="applyEvo(${id},'power',${cost})"><div class="icon">⬢</div><b>POWER</b><span>+3 PHY · +2 SHO · +1 OVR</span></div><div class="tile" onclick="applyEvo(${id},'def',${cost})"><div class="icon">🛡</div><b>GUARDIAN</b><span>+4 DEF · +2 PHY · +1 OVR</span></div></div><button class="bigbtn dark">COST · ◉ ${cost.toLocaleString()}</button>`}
function applyEvo(id,path,cost){let p=db[id-1];if(state.coins<cost){toast('Not enough coins');return}if(p.ovr>=p.pot){toast('Potential reached');return}state.coins-=cost;p.evo++;p.ovr=Math.min(p.pot,p.ovr+1);let key=path==='pace'?'PAC':path==='tech'?'DRI':path==='power'?'PHY':'DEF';if(p.stats[key]!=null)p.stats[key]=Math.min(145,p.stats[key]+4);if(path==='tech'&&p.stats.PAS!=null)p.stats.PAS=Math.min(145,p.stats.PAS+3);if(path==='power'&&p.stats.SHO!=null)p.stats.SHO=Math.min(145,p.stats.SHO+2);p.rarity=p.ovr>=130?'immortal':p.ovr>=90?'elite':p.ovr>=75?'gold':'prospect';save();closeModal();renderAll();toast(`${p.name} evolved to ${p.ovr}`)}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function go(page){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(page).classList.remove('hidden');document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.page===page));if(page==='home')renderHome();if(page==='play')renderPlay();if(page==='squad')renderSquad();if(page==='club')renderClub();if(page==='market')renderMarket()}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.page));
function renderAll(){renderHome();renderPlay();renderSquad();renderClub();renderMarket()}
function startClub(){state.club=document.getElementById('clubNameInput').value.trim()||'Vertex XI';if(state.owned.length===0){let starters=[db.find(p=>p.ovr>=82&&p.ovr<=87),db.find(p=>p.pos==='GK'&&p.ovr>=75),db.find(p=>p.pos==='CB'&&p.ovr>=76),db.find(p=>p.pos==='CM'&&p.ovr>=77),db.find(p=>p.pos==='ST'&&p.ovr>=79)].filter(Boolean);starters.forEach(p=>{if(!state.owned.includes(p.id))state.owned.push(p.id)});state.squad=state.owned.slice(0,5)}save();document.getElementById('setup').classList.add('hidden');renderAll();}
setTimeout(()=>{document.getElementById('loader').classList.add('hidden');if(!state.club)document.getElementById('setup').classList.remove('hidden');else renderAll()},1250);
</script>
</body>
</html>
