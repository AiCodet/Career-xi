<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Career XI</title><style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#0b1020;color:#f7f8fb}
button,input,select{font:inherit}.shell{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 92px}
.brand{font-weight:900;letter-spacing:-1px;font-size:28px}.muted{color:#9ca7bd}.card{background:#141c30;border:1px solid #26324d;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0003}
.hero{padding:28px 0 12px}.hero h1{font-size:42px;line-height:.95;margin:12px 0}.accent{color:#75f0a7}
.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;margin:7px 0;background:#75f0a7;color:#07130c;font-weight:800}.btn.secondary{background:#202b45;color:#fff}
label{display:block;font-size:13px;color:#aeb8cc;margin:12px 0 5px}input,select{width:100%;background:#0d1426;color:white;border:1px solid #33415f;border-radius:12px;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0d1426;border-radius:14px;padding:12px}.stat b{font-size:21px;display:block}
.top{display:flex;justify-content:space-between;align-items:center}.pill{padding:6px 9px;border-radius:999px;background:#23304c;color:#cbd5e1;font-size:12px}.fixture{text-align:center;padding:12px}.clubs{display:flex;justify-content:space-around;align-items:center;font-weight:800;font-size:18px}.vs{color:#75f0a7}
.nav{position:fixed;bottom:0;left:0;right:0;background:#10182a;border-top:1px solid #283550;display:flex;justify-content:center;z-index:5}.nav button{max-width:105px;flex:1;background:none;border:0;color:#95a2bb;padding:14px 4px 18px;font-size:12px}.nav button.active{color:#75f0a7;font-weight:800}.hidden{display:none!important}
.choice{background:#202b45;color:white;border:1px solid #344362;border-radius:14px;padding:13px;width:100%;margin:6px 0;text-align:left}.event{border-left:3px solid #75f0a7;padding:9px 12px;margin:8px 0;background:#10182a;border-radius:0 10px 10px 0}.good{color:#75f0a7}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 5px;border-bottom:1px solid #283550;text-align:left}th{color:#98a5bc}
.progress{height:8px;background:#283550;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:#75f0a7}
h2{margin:18px 0 8px}h3{margin:5px 0}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:#7f8ba4;margin-top:20px}
</style></head>
<body><div id="app"></div><nav id="nav" class="nav hidden"></nav><script>
const $=s=>document.querySelector(s);
const teams=["Wolves","Aston Villa","Arsenal","Chelsea","Liverpool","Man City","Newcastle","Tottenham"];
let save=JSON.parse(localStorage.getItem("careerXI")||"null"),page="home",matchState=null;
const persist=()=>localStorage.setItem("careerXI",JSON.stringify(save));
function app(h){$("#app").innerHTML=`<main class="shell">${h}</main>`}
function start(){document.querySelector("#nav").classList.add("hidden");app(`<div class="hero"><div class="brand">CAREER<span class="accent">XI</span></div><h1>Your career.<br>Your decisions.</h1><p class="muted">A focused football player-career simulator. Build a player, earn your place and live through a changing football world.</p></div><div class="card"><h3>Player Career</h3><p class="muted">Start as a young player and build your career season by season.</p><button class="btn" onclick="creator()">New Career</button>${save?`<button class="btn secondary" onclick="show('home')">Continue ${save.player.name}</button>`:""}</div>`)}
function creator(){app(`<div class="top"><div class="brand">CAREER<span class="accent">XI</span></div><span class="pill">NEW CAREER</span></div><h2>Create Player</h2><div class="card">
<label>Name</label><input id="name" value="Cole"><div class="grid"><div><label>Nationality</label><select id="nat"><option>England</option><option>Scotland</option><option>Wales</option><option>France</option><option>Spain</option><option>Brazil</option></select></div><div><label>Age</label><select id="age">${[16,17,18,19].map(x=>`<option>${x}</option>`).join("")}</select></div></div>
<div class="grid"><div><label>Height</label><select id="height">${["5'6","5'7","5'8","5'9","5'10","5'11","6'0","6'1","6'2","6'3"].map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>Preferred Foot</label><select id="foot"><option>Right</option><option>Left</option></select></div></div>
<label>Position</label><select id="pos">${["ST","LW","RW","CAM","CM","CDM","LB","RB","CB","GK"].map(x=>`<option>${x}</option>`).join("")}</select>
<label>Playstyle</label><select id="style"><option>Inside Forward</option><option>Traditional Winger</option><option>Wide Playmaker</option><option>Advanced Forward</option><option>Poacher</option><option>Box-to-Box</option><option>Ball Winning Midfielder</option><option>Ball Playing Defender</option></select>
<label>Career Start</label><select id="path"><option>Academy</option><option>Professional</option><option>Custom</option></select>
<label>Starting Club</label><select id="club">${teams.map(x=>`<option>${x}</option>`).join("")}</select><button class="btn" onclick="createCareer()">Start Career</button></div>`)}
function createCareer(){let p={name:$("#name").value||"Player",nationality:$("#nat").value,age:+$("#age").value,height:$("#height").value,foot:$("#foot").value,pos:$("#pos").value,style:$("#style").value,path:$("#path").value,club:$("#club").value,ovr:64,attrs:{Pace:68,Shooting:62,Passing:64,Dribbling:67,Defending:45,Physical:61}};save={player:p,season:"2026/27",week:1,club:p.club,trust:55,fitness:100,form:6.8,apps:0,goals:0,assists:0,table:teams.map(t=>({team:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0})),history:[],nextOpponent:teams.find(x=>x!==p.club)};persist();show("home")}
function nav(){let n=$("#nav");n.classList.remove("hidden");n.innerHTML=[["home","Home"],["career","Career"],["match","Match"],["table","Table"],["history","History"]].map(([p,n])=>`<button class="${page===p?"active":""}" onclick="show('${p}')">${n}</button>`).join("")}
function show(p){page=p;nav();({home,career,match,table,history}[p])()}
function home(){app(`<div class="top"><div><div class="brand">CAREER<span class="accent">XI</span></div><div class="muted">${save.season} • Week ${save.week}</div></div><span class="pill">${save.club}</span></div><div class="card"><div class="section-title">Next Match</div><div class="fixture"><div class="clubs"><span>${save.club}</span><span class="vs">VS</span><span>${save.nextOpponent}</span></div><p class="muted">League • Saturday 15:00</p><button class="btn" onclick="show('match')">Play Match</button></div></div><div class="grid"><div class="stat"><span class="muted">OVR</span><b>${save.player.ovr}</b></div><div class="stat"><span class="muted">Manager Trust</span><b>${save.trust}</b></div><div class="stat"><span class="muted">Apps</span><b>${save.apps}</b></div><div class="stat"><span class="muted">G/A</span><b>${save.goals}/${save.assists}</b></div></div><div class="card"><h3>${save.player.name}</h3><p>${save.player.pos} • ${save.player.style}</p><div class="progress"><i style="width:${save.fitness}%"></i></div><p class="muted">Fitness ${save.fitness}% • Form ${save.form.toFixed(1)}</p></div>`)}
function career(){let p=save.player;app(`<div class="top"><h2>Career</h2><span class="pill">${p.pos}</span></div><div class="card"><h3>${p.name}</h3><p class="muted">${p.age} • ${p.nationality} • ${p.height} • ${p.foot} foot</p><div class="grid">${Object.entries(p.attrs).map(([k,v])=>`<div class="stat"><span class="muted">${k}</span><b>${v}</b></div>`).join("")}</div></div><div class="card"><h3>Development</h3><select id="training"><option>Balanced</option>${Object.keys(p.attrs).map(x=>`<option>${x}</option>`).join("")}</select><button class="btn secondary" onclick="train()">Complete Training</button></div>`)}
function train(){let f=$("#training").value;if(f!=="Balanced"&&save.player.attrs[f]<90)save.player.attrs[f]++;save.fitness=Math.max(80,save.fitness-2);save.trust=Math.min(100,save.trust+1);persist();career()}
function match(){if(!matchState)matchState={minute:0,home:0,away:0,rating:6.5,events:[]};let m=matchState;app(`<div class="top"><h2>Matchday</h2><span class="pill">${m.minute}'</span></div><div class="card fixture"><div class="clubs"><span>${save.club} ${m.home}</span><span class="vs">-</span><span>${m.away} ${save.nextOpponent}</span></div><p class="muted">${save.player.name} • Rating ${m.rating.toFixed(1)}</p></div><div id="moment">${m.minute>=90?`<div class="card"><h3>Full Time</h3><button class="btn" onclick="finishMatch()">Finish Match</button></div>`:`<button class="btn" onclick="advance()">Continue Match</button>`}</div><div class="card"><h3>Match Events</h3>${m.events.length?m.events.slice().reverse().map(e=>`<div class="event">${e}</div>`).join(""):`<p class="muted">Kick-off awaits.</p>`}</div>`)}
function advance(){let m=matchState;m.minute=Math.min(90,m.minute+Math.floor(6+Math.random()*10));if(Math.random()<.32){decision();return}if(Math.random()<.2){let us=Math.random()<.52;us?m.home++:m.away++;m.events.push(`${m.minute}' ⚽ ${us?save.club:save.nextOpponent} score.`)}match()}
function decision(){let ds=[["Attacking Third","You receive the ball on the wing.",["Dribble","Cross","Through Ball","Pass"]],["Inside the Box","The ball falls to you inside the box.",["Shoot","Pass","Dribble"]],["Counter Attack","Your team breaks forward.",["Make Run","Come Short","Through Ball","Pass"]],["Attacking Corner","Your teammate is taking the corner.",["Come Short","Edge of Box","Get Forward"]]],d=ds[Math.floor(Math.random()*ds.length)];$("#moment").innerHTML=`<div class="card"><div class="section-title">${matchState.minute}' • ${d[0]}</div><h3>${d[1]}</h3>${d[2].map(o=>`<button class="choice" onclick="choose('${o}')">${o}</button>`).join("")}</div>`}
function choose(o){let m=matchState,ok=Math.random()<.5;if(o==="Shoot"&&ok){m.home++;save.goals++;m.rating+=.9;m.events.push(`${m.minute}' ⚽ ${save.player.name} scores.`)}else if(["Cross","Through Ball","Pass"].includes(o)&&ok&&Math.random()<.28){m.home++;save.assists++;m.rating+=.6;m.events.push(`${m.minute}' 🅰 ${save.player.name} creates the goal with a ${o.toLowerCase()}.`)}else{m.rating+=ok?.15:-.08;m.events.push(`${m.minute}' ${ok?"✓":"×"} ${o} — ${ok?"successful":"unsuccessful"}.`)}match()}
function finishMatch(){let m=matchState;save.apps++;save.form=Math.max(5.5,Math.min(10,m.rating));save.fitness=Math.max(70,save.fitness-10);save.trust=Math.max(0,Math.min(100,save.trust+(m.rating>=7?2:m.rating<6.3?-2:0)));apply(save.club,save.nextOpponent,m.home,m.away);let o=teams.filter(t=>t!==save.club&&t!==save.nextOpponent);for(let i=0;i<o.length;i+=2)apply(o[i],o[i+1],Math.floor(Math.random()*4),Math.floor(Math.random()*4));save.history.push({week:save.week,opp:save.nextOpponent,score:`${m.home}-${m.away}`,rating:m.rating.toFixed(1)});save.week++;let c=teams.filter(t=>t!==save.club);save.nextOpponent=c[(save.week-1)%c.length];matchState=null;persist();show("home")}
function apply(a,b,ga,gb){let A=save.table.find(x=>x.team===a),B=save.table.find(x=>x.team===b);A.p++;B.p++;A.gf+=ga;A.ga+=gb;B.gf+=gb;B.ga+=ga;if(ga>gb){A.w++;B.l++;A.pts+=3}else if(gb>ga){B.w++;A.l++;B.pts+=3}else{A.d++;B.d++;A.pts++;B.pts++}}
function table(){let t=[...save.table].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));app(`<h2>League Table</h2><div class="card"><table><tr><th>#</th><th>Club</th><th>P</th><th>GD</th><th>Pts</th></tr>${t.map((x,i)=>`<tr><td>${i+1}</td><td class="${x.team===save.club?"good":""}">${x.team}</td><td>${x.p}</td><td>${x.gf-x.ga}</td><td><b>${x.pts}</b></td></tr>`).join("")}</table></div>`)}
function history(){app(`<h2>Career History</h2><div class="card"><h3>${save.season}</h3>${save.history.length?save.history.map(x=>`<div class="event">W${x.week} • ${save.club} ${x.score} ${x.opp}<br><span class="muted">Rating ${x.rating}</span></div>`).join(""):`<p class="muted">No matches played yet.</p>`}</div><button class="btn secondary" onclick="if(confirm('Delete this career?')){localStorage.removeItem('careerXI');save=null;start()}">Delete Career</button>`)}
start();
</script></body></html>
