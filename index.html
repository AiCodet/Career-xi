<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#07110d">
<title>XI</title>
<style>
:root{
  --bg:#07100d;--panel:#101915;--panel2:#15221c;--line:rgba(255,255,255,.09);
  --text:#f6fbf8;--muted:#8fa39a;--green:#35e58a;--gold:#ffd264;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.setup{position:fixed;inset:0;z-index:100;background:
 radial-gradient(circle at 75% 15%,rgba(53,229,138,.22),transparent 35%),
 linear-gradient(#06100c,#070b0a 55%,#070b0a);
 display:flex;align-items:center;justify-content:center;padding:20px}
.setup-card{width:min(560px,94vw);padding:20px;border-radius:24px;background:rgba(17,27,24,.96);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.38)}
.eyebrow{font-size:10px;letter-spacing:.16em;color:#b8cbc2;font-weight:800}
.setup-card h1{font-size:36px;margin:5px 0 10px;letter-spacing:.06em}
.setup-card p{font-size:12px;color:var(--muted)}
.setup-card input{width:100%;margin-top:10px;padding:13px 14px;background:#09110f;border:1px solid var(--line);border-radius:13px;color:white;outline:none}
.btn{width:100%;margin-top:10px;padding:13px 14px;border:0;border-radius:13px;font-weight:900}
.btn.green{background:var(--green);color:#062014}
.btn.dark{background:#17221e;color:#fff;border:1px solid var(--line)}
.app{width:100%;max-width:none;margin:0;min-height:100vh;padding-bottom:96px;background:
 radial-gradient(circle at 90% 5%,rgba(53,229,138,.11),transparent 28%),#08100e}
.screen{width:100%;padding:22px 18px 116px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.logo{font-size:29px;font-weight:1000;letter-spacing:.08em}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.coins{font-size:14px;font-weight:900;padding:8px 11px;border-radius:999px;background:rgba(255,210,100,.12);border:1px solid rgba(255,210,100,.25);color:#ffe8a3}
.hero{padding:20px;border-radius:24px;min-height:210px;background:
 radial-gradient(circle at 85% 20%,rgba(53,229,138,.24),transparent 35%),
 linear-gradient(145deg,#16221d,#0d1512);border:1px solid var(--line)}
.hero h2{font-size:31px;line-height:.96;margin:10px 0}
.hero p{font-size:12px;color:var(--muted);max-width:300px}
.smallbtn{display:inline-block;border:0;border-radius:12px;padding:11px 14px;font-weight:900;background:var(--green);color:#052015;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{padding:15px;border-radius:18px;background:linear-gradient(145deg,#14201b,#0d1512);border:1px solid var(--line);min-height:105px}
.tile .ico{font-size:23px}
.tile b{display:block;font-size:14px;margin-top:13px}
.tile span{font-size:10px;color:var(--muted)}
.heading{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}
.heading h3{font-size:20px;margin:0}
.heading small{font-size:10px;color:var(--muted)}
.cards{display:flex;gap:10px;overflow:auto;padding-bottom:6px}

.card{
  --ink:#f7fbff;
  --chip:rgba(4,10,16,.28);
  --soft:rgba(255,255,255,.22);
  width:156px;min-width:156px;height:228px;padding:0;border:0;border-radius:18px;
  position:relative;overflow:hidden;background:#15201b;
  color:var(--ink);
  box-shadow:0 14px 32px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.16);
  isolation:isolate;
}
.card:before,.card:after{content:"";position:absolute;inset:0;pointer-events:none}
.card:before{opacity:.98}
.card:after{border:1px solid rgba(255,255,255,.16);border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.card.prospect{background:linear-gradient(160deg,#122233 0%,#263f54 52%,#0a121b 100%)}
.card.prospect:before{background:
 radial-gradient(circle at 82% 16%,rgba(164,215,255,.34),transparent 18%),
 linear-gradient(135deg,rgba(255,255,255,.08) 0 24%,transparent 24% 100%),
 repeating-linear-gradient(135deg,rgba(255,255,255,.055) 0 8px,transparent 8px 18px)}
.card.silver{--ink:#11151b;--chip:rgba(255,255,255,.35);background:linear-gradient(160deg,#eef3f8 0%,#aab7c6 45%,#5c6876 100%)}
.card.silver:before{background:
 radial-gradient(circle at 78% 12%,rgba(255,255,255,.55),transparent 18%),
 linear-gradient(125deg,rgba(255,255,255,.55) 0 18%,transparent 18% 100%),
 repeating-linear-gradient(-45deg,rgba(255,255,255,.12) 0 10px,transparent 10px 20px)}
.card.gold{--ink:#271806;--chip:rgba(255,244,189,.34);background:linear-gradient(160deg,#ffe07d 0%,#dbab29 48%,#85590a 100%)}
.card.gold:before{background:
 radial-gradient(circle at 80% 14%,rgba(255,244,179,.55),transparent 20%),
 linear-gradient(135deg,rgba(255,255,255,.34) 0 16%,transparent 16% 100%),
 repeating-linear-gradient(135deg,rgba(95,54,0,.08) 0 11px,transparent 11px 22px)}
.card.elite{background:linear-gradient(160deg,#28153f 0%,#7d2de2 46%,#0f0b1f 100%)}
.card.elite:before{background:
 radial-gradient(circle at 76% 16%,rgba(255,184,255,.33),transparent 18%),
 linear-gradient(135deg,rgba(255,255,255,.08) 0 19%,transparent 19% 100%),
 repeating-linear-gradient(150deg,rgba(255,255,255,.08) 0 7px,transparent 7px 18px)}
.card.immortal{background:linear-gradient(160deg,#2f070b 0%,#d23541 46%,#160204 100%)}
.card.immortal:before{background:
 radial-gradient(circle at 82% 16%,rgba(255,198,120,.28),transparent 20%),
 linear-gradient(135deg,rgba(255,255,255,.08) 0 20%,transparent 20% 100%),
 repeating-linear-gradient(135deg,rgba(255,177,93,.08) 0 8px,transparent 8px 18px)}
.card.mythic{background:linear-gradient(160deg,#05060e 0%,#1b2435 45%,#020306 100%)}
.card.mythic:before{background:
 radial-gradient(circle at 22% 18%,rgba(79,183,255,.18),transparent 18%),
 radial-gradient(circle at 80% 18%,rgba(255,205,92,.35),transparent 18%),
 linear-gradient(135deg,rgba(255,255,255,.1) 0 18%,transparent 18% 100%),
 repeating-linear-gradient(135deg,rgba(255,204,82,.12) 0 8px,transparent 8px 17px)}
.card.dynasty{background:linear-gradient(160deg,#0f1d10 0%,#2d6d39 44%,#09100c 100%)}
.card.dynasty:before{background:
 radial-gradient(circle at 76% 16%,rgba(255,227,123,.28),transparent 18%),
 linear-gradient(135deg,rgba(255,255,255,.08) 0 20%,transparent 20% 100%),
 repeating-linear-gradient(90deg,rgba(255,212,92,.10) 0 5px,transparent 5px 16px)}
.card.glitch{background:linear-gradient(160deg,#07121d 0%,#0a4b6c 40%,#140720 100%)}
.card.glitch:before{background:
 radial-gradient(circle at 82% 16%,rgba(255,72,255,.24),transparent 18%),
 linear-gradient(90deg,rgba(0,255,255,.10) 0 25%,transparent 25% 50%,rgba(255,0,170,.10) 50% 75%,transparent 75% 100%),
 repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 7px,transparent 7px 15px)}
.card.evolution{background:linear-gradient(160deg,#03211b 0%,#16a277 45%,#06110e 100%)}
.card.evolution:before{background:
 radial-gradient(circle at 80% 16%,rgba(157,255,221,.28),transparent 18%),
 linear-gradient(135deg,rgba(255,255,255,.08) 0 18%,transparent 18% 100%),
 repeating-linear-gradient(135deg,rgba(145,255,211,.10) 0 8px,transparent 8px 18px)}

.card .series{
  position:absolute;top:10px;right:10px;z-index:2;
  font-size:8px;font-weight:1000;letter-spacing:.14em;text-transform:uppercase;
  padding:5px 7px;border-radius:999px;background:var(--chip);backdrop-filter:blur(4px)
}
.card .ovr{position:absolute;z-index:2;left:12px;top:12px;font-size:34px;font-weight:1000;line-height:1}
.card .pos{position:absolute;z-index:2;left:14px;top:48px;font-size:10px;font-weight:1000;letter-spacing:.12em}
.card .flag,.card .clubmark{
  position:absolute;z-index:2;top:72px;height:25px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:var(--chip);backdrop-filter:blur(4px)
}
.card .flag{left:12px;width:34px;font-size:15px}
.card .clubmark{left:52px;width:36px;font-size:10px;font-weight:1000;letter-spacing:.12em}
.card .face{display:none}
.card .name{
  position:absolute;z-index:2;left:12px;right:12px;top:110px;height:28px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:1000;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-radius:10px;background:var(--chip);backdrop-filter:blur(4px)
}
.card .statrow{
  position:absolute;z-index:2;left:12px;right:12px;bottom:12px;display:grid;
  grid-template-columns:repeat(3,1fr);gap:6px;font-size:8px;font-weight:900;text-align:center;align-items:center
}
.card .statrow div{
  padding:6px 2px;border-radius:10px;background:var(--chip);backdrop-filter:blur(4px);white-space:nowrap
}
.card .statrow b{display:block;font-size:11px;line-height:1.05;margin-bottom:2px}
.card.silver .series,.card.silver .name,.card.silver .flag,.card.silver .clubmark,.card.silver .statrow div,
.card.gold .series,.card.gold .name,.card.gold .flag,.card.gold .clubmark,.card.gold .statrow div{box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}

.slot{
  position:absolute;transform:translate(-50%,-50%);width:76px;height:98px;border-radius:16px;
  border:1px dashed rgba(255,255,255,.28);background:rgba(0,0,0,.25);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;font-size:8px;padding:6px 5px
}
.slot strong{font-size:22px;line-height:1}
.slot b{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-transform:uppercase}
.slot.full{
  border:0;overflow:hidden;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);
  box-shadow:0 10px 18px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.16)
}
.slot.full.prospect{background:linear-gradient(160deg,#12304a,#1d4562)}
.slot.full.silver{background:linear-gradient(160deg,#d9e2eb,#8491a1);color:#0e141a;text-shadow:none}
.slot.full.gold{background:linear-gradient(160deg,#ffd96e,#a06a0a);color:#251804;text-shadow:none}
.slot.full.elite{background:linear-gradient(160deg,#4f1c8f,#190f30)}
.slot.full.immortal{background:linear-gradient(160deg,#c32738,#2c0509)}
.slot.full.mythic{background:linear-gradient(160deg,#0a0d14,#4a3b13)}
.slot.full.dynasty{background:linear-gradient(160deg,#14502a,#0b140d)}
.slot.full.glitch{background:linear-gradient(160deg,#0a4d66,#260b2f)}
.slot.full.evolution{background:linear-gradient(160deg,#0aa46b,#063122)}
.slot.full .need{opacity:.9}
.slot .need{font-size:7px;color:#afc2b9;margin-top:2px}
.slot .offpos{color:#ffd469}
.slot.full .offpos{color:#ffef98}

.mini{width:52px;height:66px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:1000;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.mini.prospect{background:linear-gradient(160deg,#15314b,#1f435c)}
.mini.silver{background:linear-gradient(160deg,#dae4ec,#7f8c9c);color:#11161c}
.mini.gold{background:linear-gradient(160deg,#f4cf67,#8f6108);color:#241706}
.mini.elite{background:linear-gradient(160deg,#7a2adc,#261139)}
.mini.immortal{background:linear-gradient(160deg,#d33142,#42070d);color:#ffe3a0}
.mini.mythic{background:linear-gradient(160deg,#0b0f15,#4e3d10)}
.mini.dynasty{background:linear-gradient(160deg,#267041,#0f2515)}
.mini.glitch{background:linear-gradient(160deg,#0d678a,#351046)}
.mini.evolution{background:linear-gradient(160deg,#16b883,#0a3728)}


.home-hero{padding:22px;border-radius:24px;border:1px solid var(--line);background:
 radial-gradient(circle at 84% 18%,rgba(53,229,138,.26),transparent 26%),
 linear-gradient(145deg,#16221d,#0c1512 58%,#0a1110);box-shadow:0 18px 40px rgba(0,0,0,.22)}
.home-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.home-hero h2{font-size:34px;line-height:.92;margin:10px 0 12px}
.home-hero p{font-size:12px;color:var(--muted);max-width:360px;margin:0}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:10px;font-weight:900;color:#d7e6de;white-space:nowrap}
.hero-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
.hero-actions button{border:0;border-radius:14px;padding:13px 12px;font-weight:1000}
.hero-actions .ghost{background:#17231e;color:#fff;border:1px solid var(--line)}
.hero-actions .alt{background:#0f1b17;color:#c7dad0;border:1px solid var(--line)}
.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.summary-chip{padding:14px 13px;border-radius:18px;background:linear-gradient(145deg,#14201b,#0d1512);border:1px solid var(--line)}
.summary-chip small{display:block;font-size:9px;letter-spacing:.12em;color:#9eb0a7;font-weight:900}
.summary-chip b{display:block;font-size:22px;margin-top:8px}
.summary-chip span{display:block;font-size:10px;color:var(--muted);margin-top:4px}
.home-row{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:12px}
.home-card{padding:16px;border-radius:20px;background:linear-gradient(145deg,#14201b,#0d1512);border:1px solid var(--line)}
.home-card h4{margin:0 0 6px;font-size:16px}
.home-card p{margin:0;color:var(--muted);font-size:11px;line-height:1.45}
.pack-spotlight{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pack-teaser{padding:12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.pack-teaser strong{display:block;font-size:13px}
.pack-teaser span{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.pack-teaser b{display:block;margin-top:9px;color:#ffe8a3;font-size:12px}
.home-mini-list{display:grid;gap:8px;margin-top:10px}
.home-mini-item{display:flex;justify-content:space-between;gap:10px;padding:10px 11px;border-radius:14px;background:#0d1512;border:1px solid var(--line);font-size:11px}
.home-mini-item b{font-size:11px}
.home-mini-item span{color:var(--muted)}
.walkout-sheet{padding:0;overflow:hidden;background:#08110e;border-radius:28px 28px 0 0}
.walkout-stage{position:relative;padding:18px 16px 26px;background:
 radial-gradient(circle at 50% 12%,rgba(53,229,138,.13),transparent 28%),
 linear-gradient(180deg,#0b1411,#08100e)}
.walkout-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px}
.walkout-top .left small{display:block;color:#9fb3a8;font-size:10px;letter-spacing:.16em;font-weight:900}
.walkout-top .left b{display:block;font-size:18px;margin-top:4px}
.walkout-top .skip{border:1px solid var(--line);background:#13201b;color:#fff;border-radius:999px;padding:9px 12px;font-weight:900;font-size:10px}
.walkout-arena{position:relative;min-height:230px;border-radius:24px;margin-top:14px;background:
 radial-gradient(circle at 50% 0,rgba(255,217,109,.08),transparent 45%),
 linear-gradient(180deg,#101a17,#0b1210);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center}
.walkout-arena:before{content:'';position:absolute;left:50%;top:-16%;width:180px;height:180px;transform:translateX(-50%);background:radial-gradient(circle,rgba(255,255,255,.18),transparent 62%);filter:blur(2px)}
.walkout-beam{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:180px;height:180px;border-radius:50%;filter:blur(8px);opacity:.9}
.walkout-beam.gold{background:radial-gradient(circle,rgba(255,220,130,.75),transparent 65%)}
.walkout-beam.elite{background:radial-gradient(circle,rgba(195,117,255,.7),transparent 65%)}
.walkout-beam.immortal{background:radial-gradient(circle,rgba(255,96,111,.72),transparent 65%)}
.walkout-beam.legend{background:radial-gradient(circle,rgba(255,218,109,.82),transparent 60%)}
.pack-shell{position:relative;width:136px;height:188px;border-radius:24px;border:1px solid rgba(255,255,255,.16);box-shadow:0 20px 35px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;transform:translateY(8px)}
.pack-shell.basic{background:linear-gradient(160deg,#2b3d34,#111814)}
.pack-shell.standard{background:linear-gradient(160deg,#3a4a2c,#121710)}
.pack-shell.prime{background:linear-gradient(160deg,#69501c,#1a1309)}
.pack-shell.elite{background:linear-gradient(160deg,#542780,#17101f)}
.pack-shell.legend{background:linear-gradient(160deg,#7c2136,#170d12)}
.pack-shell:before{content:'';position:absolute;inset:10px;border-radius:18px;border:1px solid rgba(255,255,255,.12)}
.pack-shell .xi-mark{font-size:50px;font-weight:1000;letter-spacing:.08em;opacity:.95}
.pack-shell .shell-label{position:absolute;bottom:14px;left:14px;right:14px;text-align:center;font-size:10px;font-weight:1000;letter-spacing:.16em}
.walkout-message{position:absolute;left:16px;right:16px;bottom:18px;text-align:center;font-size:12px;color:#d8e6df;line-height:1.45}
.reveal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}
.reveal-slot{min-height:232px;border-radius:18px;border:1px dashed rgba(255,255,255,.16);background:rgba(255,255,255,.03);display:flex;align-items:center;justify-content:center;padding:4px}
.reveal-slot .placeholder{font-size:11px;color:#8ea29a;text-align:center;line-height:1.5}
.reveal-slot .card{width:100%;min-width:0;height:auto;aspect-ratio:156/228}
.walkout-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 18px}
.odds-box{margin-top:14px;padding:14px;border-radius:18px;background:#0e1714;border:1px solid var(--line)}
.odds-box h4{margin:0 0 8px;font-size:14px}
.odds-grid{display:grid;gap:7px}
.odds-row{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:11px}
.odds-row span:last-child{color:#ffe7a3;font-weight:900}
.note{font-size:10px;color:var(--muted);margin-top:8px;line-height:1.45}
@media (max-width:520px){
  .hero-actions,.summary-strip,.home-row,.pack-spotlight,.walkout-actions{grid-template-columns:1fr 1fr}
  .hero-actions button:last-child,.home-row > :first-child{grid-column:1/-1}
  .summary-strip{grid-template-columns:1fr 1fr}
}

</style>
<script>
/* This tiny function is intentionally independent of the rest of the app.
   Even if another feature has an error, CREATE CLUB still exits the setup screen. */
function createClub(){
  var input=document.getElementById("clubNameInput");
  var name=input && input.value ? input.value.replace(/^\s+|\s+$/g,"") : "";
  if(!name){name="Vertex XI";}
  try{localStorage.setItem("xi_club_name",name);}catch(e){}
  var setup=document.getElementById("setup");
  var app=document.getElementById("app");
  if(setup){setup.style.display="none";}
  if(app){app.style.display="block";}
  if(window.finishCreateClub){
    try{window.finishCreateClub(name);}catch(e){}
  }
  return false;
}
</script>
</head>
<body>
<div style="position:fixed;right:8px;top:8px;z-index:2000;font:9px Arial;color:#5f7269">XI v2.3</div>

<div id="setup" class="setup">
  <form id="clubForm" class="setup-card" method="get" action="./">
    <div class="eyebrow">WELCOME TO</div>
    <h1>XI</h1>
    <p>Create your club and open your first pack.</p>
    <input id="clubNameInput" name="club" maxlength="24" value="" placeholder="Club name" autocomplete="off">
    <button type="submit" class="btn green">CREATE CLUB</button>
    <div id="setupError" class="error"></div>
  </form>
</div>

<div id="app" class="app" style="display:none">
  <section id="home" class="screen page"></section>
  <section id="play" class="screen page hidden"></section>
  <section id="squad" class="screen page hidden"></section>
  <section id="club" class="screen page hidden"></section>
  <section id="market" class="screen page hidden"></section>

  <nav class="nav">
    <button class="navbtn active" data-page="home"><i>⌂</i>HOME</button>
    <button class="navbtn" data-page="play"><i>▶</i>PLAY</button>
    <button class="navbtn" data-page="squad"><i>▦</i>SQUAD</button>
    <button class="navbtn" data-page="club"><i>◈</i>CLUB</button>
    <button class="navbtn" data-page="market"><i>◎</i>MARKET</button>
  </nav>
</div>

<div id="modal" class="modal hidden"><div id="sheet" class="sheet"></div></div>

<script>

    if(ovr<85)return 19000+(ovr-80)*3500;
    if(ovr<90)return 38000+(ovr-85)*9000;
    if(ovr<95)return 90000+(ovr-90)*20000;
    if(ovr<100)return 220000+(ovr-95)*50000;
    return 550000+(ovr-100)*125000;
  }

  function cardType(p){

    var n=((p.id||0)*17 + (p.ovr||0) + (p.evo||0)*13);
    if((p.evo||0)>0){return 'evolution';}
    if((p.ovr||0)>=102){return 'mythic';}
    if((p.ovr||0)>=95 && n%11===0){return 'dynasty';}
    if((p.ovr||0)>=88 && n%7===0){return 'glitch';}
    if((p.ovr||0)>=95){return 'immortal';}
    if((p.ovr||0)>=85){return 'elite';}
    if((p.ovr||0)>=75){return 'gold';}
    if((p.ovr||0)>=60){return 'silver';}
    return 'prospect';

  function formationSlots(){

  function compatible(playerPos,slotPos){
    if(playerPos===slotPos)return 40;
    var groups={
      GK:["GK"],
      CB:["CB","LB","RB","CDM"],
      LB:["LB","LWB","CB","LM"],
      RB:["RB","RWB","CB","RM"],
      LWB:["LB","LWB","LM","LW"],
      RWB:["RB","RWB","RM","RW"],
      CDM:["CDM","CM","CB"],
      CM:["CM","CDM","CAM"],
      CAM:["CAM","CM","ST","LW","RW"],
      LM:["LM","LW","CM","LWB"],
      RM:["RM","RW","CM","RWB"],
      LW:["LW","LM","RW","ST","CAM"],
      RW:["RW","RM","LW","ST","CAM"],
      ST:["ST","CAM","LW","RW"]
    };
    var g=groups[slotPos]||[slotPos];
    var idx=g.indexOf(playerPos);
    return idx<0?-25:(24-idx*5);
  }

  function bestAssign(ids){
    var slots=formationSlots(),players=[],i,p,j,best,bestScore,score,result=[];
    for(i=0;i<ids.length;i++){p=byId(ids[i]);if(p)players.push(p);}
    for(i=0;i<slots.length;i++){
      best=-1;bestScore=-9999;
      for(j=0;j<players.length;j++){
        if(!players[j])continue;
        score=players[j].ovr+compatible(players[j].pos,slots[i][0]);
        if(score>bestScore){bestScore=score;best=j;}
      }
      if(best>=0){result[i]=players[best].id;players[best]=null;}
    }
    return result;
  }

  function reassignCurrentSquad(){
    var ids=[],seen={},i,id;
    for(i=0;i<state.squad.length;i++){
      id=state.squad[i];
      if(id&&!seen[id]){seen[id]=true;ids.push(id);}
    }
    state.squad=bestAssign(ids);
  }

  function todayKey(){
    var d=new Date();
    return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  }

  function ensureDaily(){
    var k=todayKey();
    if(state.dailyDate!==k){
      state.dailyDate=k;
      state.dailyPlayed=0;state.dailyWins=0;state.dailyGoals=0;state.dailyClaims={};
    }
  }

  function taskClaimed(key){ensureDaily();return !!state.dailyClaims[key];}
  function taskReady(key){
    ensureDaily();
    if(key==="play3")return state.dailyPlayed>=3;
    if(key==="win2")return state.dailyWins>=2;
    if(key==="goals6")return state.dailyGoals>=6;
    return false;
  }

  function claimTask(key,reward){
    ensureDaily();
    if(taskClaimed(key)||!taskReady(key))return;
    state.dailyClaims[key]=true;
    state.coins+=reward;
    save();home();XI.starHub();
  }

  function grantReady(){
    return state.coins<1000 && (Date.now()-(state.lastGrant||0)>=24*60*60*1000);
  }

  function sanitizeSquad(){
    if(!Array.isArray(state.squad)){state.squad=[];return;}
    var seen={},clean=[],i,id;
    for(i=0;i<state.squad.length && i<11;i++){
      id=state.squad[i];
      if(id && !seen[id]){seen[id]=true;clean[i]=id;}
      else{clean[i]=null;}
    }
    state.squad=clean;
  }

  function packPool(minOvr,maxOvr){
    var out=[],i,p;
    for(i=0;i<db.length;i++){
      p=db[i];
      if(p.ovr>=minOvr && p.ovr<=maxOvr && state.owned.indexOf(p.id)<0)out.push(p);
    }
    return out;
  }

  function randomFromPool(minOvr,maxOvr,exclude){
    var pool=packPool(minOvr,maxOvr),filtered=[],i,p;
    for(i=0;i<pool.length;i++){
      p=pool[i];
      if(exclude.indexOf(p.id)<0)filtered.push(p);
    }
    if(!filtered.length)return null;
    return filtered[Math.floor(Math.random()*filtered.length)];
  }

  function oddsMarkup(c){
    var html='',i,t;
    for(i=0;i<c.tiers.length;i++){
      t=c.tiers[i];
      html+='<div class="odds-row"><span>'+t.label+'</span><span>'+t.rate+'%</span></div>';
    }
    return html;
  }

  function rollPackTier(c){
    var roll=Math.random()*100,total=0,i;
    for(i=0;i<c.tiers.length;i++){
      total+=c.tiers[i].rate;
      if(roll<=total)return c.tiers[i];
    }
    return c.tiers[c.tiers.length-1];
  }

  function weightedPick(c,exclude){
    var tries=0,t,p;
    while(tries<12){
      t=rollPackTier(c);
      p=randomFromPool(t.min,Math.min(t.max,c.maxOvr),exclude);
      if(p)return p;
      tries++;
    }
    return randomFromPool(45,c.maxOvr,exclude);
  }

    document.getElementById('modal').classList.remove('hidden');

    picks=picks.slice().sort(function(a,b){return byId(b).ovr-byId(a).ovr;});
    function populatePlaceholders(){
      var grid=document.getElementById('revealGrid'),j;
      if(!grid)return;
      grid.innerHTML='';
      for(j=0;j<picks.length;j++){
        grid.innerHTML+='<div class="reveal-slot" id="revealSlot'+j+'"><div class="placeholder">CARD '+(j+1)+'</div></div>';
      }
    }
    function finishReveal(){
      var msg=document.getElementById('walkoutMessage'),actions=document.getElementById('walkoutActions');
      if(msg)msg.innerHTML=best>=90?'Huge pull. Check your best cards first.':'Pack completed. Cards sent to your club.';
      if(actions)actions.classList.remove('hidden');
    }
    function revealOne(idx){
      var slot=document.getElementById('revealSlot'+idx),q;
      if(!slot)return;
      q=byId(picks[idx]);
      if(q)slot.innerHTML=card(q,'');
      if(idx===picks.length-1){finishReveal();}
    }
    populatePlaceholders();
    walkoutTimers.push(setTimeout(function(){
      var msg=document.getElementById('walkoutMessage');
      if(msg)msg.innerHTML=best>=90?'Walkout! Highest pull: '+best+' OVR':'Revealing '+c.count+' cards';
    },700));
    for(i=0;i<picks.length;i++){
      (function(idx){ walkoutTimers.push(setTimeout(function(){revealOne(idx);},1200+idx*260)); })(i);
    }
    walkoutTimers.push(setTimeout(finishReveal,1400+picks.length*260));
    XI._skipCurrentReveal=function(){
      clearWalkoutTimers();
      populatePlaceholders();
      for(var z=0;z<picks.length;z++){revealOne(z);} 
      finishReveal();
    };
  }

      }
      document.getElementById("sheet").innerHTML='<div class="sheettop"><h3>Add '+escapeHTML(p.name)+'</h3><button class="close" onclick="XI.close()">×</button></div>'+
        '<p class="sub">Pick any position. Off-position players are allowed.</p><div class="formation-list">'+html+'</div>';
      document.getElementById("modal").classList.remove("hidden");
    },
    autoSquad:function(){
      var ids=[],list=owned(),i;
      for(i=0;i<list.length;i++)ids.push(list[i].id);
      state.squad=bestAssign(ids);
      save();squad();home();
    },
    match:function(){
      ensureDaily();
      var team=[],i,p,sum=0;
      for(i=0;i<state.squad.length;i++){p=byId(state.squad[i]);if(p){team.push(p);sum+=p.ovr;}}
      if(team.length<11){
        document.getElementById("matchlog").innerHTML="You need a full starting XI (11 players) before you can play.";
        return;
      }
      var avg=sum/team.length;
      var my=Math.max(0,Math.floor((avg-55)/18+Math.random()*3));
      var opp=Math.max(0,Math.floor((75-55)/18+Math.random()*3));
      document.getElementById("score").innerHTML=my+"–"+opp;
      document.getElementById("matchlog").innerHTML="18' Early pressure from both sides.<br>37' Big chance created.<br>62' Goal threat builds.<br>84' Final push.<br><b>FT · "+my+"-"+opp+"</b>";
      state.dailyPlayed++;state.dailyGoals+=my;
      if(my>opp){state.wins++;state.dailyWins++;state.coins+=400;}
      else if(my<opp){state.losses++;state.coins+=150;}
      else{state.draws++;state.coins+=250;}
      for(i=0;i<team.length;i++){team[i].games++;}
      save();home();
    },
    searchClub:function(q){
      q=String(q||"").toLowerCase();
      var list=owned(),html="",i,p;
      for(i=0;i<list.length;i++){
        p=list[i];
        if(!q || p.name.toLowerCase().indexOf(q)>=0 || p.club.toLowerCase().indexOf(q)>=0 || p.pos.toLowerCase().indexOf(q)>=0){html+=card(p);}
      }
      document.getElementById("collectionGrid").innerHTML=html||'<div class="panel">No matches.</div>';
    },
    evos:function(){
      var list=owned().sort(function(a,b){return b.pot-a.pot;}).slice(0,8),html="",i;
      for(i=0;i<list.length;i++){html+=card(list[i]);}
      document.getElementById("sheet").innerHTML=
        '<div class="sheettop"><h3>EVOLUTION LAB</h3><button class="close" onclick="XI.close()">×</button></div>'+
        '<div class="panel"><div class="eyebrow">ACTIVE SLOTS</div><h2>'+state.evoSlots+' / 7</h2><p class="sub">Upgrade players through unique evolution paths.</p>'+
        '<button class="btn dark" onclick="XI.buySlot()">UNLOCK NEXT SLOT</button></div>'+
        '<div class="heading"><h3>Recommended</h3></div><div class="cards">'+html+'</div>';
      document.getElementById("modal").classList.remove("hidden");
    },
    buySlot:function(){
      var costs=[0,0,25000,75000,200000,500000,1000000];
      if(state.evoSlots>=7)return;
      var cost=costs[state.evoSlots];
      if(state.coins<cost)return;
      state.coins-=cost;state.evoSlots++;save();home();XI.evos();
    },
    evolve:function(id){
      var p=byId(id);if(!p)return;
      var cost=6000+p.ovr*100;
      if(state.coins<cost || p.ovr>=p.pot)return;
      state.coins-=cost;
      p.ovr=Math.min(p.pot,p.ovr+1);p.evo++;
      if(p.stats.PAC!=null)p.stats.PAC=Math.min(145,p.stats.PAC+3);
      if(p.stats.DRI!=null)p.stats.DRI=Math.min(145,p.stats.DRI+2);
      p.rarity=p.ovr>=130?"immortal":p.ovr>=90?"elite":p.ovr>=75?"gold":"prospect";
      save();renderAll();XI.player(id);
    }
  };

  var navs=document.querySelectorAll(".navbtn"),n;
  for(n=0;n<navs.length;n++){
    navs[n].onclick=function(){XI.go(this.getAttribute("data-page"));};
  }

  load();
  if(!state.testGrant5m){
    state.coins=5000000;
    state.testGrant5m=true;
  }
  sanitizeSquad();
  if((state.buildVersion||0)<23){
    ensureFullStarterClub();
    state.squad=bestAssign(state.owned);
    state.buildVersion=23;
  }
  save();

  if(state.club){
    document.getElementById("setup").style.display="none";
    document.getElementById("app").style.display="block";
    renderAll();
    XI.go("home");
  }else{
    document.getElementById("setup").style.display="flex";
    document.getElementById("app").style.display="none";
  }
})();
</script>
</body>
</html>
