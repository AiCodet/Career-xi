<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#07110d">
<title>XI</title>
<style>
:root{
  --bg:#07100d;--panel:#101915;--panel2:#15221c;--line:rgba(255,255,255,.09);
  --text:#f6fbf8;--muted:#8fa39a;--green:#35e58a;--gold:#ffd264;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.setup{position:fixed;inset:0;z-index:100;background:
 radial-gradient(circle at 75% 15%,rgba(53,229,138,.22),transparent 35%),
 linear-gradient(#06100c,#070b0a 55%,#070b0a);
 display:flex;align-items:center;justify-content:center;padding:20px}
.setup-card{width:min(560px,94vw);padding:20px;border-radius:24px;background:rgba(17,27,24,.96);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.38)}
.eyebrow{font-size:10px;letter-spacing:.16em;color:#b8cbc2;font-weight:800}
.setup-card h1{font-size:36px;margin:5px 0 10px;letter-spacing:.06em}
.setup-card p{font-size:12px;color:var(--muted)}
.setup-card input{width:100%;margin-top:10px;padding:13px 14px;background:#09110f;border:1px solid var(--line);border-radius:13px;color:white;outline:none}
.btn{width:100%;margin-top:10px;padding:13px 14px;border:0;border-radius:13px;font-weight:900}
.btn.green{background:var(--green);color:#062014}
.btn.dark{background:#17221e;color:#fff;border:1px solid var(--line)}
.app{width:100%;max-width:none;margin:0;min-height:100vh;padding-bottom:96px;background:
 radial-gradient(circle at 90% 5%,rgba(53,229,138,.11),transparent 28%),#08100e}
.screen{width:100%;padding:22px 18px 116px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.logo{font-size:29px;font-weight:1000;letter-spacing:.08em}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.coins{font-size:14px;font-weight:900;padding:8px 11px;border-radius:999px;background:rgba(255,210,100,.12);border:1px solid rgba(255,210,100,.25);color:#ffe8a3}
.hero{padding:20px;border-radius:24px;min-height:210px;background:
 radial-gradient(circle at 85% 20%,rgba(53,229,138,.24),transparent 35%),
 linear-gradient(145deg,#16221d,#0d1512);border:1px solid var(--line)}
.hero h2{font-size:31px;line-height:.96;margin:10px 0}
.hero p{font-size:12px;color:var(--muted);max-width:300px}
.smallbtn{display:inline-block;border:0;border-radius:12px;padding:11px 14px;font-weight:900;background:var(--green);color:#052015;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{padding:15px;border-radius:18px;background:linear-gradient(145deg,#14201b,#0d1512);border:1px solid var(--line);min-height:105px}
.tile .ico{font-size:23px}
.tile b{display:block;font-size:14px;margin-top:13px}
.tile span{font-size:10px;color:var(--muted)}
.heading{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}
.heading h3{font-size:20px;margin:0}
.heading small{font-size:10px;color:var(--muted)}
.cards{display:flex;gap:10px;overflow:auto;padding-bottom:6px}
.card{width:138px;min-width:138px;height:198px;padding:10px;border-radius:16px;border:1px solid rgba(255,255,255,.14);position:relative;
 background:linear-gradient(145deg,#8a6a20,#30250e 60%,#171108);box-shadow:0 12px 24px rgba(0,0,0,.22)}
.card.prospect{background:linear-gradient(145deg,#4d6677,#17242c 60%,#0a1014)}
.card.elite{background:linear-gradient(145deg,#6743b1,#1d1536 60%,#0d0918)}
.card.immortal{background:linear-gradient(145deg,#c1435a,#35131c 60%,#13090c)}
.ovr{font-size:28px;font-weight:1000;line-height:1}
.pos{font-size:10px;font-weight:900}
.flag{font-size:16px;margin-top:2px}
.face{height:62px;margin:4px -4px;background:rgba(255,255,255,.08);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:31px}
.name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statrow{font-size:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:5px}
.nav{position:fixed;bottom:0;left:0;transform:none;width:100%;z-index:50;background:rgba(6,12,10,.95);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:transparent;border:0;color:#70817a;padding:8px 2px;font-size:11px;font-weight:800;border-radius:10px}
.nav button i{display:block;font-style:normal;font-size:21px;margin-bottom:2px}
.nav button.active{color:white;background:rgba(255,255,255,.06)}
.panel{padding:14px;border-radius:18px;background:#101915;border:1px solid var(--line)}
.pitch{height:min(760px,72vh);min-height:620px;border-radius:22px;position:relative;overflow:hidden;border:2px solid rgba(255,255,255,.12);background:
 linear-gradient(rgba(16,110,65,.88),rgba(11,77,48,.88))}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.18)}
.slot{position:absolute;transform:translate(-50%,-50%);width:72px;height:90px;border-radius:10px;border:1px dashed rgba(255,255,255,.28);background:rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:8px}
.slot.full{border-style:solid;background:linear-gradient(145deg,#8b6b22,#30240e)}
.slot strong{font-size:20px}
.search{width:100%;padding:12px 13px;border-radius:13px;background:#0c1512;border:1px solid var(--line);color:white;outline:none}
.collection{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.collection .card{width:100%;min-width:0;height:208px}
.market{padding:11px;border-radius:15px;background:#101915;border:1px solid var(--line);display:flex;align-items:center;gap:10px;margin-bottom:9px}
.mini{width:48px;height:61px;border-radius:9px;background:linear-gradient(145deg,#8a6a20,#2f240e);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:1000}
.market .info{flex:1;min-width:0}
.market .info b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.market .info small{font-size:9px;color:var(--muted)}
.price{font-size:11px;color:#ffe69d;font-weight:900;text-align:right}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-height:88vh;overflow:auto;background:#0b1310;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:15px 14px 26px}
.sheettop{display:flex;align-items:center;justify-content:space-between}
.sheettop h3{margin:3px 0 12px}
.close{width:34px;height:34px;border:0;border-radius:50%;background:#17221e;color:white}
.log{font-size:11px;line-height:1.55;min-height:135px;background:#08100e;border-radius:12px;padding:11px;color:#bac9c2;margin-top:10px}
.error{font-size:10px;color:#ff8e93;margin-top:8px;display:none}

.formbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.formbtn{border:1px solid var(--line);background:#17231e;color:#fff;padding:9px 11px;border-radius:12px;font-weight:900;font-size:12px}
.clubstrip{display:flex;gap:10px;overflow:auto;padding:2px 0 8px}
.clubstrip .clubplayer{min-width:124px;width:124px;padding:10px;border-radius:15px;background:#101915;border:1px solid var(--line)}
.clubplayer b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clubplayer small{color:var(--muted);font-size:9px}
.clubplayer .add{width:100%;margin-top:8px;border:0;border-radius:9px;padding:8px;background:#21352b;color:#baf6d5;font-size:10px;font-weight:900}
.formation-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.formation-option{border:1px solid var(--line);background:#101915;color:#fff;padding:13px;border-radius:14px;text-align:left;font-weight:900}
.formation-option.active{border-color:rgba(53,229,138,.55);background:rgba(53,229,138,.1)}
.slot .need{font-size:7px;color:#afc2b9;margin-top:2px}
.slot .offpos{color:#ffd469}
.reward{padding:14px;border-radius:16px;background:#101915;border:1px solid var(--line);margin-top:9px}
.rewardrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.reward b{font-size:13px}.reward small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.claim{border:0;border-radius:10px;padding:9px 11px;background:var(--green);color:#062014;font-size:10px;font-weight:1000}
.claim[disabled]{opacity:.35}
.signings-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.section-tabs{display:flex;gap:8px;margin-bottom:12px}.section-tabs button{flex:1;border:1px solid var(--line);border-radius:11px;padding:9px;background:#101915;color:#9eb0a7;font-weight:900}.section-tabs button.active{background:#fff;color:#07100d}


.pack-grid{display:grid;grid-template-columns:1fr;gap:10px}
.pack-option{padding:16px;border-radius:18px;background:linear-gradient(145deg,#121d18,#0b1310);border:1px solid var(--line)}
.pack-option h3{margin:2px 0 4px;font-size:18px}
.pack-option p{margin:0;color:var(--muted);font-size:10px;line-height:1.45}
.pack-option .packprice{font-weight:1000;color:#ffe79f;font-size:13px;margin-top:8px}
.pack-option .packtag{display:inline-block;font-size:8px;font-weight:1000;letter-spacing:.08em;padding:5px 7px;border-radius:999px;margin-bottom:7px;background:rgba(255,255,255,.06)}
.pack-option.basic{background:linear-gradient(145deg,#15231d,#0b1310)}
.pack-option.standard{background:linear-gradient(145deg,#283421,#11160e)}
.pack-option.prime{background:linear-gradient(145deg,#3b2f18,#171209)}
.pack-option.elitepack{background:linear-gradient(145deg,#3b2255,#17101f)}
.pack-option.legendpack{background:radial-gradient(circle at 80% 20%,rgba(255,212,105,.2),transparent 30%),linear-gradient(145deg,#4b1d2c,#1a0d12)}
.pack-option button{width:100%;margin-top:10px;border:0;border-radius:11px;padding:10px 12px;font-weight:1000;background:var(--green);color:#062014}
.pack-option button:disabled{opacity:.35}

</style>
<script>
/* This tiny function is intentionally independent of the rest of the app.
   Even if another feature has an error, CREATE CLUB still exits the setup screen. */
function createClub(){
  var input=document.getElementById("clubNameInput");
  var name=input && input.value ? input.value.replace(/^\s+|\s+$/g,"") : "";
  if(!name){name="Vertex XI";}
  try{localStorage.setItem("xi_club_name",name);}catch(e){}
  var setup=document.getElementById("setup");
  var app=document.getElementById("app");
  if(setup){setup.style.display="none";}
  if(app){app.style.display="block";}
  if(window.finishCreateClub){
    try{window.finishCreateClub(name);}catch(e){}
  }
  return false;
}
</script>
</head>
<body>
<div style="position:fixed;right:8px;top:8px;z-index:2000;font:9px Arial;color:#5f7269">XI v2.0 TEST</div>

<div id="setup" class="setup">
  <form id="clubForm" class="setup-card" method="get" action="./">
    <div class="eyebrow">WELCOME TO</div>
    <h1>XI</h1>
    <p>Create your club and open your first pack.</p>
    <input id="clubNameInput" name="club" maxlength="24" value="" placeholder="Club name" autocomplete="off">
    <button type="submit" class="btn green">CREATE CLUB</button>
    <div id="setupError" class="error"></div>
  </form>
</div>

<div id="app" class="app" style="display:none">
  <section id="home" class="screen page"></section>
  <section id="play" class="screen page hidden"></section>
  <section id="squad" class="screen page hidden"></section>
  <section id="club" class="screen page hidden"></section>
  <section id="market" class="screen page hidden"></section>

  <nav class="nav">
    <button class="navbtn active" data-page="home"><i>⌂</i>HOME</button>
    <button class="navbtn" data-page="play"><i>▶</i>PLAY</button>
    <button class="navbtn" data-page="squad"><i>▦</i>SQUAD</button>
    <button class="navbtn" data-page="club"><i>◈</i>CLUB</button>
    <button class="navbtn" data-page="market"><i>◎</i>MARKET</button>
  </nav>
</div>

<div id="modal" class="modal hidden"><div id="sheet" class="sheet"></div></div>

<script>
(function(){
  var firstNames=["Noah","Mateo","Luca","Elias","Malik","Caio","Ren","Emil","Thiago","Javier","Kai","Leo","Milan","Nico","Yuri","Sami","Adrian","Rafael","Tomas","Iker","Hugo","Dario","Marek","Jonas","Oscar","Enzo","Ari","Deni","Luis","Marco"];
  var lastNames=["Kovac","Varela","Diarra","Hartmann","Bellandi","Serrano","Nyberg","Velez","Ishikawa","Renner","Costa","Barreto","Mendes","Laurent","Romano","Silva","Petrovic","Moreau","Adler","Santos","Ferrer","Bauer","Marin","Ortega","Rossi","Adebayo","Keller","Navarro","Ribeiro","Novak"];
  var flags=["🇬🇧","🇪🇸","🇮🇹","🇩🇪","🇫🇷","🇧🇷","🇦🇷","🇭🇷","🇵🇹","🇳🇱","🇯🇵","🇸🇪","🇨🇴","🇺🇾","🇧🇪","🇩🇰","🇳🇬","🇬🇭"];
  var positions=["GK","RB","CB","CB","LB","CDM","CM","CAM","RW","LW","ST"];
  var clubs=["Kingsport FC","Westbridge United","Bromley Athletic","Northcastle FC","Redhaven","Riverside City","Blackthorn FC","Royal Vale","Real Azul","Costa Verde","Torino Rosso","Milano Stella","Rhein Adler","Berlin Kraft","Paris Royale","Lyon Argent","Aurora Rio","Santos Nova","Buenos Plata","Tokyo Nova"];
  var traits=["Burst","Rapid","Precision","Cannon","Flair","Control","Vision","Creator","Engine","Powerhouse","Wall","Aerial","Leader","Reflex"];

  function seeded(n){var x=Math.sin(n*913.73)*43758.5453;return x-Math.floor(x);}
  function rand(n,a,b){return Math.floor(seeded(n)*(b-a+1))+a;}
  function marketValue(ovr){
    if(ovr<60)return 300+(ovr-45)*120;
    if(ovr<70)return 2500+(ovr-60)*450;
    if(ovr<80)return 7000+(ovr-70)*1100;
    if(ovr<85)return 19000+(ovr-80)*3500;
    if(ovr<90)return 38000+(ovr-85)*9000;
    if(ovr<95)return 90000+(ovr-90)*20000;
    if(ovr<100)return 220000+(ovr-95)*50000;
    return 550000+(ovr-100)*125000;
  }

  function makeDB(){
    var arr=[],i,ovr,pot,pos,stats,rarity;
    for(i=1;i<=1500;i++){
      var r=seeded(i*7);
      if(r<.08)ovr=rand(i,45,54);
      else if(r<.25)ovr=rand(i,55,64);
      else if(r<.51)ovr=rand(i,65,74);
      else if(r<.79)ovr=rand(i,75,84);
      else if(r<.91)ovr=rand(i,85,89);
      else if(r<.973)ovr=rand(i,90,94);
      else if(r<.997)ovr=rand(i,95,99);
      else ovr=rand(i,100,104);

      pot=Math.min(145,Math.max(ovr,ovr+rand(i*4,5,43)));
      if(i===947){ovr=57;pot=145;}
      pos=positions[i%positions.length];

      function stat(offset,spread,min,max){
        var v=ovr+offset+rand(i*(offset+57)+spread*19,min,max);
        return Math.max(20,Math.min(145,v));
      }
      function bounded(offset,lo,hi){
        return Math.max(20,Math.min(145,ovr+offset+rand(i*(offset+73),lo,hi)));
      }

      if(pos==="GK"){
        stats={
          DIV:bounded(1,-4,5),
          HAN:bounded(-1,-5,4),
          KIC:bounded(-4,-7,5),
          REF:bounded(2,-4,5),
          SPD:Math.max(25,Math.min(145,ovr-28+rand(i*17,-5,8))),
          POS:bounded(1,-4,5)
        };
      }else if(pos==="CB"){
        stats={
          PAC:bounded(-13,-7,5),
          SHO:bounded(-40,-8,7),
          PAS:bounded(-14,-7,7),
          DRI:bounded(-20,-7,7),
          DEF:bounded(3,-3,3),
          PHY:bounded(1,-4,5)
        };
      }else if(pos==="RB" || pos==="LB"){
        stats={
          PAC:bounded(1,-5,6),
          SHO:bounded(-18,-8,7),
          PAS:bounded(-5,-6,6),
          DRI:bounded(-3,-6,6),
          DEF:bounded(-2,-5,5),
          PHY:bounded(-4,-6,6)
        };
      }else if(pos==="CDM"){
        stats={
          PAC:bounded(-7,-6,6),
          SHO:bounded(-15,-8,7),
          PAS:bounded(-2,-5,6),
          DRI:bounded(-6,-6,6),
          DEF:bounded(1,-4,4),
          PHY:bounded(0,-5,5)
        };
      }else if(pos==="CM"){
        stats={
          PAC:bounded(-5,-6,6),
          SHO:bounded(-5,-7,7),
          PAS:bounded(2,-4,5),
          DRI:bounded(0,-5,5),
          DEF:bounded(-8,-8,7),
          PHY:bounded(-5,-7,7)
        };
      }else if(pos==="CAM"){
        stats={
          PAC:bounded(-1,-5,6),
          SHO:bounded(0,-5,6),
          PAS:bounded(3,-3,5),
          DRI:bounded(3,-3,5),
          DEF:bounded(-32,-8,7),
          PHY:bounded(-14,-7,7)
        };
      }else if(pos==="RW" || pos==="LW"){
        stats={
          PAC:bounded(3,-3,5),
          SHO:bounded(-1,-5,6),
          PAS:bounded(0,-5,6),
          DRI:bounded(3,-3,5),
          DEF:bounded(-38,-7,7),
          PHY:bounded(-16,-7,7)
        };
      }else{
        stats={
          PAC:bounded(0,-5,6),
          SHO:bounded(4,-3,5),
          PAS:bounded(-8,-7,7),
          DRI:bounded(-1,-5,6),
          DEF:bounded(-42,-7,7),
          PHY:bounded(-2,-6,7)
        };
      }

      rarity=ovr>=100?"immortal":ovr>=90?"elite":ovr>=75?"gold":"prospect";
      arr.push({
        id:i,
        name:firstNames[i%firstNames.length]+" "+lastNames[(i*7)%lastNames.length],
        ovr:ovr,pot:pot,pos:pos,flag:flags[(i*3)%flags.length],
        club:clubs[(i*11)%clubs.length],
        trait:traits[(i*5)%traits.length],
        rarity:rarity,stats:stats,
        value:Math.round(marketValue(ovr)/50)*50,
        evo:0,games:0
      });
    }
    return arr;
  }

  var db=makeDB();
  var state={
    club:null,coins:2500,owned:[],squad:[],wins:0,draws:0,losses:0,level:1,evoSlots:2,formation:'4-3-3 Attack',dailyDate:'',dailyPlayed:0,dailyWins:0,dailyGoals:0,dailyClaims:{},lastGrant:0,buildVersion:0
  };

  function load(){
    try{
      var raw=localStorage.getItem("xi_v14_state");
      if(raw){
        var x=JSON.parse(raw);
        if(x && typeof x==="object"){
          for(var k in state){if(Object.prototype.hasOwnProperty.call(x,k)){state[k]=x[k];}}
        }
      }
      var params=new URLSearchParams(window.location.search);
      var queryClub=(params.get("club")||"").trim();
      if(queryClub){
        state.club=queryClub.slice(0,24);
        localStorage.setItem("xi_club_name",state.club);
      }
      var clubOnly=localStorage.getItem("xi_club_name");
      if(!state.club && clubOnly){state.club=clubOnly;}
    }catch(e){}
    if(!Array.isArray(state.owned)){state.owned=[];}
    if(!Array.isArray(state.squad)){state.squad=[];}
    if(!state.formation || !formations[state.formation])state.formation="4-3-3 Attack";
    if(!state.dailyClaims || typeof state.dailyClaims!=="object")state.dailyClaims={};
    ensureDaily();
  }
  function save(){
    try{localStorage.setItem("xi_v14_state",JSON.stringify(state));}catch(e){}
  }

  function byId(id){return db[id-1] || null;}
  function owned(){
    var out=[],i,p;
    for(i=0;i<state.owned.length;i++){p=byId(state.owned[i]);if(p){out.push(p);}}
    return out;
  }
  function top(title){
    return '<div class="top"><div><div class="logo">XI</div><div class="sub">'+escapeHTML(state.club||"YOUR CLUB")+' · LVL '+state.level+'</div></div>'+
      '<div class="coins">★ '+number(state.coins)+'</div></div>'+
      (title?'<div class="heading"><h3>'+title+'</h3></div>':'');
  }
  function escapeHTML(v){
    return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function number(v){return Number(v||0).toLocaleString();}
  function card(p,action){
    var keys=[],k;
    for(k in p.stats){if(Object.prototype.hasOwnProperty.call(p.stats,k)){keys.push(k);}}
    var st="",i;
    for(i=0;i<keys.length;i++){k=keys[i];st+='<div><b>'+p.stats[k]+'</b> '+k+'</div>';}
    var click=action||('XI.player('+p.id+')');
    return '<div class="card '+p.rarity+'" onclick="'+click+'">'+
      '<div class="ovr">'+p.ovr+'</div><div class="pos">'+p.pos+'</div>'+
      '<div class="flag">'+p.flag+'</div><div class="face">⚽</div>'+
      '<div class="name">'+escapeHTML(p.name)+'</div><div class="statrow">'+st+'</div></div>';

  function compatible(playerPos,slotPos){
    if(playerPos===slotPos)return 40;
    var groups={
      GK:["GK"],
      CB:["CB","LB","RB","CDM"],
      LB:["LB","LWB","CB","LM"],
      RB:["RB","RWB","CB","RM"],
      LWB:["LB","LWB","LM","LW"],
      RWB:["RB","RWB","RM","RW"],
      CDM:["CDM","CM","CB"],
      CM:["CM","CDM","CAM"],
      CAM:["CAM","CM","ST","LW","RW"],
      LM:["LM","LW","CM","LWB"],
      RM:["RM","RW","CM","RWB"],
      LW:["LW","LM","RW","ST","CAM"],
      RW:["RW","RM","LW","ST","CAM"],
      ST:["ST","CAM","LW","RW"]
    };
    var g=groups[slotPos]||[slotPos];
    var idx=g.indexOf(playerPos);
    return idx<0?-25:(24-idx*5);
  }

  function bestAssign(ids){
    var slots=formationSlots(),players=[],i,p,j,best,bestScore,score,result=[];
    for(i=0;i<ids.length;i++){p=byId(ids[i]);if(p)players.push(p);}
    for(i=0;i<slots.length;i++){
      best=-1;bestScore=-9999;
      for(j=0;j<players.length;j++){
        if(!players[j])continue;
        score=players[j].ovr+compatible(players[j].pos,slots[i][0]);
        if(score>bestScore){bestScore=score;best=j;}
      }
      if(best>=0){result[i]=players[best].id;players[best]=null;}
    }
    return result;
  }

  function packPool(minOvr,maxOvr){
    var out=[],i,p;
    for(i=0;i<db.length;i++){
      p=db[i];
      if(p.ovr>=minOvr && p.ovr<=maxOvr && state.owned.indexOf(p.id)<0)out.push(p);
    }
    return out;
  }

  function randomFromPool(minOvr,maxOvr,exclude){
    var pool=packPool(minOvr,maxOvr),filtered=[],i,p;
    for(i=0;i<pool.length;i++){
      p=pool[i];
      if(exclude.indexOf(p.id)<0)filtered.push(p);
    }
    if(!filtered.length)return null;
    return filtered[Math.floor(Math.random()*filtered.length)];
  }

  function weightedWithinCap(maxOvr,exclude,legendMode){
    var roll=Math.random()*100,min=45,max=59;

    if(legendMode){
      // Only Legend Pack can cross 89.
      // Per random slot:
      // 45–59 12%
      // 60–69 20%
      // 70–79 32%
      // 80–84 24%
      // 85–89 9.7%
      // 90–94 2.0%
      // 95–99 0.28%
      // 100–104 0.02%
      if(roll<12){min=45;max=59;}
      else if(roll<32){min=60;max=69;}
      else if(roll<64){min=70;max=79;}
      else if(roll<88){min=80;max=84;}
      else if(roll<97.7){min=85;max=89;}
      else if(roll<99.7){min=90;max=94;}
      else if(roll<99.98){min=95;max=99;}
      else{min=100;max=104;}
    }else{
      // Non-Legend packs never exceed their hard cap.
      if(maxOvr<=69){
        if(roll<62){min=45;max=54;}
        else{min=55;max=69;}
      }else if(maxOvr<=79){
        if(roll<45){min=45;max=59;}
        else if(roll<82){min=60;max=69;}
        else{min=70;max=79;}
      }else if(maxOvr<=84){
        if(roll<24){min=55;max=64;}
        else if(roll<62){min=65;max=74;}
        else if(roll<91){min=75;max=79;}
        else{min=80;max=84;}
      }else{
        if(roll<12){min=60;max=69;}
        else if(roll<42){min=70;max=79;}
        else if(roll<83){min=80;max=84;}
        else{min=85;max=89;}
      }
    }

    if(max>maxOvr)max=maxOvr;
    if(min>maxOvr)min=Math.max(45,maxOvr-4);

    var p=randomFromPool(min,max,exclude);
    if(p)return p;
    return randomFromPool(45,maxOvr,exclude);
  }

      function task(key,title,progress,target,reward){
        var ready=progress>=target,claimed=taskClaimed(key);
        return '<div class="reward"><div class="rewardrow"><div><b>'+title+'</b><small>'+Math.min(progress,target)+' / '+target+' · ★ '+reward+'</small></div>'+
          '<button class="claim" '+((!ready||claimed)?'disabled':'')+' onclick="XI.claimStars(\''+key+'\','+reward+')">'+(claimed?'CLAIMED':ready?'CLAIM':'LOCKED')+'</button></div></div>';
      }
      document.getElementById("sheet").innerHTML='<div class="sheettop"><h3>Earn Stars</h3><button class="close" onclick="XI.close()">×</button></div>'+
        '<div class="panel"><div class="eyebrow">DAILY CLUB GOALS</div><h2 style="margin:5px 0">★ '+number(state.coins)+'</h2><p class="sub">Stars are deliberately grindy: a pack should take several matches, not one.</p></div>'+
        task("play3","Play 3 matches",state.dailyPlayed,3,500)+
        task("win2","Win 2 matches",state.dailyWins,2,650)+
        task("goals6","Score 6 goals",state.dailyGoals,6,450)+
        '<div class="reward"><div class="rewardrow"><div><b>Club Support Grant</b><small>Only available below ★ 1,000 · once every 24h · ★ 500</small></div>'+
        '<button class="claim" '+(grant?'':'disabled')+' onclick="XI.clubGrant()">'+(grant?'CLAIM':'LOCKED')+'</button></div></div>';
      document.getElementById("modal").classList.remove("hidden");
    },
    claimStars:function(key,reward){claimTask(key,reward);},
    clubGrant:function(){
      if(!grantReady())return;
      state.coins+=500;state.lastGrant=Date.now();save();home();XI.starHub();
    },
    player:function(id){
      var p=byId(id);if(!p)return;
      var ownedFlag=state.owned.indexOf(id)>=0;
      document.getElementById("sheet").innerHTML=
        '<div class="sheettop"><h3>'+escapeHTML(p.name)+'</h3><button class="close" onclick="XI.close()">×</button></div>'+
        '<div style="display:flex;justify-content:center;margin:10px 0 18px">'+card(p)+'</div>'+
        '<div class="panel"><b>'+p.flag+' '+escapeHTML(p.club)+'</b>'+
        '<div class="sub" style="margin-top:6px">'+p.pos+' · '+p.trait+' · '+p.games+' apps</div>'+
        '<div style="display:flex;justify-content:space-between;margin-top:8px"><span>Evolution</span><b>E'+p.evo+'</b></div></div>'+
        (ownedFlag?'<button class="btn green" onclick="XI.evolve('+p.id+')">EVOLVE · ★ '+number(6000+p.ovr*100)+'</button>':'');
      document.getElementById("modal").classList.remove("hidden");
    },
    close:function(){document.getElementById("modal").classList.add("hidden");},
    openPack:function(){
      var order=["basic","standard","prime","elite","legend"],html="",i,c;
      for(i=0;i<order.length;i++){
        c=packConfigs[order[i]];
        html+='<div class="pack-option '+c.cls+'">'+
          '<div class="packtag">'+(c.key==="legend"?"90+ AVAILABLE":"90+ LOCKED")+'</div>'+
          '<h3>'+c.name+'</h3>'+
          '<p>'+c.desc+'</p>'+
          '<p style="margin-top:6px">'+c.odds+'</p>'+
          '<div class="packprice">★ '+number(c.price)+'</div>'+
          '<button '+(state.coins<c.price?'disabled':'')+' onclick="XI.buyPack(\''+c.key+'\')">OPEN PACK</button>'+
          '</div>';
      }
      document.getElementById("sheet").innerHTML=
        '<div class="sheettop"><h3>Pack Store</h3><button class="close" onclick="XI.close()">×</button></div>'+
        '<div class="pack-grid">'+html+'</div>';
      document.getElementById("modal").classList.remove("hidden");
    },
    buyPack:function(key){
      var c=packConfigs[key];
      if(!c || state.coins<c.price)return;

      state.coins-=c.price;
      var picks=[],i,p;

      p=randomFromPool(c.guarantee[0],c.guarantee[1],picks);
      if(!p)p=weightedWithinCap(c.maxOvr,picks,c.key==="legend");
      if(p){picks.push(p.id);state.owned.push(p.id);}

      for(i=1;i<c.count;i++){
        p=weightedWithinCap(c.maxOvr,picks,c.key==="legend");
        if(p){
          picks.push(p.id);
          state.owned.push(p.id);
        }
      }

      save();
      renderAll();

      var cardsHtml="",q;
      for(i=0;i<picks.length;i++){
        q=byId(picks[i]);
        if(q)cardsHtml+=card(q);
      }

      document.getElementById("sheet").innerHTML=
        '<div class="sheettop"><h3>'+c.name+' OPENED</h3><button class="close" onclick="XI.close()">×</button></div>'+
        '<div class="cards">'+cardsHtml+'</div>'+
        '<button class="btn green" onclick="XI.openPack()">BACK TO PACK STORE</button>'+
        '<button class="btn dark" onclick="XI.close()">SEND TO CLUB</button>';
    },
    pack:function(){XI.buyPack("standard");},
    buy:function(id){
      var p=byId(id);if(!p || state.owned.indexOf(id)>=0 || state.coins<p.value)return;
      state.coins-=p.value;state.owned.push(id);save();renderAll();market();
    },
    pick:function(index){
      sanitizeSquad();
      var list=owned().sort(function(a,b){return b.ovr-a.ovr;}),html="",i,usedAt=-1,p,slots=formationSlots();
      for(i=0;i<list.length;i++){
        p=list[i];usedAt=state.squad.indexOf(p.id);
        html+=card(p,'XI.placeOrSwap('+index+','+p.id+')');
      }
      if(!html)html='<div class="panel">No players available.</div>';
      document.getElementById("sheet").innerHTML='<div class="sheettop"><h3>'+slots[index][0]+' · Choose or move player</h3><button class="close" onclick="XI.close()">×</button></div>'+
        '<p class="sub">Selecting a player already in your XI swaps the two positions.</p><div class="cards" style="flex-wrap:wrap">'+html+'</div>';
      document.getElementById("modal").classList.remove("hidden");
    },
    placeOrSwap:function(index,id){
      sanitizeSquad();
      var current=state.squad[index]||null,other=state.squad.indexOf(id);
      if(other>=0 && other!==index){
        state.squad[other]=current;
        state.squad[index]=id;
      }else{
        state.squad[index]=id;
      }
      save();XI.close();squad();home();
    },
    setSlot:function(index,id){XI.placeOrSwap(index,id);},
    addFromClub:function(id){
      var slots=formationSlots(),html="",i,p=byId(id);
      if(!p)return;
      for(i=0;i<slots.length;i++){
        html+='<button class="formation-option" onclick="XI.placeOrSwap('+i+','+id+')">'+slots[i][0]+' · slot '+(i+1)+'</button>';
      }
      document.getElementById("sheet").innerHTML='<div class="sheettop"><h3>Add '+escapeHTML(p.name)+'</h3><button class="close" onclick="XI.close()">×</button></div>'+
        '<p class="sub">Pick any position. Off-position players are allowed.</p><div class="formation-list">'+html+'</div>';
      document.getElementById("modal").classList.remove("hidden");
    },
    autoSquad:function(){
      var ids=[],list=owned(),i;
      for(i=0;i<list.length;i++)ids.push(list[i].id);
      state.squad=bestAssign(ids);
      save();squad();home();
    },
    match:function(){
      ensureDaily();
      var team=[],i,p,sum=0;
      for(i=0;i<state.squad.length;i++){p=byId(state.squad[i]);if(p){team.push(p);sum+=p.ovr;}}
      if(team.length<11){
        document.getElementById("matchlog").innerHTML="You need a full starting XI (11 players) before you can play.";
        return;
      }
      var avg=sum/team.length;
      var my=Math.max(0,Math.floor((avg-55)/18+Math.random()*3));
      var opp=Math.max(0,Math.floor((75-55)/18+Math.random()*3));
      document.getElementById("score").innerHTML=my+"–"+opp;
      document.getElementById("matchlog").innerHTML="18' Early pressure from both sides.<br>37' Big chance created.<br>62' Goal threat builds.<br>84' Final push.<br><b>FT · "+my+"-"+opp+"</b>";
      state.dailyPlayed++;state.dailyGoals+=my;
      if(my>opp){state.wins++;state.dailyWins++;state.coins+=400;}
      else if(my<opp){state.losses++;state.coins+=150;}
      else{state.draws++;state.coins+=250;}
      for(i=0;i<team.length;i++){team[i].games++;}
      save();home();
    },
    searchClub:function(q){
      q=String(q||"").toLowerCase();
      var list=owned(),html="",i,p;
      for(i=0;i<list.length;i++){
        p=list[i];
        if(!q || p.name.toLowerCase().indexOf(q)>=0 || p.club.toLowerCase().indexOf(q)>=0 || p.pos.toLowerCase().indexOf(q)>=0){html+=card(p);}
      }
      document.getElementById("collectionGrid").innerHTML=html||'<div class="panel">No matches.</div>';
    },
    evos:function(){
      var list=owned().sort(function(a,b){return b.pot-a.pot;}).slice(0,8),html="",i;
      for(i=0;i<list.length;i++){html+=card(list[i]);}
      document.getElementById("sheet").innerHTML=
        '<div class="sheettop"><h3>EVOLUTION LAB</h3><button class="close" onclick="XI.close()">×</button></div>'+
        '<div class="panel"><div class="eyebrow">ACTIVE SLOTS</div><h2>'+state.evoSlots+' / 7</h2><p class="sub">Upgrade players through unique evolution paths.</p>'+
        '<button class="btn dark" onclick="XI.buySlot()">UNLOCK NEXT SLOT</button></div>'+
        '<div class="heading"><h3>Recommended</h3></div><div class="cards">'+html+'</div>';
      document.getElementById("modal").classList.remove("hidden");
    },
    buySlot:function(){
      var costs=[0,0,25000,75000,200000,500000,1000000];
      if(state.evoSlots>=7)return;
      var cost=costs[state.evoSlots];
      if(state.coins<cost)return;
      state.coins-=cost;state.evoSlots++;save();home();XI.evos();
    },
    evolve:function(id){
      var p=byId(id);if(!p)return;
      var cost=6000+p.ovr*100;
      if(state.coins<cost || p.ovr>=p.pot)return;
      state.coins-=cost;
      p.ovr=Math.min(p.pot,p.ovr+1);p.evo++;
      if(p.stats.PAC!=null)p.stats.PAC=Math.min(145,p.stats.PAC+3);
      if(p.stats.DRI!=null)p.stats.DRI=Math.min(145,p.stats.DRI+2);
      p.rarity=p.ovr>=130?"immortal":p.ovr>=90?"elite":p.ovr>=75?"gold":"prospect";
      save();renderAll();XI.player(id);
    }
  };

  var navs=document.querySelectorAll(".navbtn"),n;
  for(n=0;n<navs.length;n++){
    navs[n].onclick=function(){XI.go(this.getAttribute("data-page"));};
  }

  load();
  if(!state.testGrant5m){
    state.coins=5000000;
    state.testGrant5m=true;
  }
  sanitizeSquad();
  if((state.buildVersion||0)<18){
    ensureFullStarterClub();
    state.squad=bestAssign(state.owned);
    state.buildVersion=18;
  }
  save();

  if(state.club){
    document.getElementById("setup").style.display="none";
    document.getElementById("app").style.display="block";
    renderAll();
    XI.go("home");
  }else{
    document.getElementById("setup").style.display="flex";
    document.getElementById("app").style.display="none";
  }
})();
</script>
</body>
</html>
