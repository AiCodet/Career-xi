}

}
.v33-form .W{background:#153d24;color:#79f0ac}

}

  background:rgba(7,14,24,.62);border:1px solid #2a4363;color:#edf4fb;
  padding:7px 10px;border-radius:999px;font-size:11px
}
.v33-split{
  display:grid;grid-template-columns:1.1fr .9fr;gap:14px
}
.v33-list{
  display:grid;gap:8px
}

  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 0;border-bottom:1px solid #182941;font-size:12px
}
.v33-row:last-child{border-bottom:0}
.v33-note{
  background:#0b1626;border:1px solid #1b2d49;border-radius:12px;padding:12px;font-size:13px;line-height:1.4;color:#dfe9f2
}
.v33-dual{
  display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #1b2e4a;border-radius:14px;overflow:hidden
}
.v33-dual > div{padding:14px;background:rgba(10,18,31,.68)}
.v33-dual > div + div{border-left:1px solid #1b2e4a}
.v33-bullets{margin:8px 0 0;padding-left:18px}
.v33-bullets li{margin:8px 0;color:#edf4fb}
.v33-pitch{
  position:relative;height:240px;border-radius:14px;overflow:hidden;border:1px solid #27405f;
  background:
    linear-gradient(0deg,rgba(0,0,0,.05),rgba(255,255,255,.05)),
    linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px),
    linear-gradient(0deg,rgba(255,255,255,.08) 1px,transparent 1px),
    linear-gradient(180deg,#4a1d75,#281046);
  background-size:auto, 20% 100%, 100% 20%, auto;
}
.v33-pitch:before{
  content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.2);border-radius:2px
}
.v33-pitch:after{
  content:"";position:absolute;left:50%;top:10px;bottom:10px;width:1px;background:rgba(255,255,255,.18);transform:translateX(-.5px)
}
.v33-circle{position:absolute;left:50%;top:50%;width:50px;height:50px;border:1px solid rgba(255,255,255,.18);border-radius:50%;transform:translate(-50%,-50%)}

  position:absolute;transform:translate(-50%,-50%);
  min-width:34px;min-height:22px;padding:2px 6px;border-radius:8px;background:#6e2db0;
  border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;

.v33-spot.st{background:#8255f1}

  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:#0a1524;border:1px solid #1d304c;border-radius:12px;padding:10px 12px;font-size:12px
}
.v33-reason{color:#f2bb64}
.v33-actionbar{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between
}
.v33-buttonrow{display:flex;gap:10px;flex-wrap:wrap}
.v33-quote{
  font-size:22px;line-height:1.35;font-weight:700;color:#eef5fd
}
.v33-small-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px
}
.v33-small-stat{
  background:#0a1524;border:1px solid #20344f;border-radius:12px;padding:10px
}

  .fc-bottom-nav{margin-top:9px;gap:6px}
  .fc-bottom-nav button{min-height:42px}
}


/* V38 COMPACT LANDSCAPE — FIT THE GAME TO THE VIEWPORT */
html,body{overflow-x:hidden}
body{font-size:13px}
.shell{max-width:none!important;padding:7px 10px 8px!important}

/* Home is a true one-screen console hub */
.fc-topline{margin-bottom:6px!important;min-height:34px}
.fc-logo{font-size:20px!important;letter-spacing:-.7px!important}
.fc-chip{padding:4px 8px!important;font-size:9px!important}
.fc-top-actions{gap:5px!important}
.top-icon-btn{min-height:32px!important;padding:5px 9px!important;font-size:9px!important}

.fc-hub{
  grid-template-columns:minmax(0,1.72fr) minmax(330px,.88fr)!important;
  gap:8px!important;
  height:calc(100vh - 103px);
  min-height:0;
}
.fc-hero{min-height:0!important;height:100%!important;border-radius:12px!important}
.fc-hero-inner{padding:14px!important}
.fc-headline{font-size:31px!important;line-height:.96!important;margin:4px 0!important}
.fc-sub{font-size:10px!important;line-height:1.25!important}
.fc-kicker{font-size:7px!important;letter-spacing:1.4px!important}
.fc-hero .btn{margin-top:7px!important;min-height:36px!important;padding:7px 12px!important}

.fc-quick{
  grid-template-columns:repeat(2,minmax(0,1fr))!important;
  grid-template-rows:repeat(2,minmax(0,1fr))!important;
  gap:8px!important;height:100%!important;min-height:0!important;
}
.fc-tile{
  min-height:0!important;height:auto!important;padding:10px!important;border-radius:12px!important;
  overflow:hidden!important;
}
.fc-tile h3{font-size:17px!important;line-height:1.05!important;margin:3px 0!important}
.fc-tile p{
  font-size:9px!important;line-height:1.25!important;margin:0!important;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.fc-tile .btn{margin-top:6px!important;min-height:32px!important;padding:5px 10px!important;font-size:9px!important}

.fc-bottom-nav{
  grid-template-columns:repeat(6,1fr)!important;gap:5px!important;margin-top:6px!important;
}
.fc-bottom-nav button{min-height:34px!important;font-size:8px!important;border-radius:9px!important}

/* General page density */
.card{padding:12px!important;border-radius:13px!important}
.card h2,.card h3{margin-top:0}
.grid,.two,.three{gap:8px!important}
.stat{padding:9px!important}
.btn{min-height:34px;padding:7px 11px}
input,select{min-height:34px!important}

/* Wide screens: make most information pages use columns rather than long vertical stacks */
@media (orientation:landscape) and (min-width:700px){
  #app > .page-grid,
  #app > .dashboard-grid,
  #app > .career-grid,
  #app > .match-grid{gap:8px!important}
  .shell{font-size:12px}
  .card{margin-bottom:8px!important}
}

/* Very short phone landscape screens */
@media (orientation:landscape) and (max-height:520px){
  .shell{padding:5px 8px!important}
  .fc-topline{min-height:29px;margin-bottom:4px!important}
  .fc-logo{font-size:18px!important}
  .fc-hub{height:calc(100vh - 83px);gap:6px!important}
  .fc-hero-inner{padding:10px!important}
  .fc-headline{font-size:26px!important}
  .fc-quick{gap:6px!important}
  .fc-tile{padding:8px!important}
  .fc-tile h3{font-size:15px!important}
  .fc-tile p{font-size:8px!important}
  .fc-bottom-nav{margin-top:4px!important}
  .fc-bottom-nav button{min-height:29px!important}
}


/* V39 — COLOURFUL FC-MOBILE-INSPIRED PLAYER CAREER UI */
:root{
  --cx-green:#67f3a7;
  --cx-cyan:#42d9ff;
  --cx-blue:#2378ff;
  --cx-purple:#8b5cf6;
  --cx-gold:#ffd84d;
  --cx-red:#ff5f72;
  --cx-bg:#07101c;
  --cx-panel:#0e1b2d;
}
body{
  background:
    radial-gradient(circle at 18% 20%,rgba(35,120,255,.16),transparent 24%),
    radial-gradient(circle at 84% 72%,rgba(103,243,167,.10),transparent 24%),
    #07101c!important;
}
.shell{padding:8px 14px 10px!important}

/* Keep the top bar small and completely separate from content */
.fc-topline{
  height:42px!important;
  min-height:42px!important;
  margin:0 0 10px!important;
  padding:0 2px!important;
  position:relative!important;
  z-index:30!important;
}
.fc-logo{font-size:22px!important}
.fc-top-actions{height:42px!important;flex-wrap:nowrap!important}
.fc-chip{padding:5px 11px!important;font-size:9px!important;white-space:nowrap}
.top-icon-btn{
  min-height:32px!important;height:32px!important;padding:5px 10px!important;
  font-size:9px!important;white-space:nowrap!important;position:relative!important;z-index:50!important;
}

/* More breathing room, without requiring home scrolling */
.fc-hub{
  grid-template-columns:minmax(0,1.5fr) minmax(350px,.9fr)!important;
  gap:14px!important;
  height:calc(100vh - 112px)!important;
}
.fc-hero{
  border-radius:18px!important;
  border:1px solid rgba(66,217,255,.34)!important;
  background:
    radial-gradient(circle at 24% 34%,rgba(66,217,255,.23),transparent 25%),
    radial-gradient(circle at 70% 68%,rgba(103,243,167,.16),transparent 28%),
    linear-gradient(135deg,#153459 0%,#0a1627 53%,#111a32 100%)!important;
  box-shadow:inset 0 0 45px rgba(41,132,255,.08),0 16px 35px rgba(0,0,0,.24)!important;
}
.fc-hero-inner{padding:20px!important}
.fc-headline{font-size:38px!important;margin:7px 0!important}
.fc-sub{font-size:11px!important;line-height:1.4!important}
.fc-kicker{font-size:8px!important;color:#a9bdd7!important}
.fc-hero .btn{
  background:linear-gradient(100deg,var(--cx-green),var(--cx-cyan))!important;
  color:#04130e!important;border:0!important;font-weight:950!important;
  min-height:40px!important;
}

.fc-quick{gap:14px!important}
.fc-tile{
  padding:14px!important;border-radius:17px!important;
  border:1px solid rgba(83,126,178,.38)!important;
  box-shadow:0 12px 25px rgba(0,0,0,.19)!important;
}
.fc-tile:nth-child(1){
  background:linear-gradient(145deg,rgba(25,93,64,.96),#0b211a)!important;
  border-color:rgba(103,243,167,.34)!important;
}
.fc-tile:nth-child(2){
  background:linear-gradient(145deg,rgba(28,63,115,.96),#0c192d)!important;
  border-color:rgba(66,217,255,.30)!important;
}
.fc-tile:nth-child(3){
  background:linear-gradient(145deg,rgba(78,54,126,.94),#171126)!important;
  border-color:rgba(139,92,246,.34)!important;
}
.fc-tile:nth-child(4){
  background:linear-gradient(145deg,rgba(112,75,25,.94),#24180b)!important;
  border-color:rgba(255,216,77,.30)!important;
}
.fc-tile h3{font-size:19px!important;margin:5px 0!important}
.fc-tile p{font-size:9.5px!important;line-height:1.35!important;-webkit-line-clamp:3!important}
.fc-tile .btn{
  min-height:34px!important;background:rgba(8,18,32,.68)!important;
  border:1px solid rgba(255,255,255,.13)!important;
}

/* Navigation feels like selectable game areas, not a cramped toolbar */
.fc-bottom-nav{gap:9px!important;margin-top:9px!important}
.fc-bottom-nav button{
  min-height:38px!important;border-radius:11px!important;font-size:8px!important;
  background:linear-gradient(180deg,#152840,#0d192a)!important;
}
.fc-bottom-nav button:nth-child(2){border-color:rgba(103,243,167,.45)!important}
.fc-bottom-nav button:nth-child(3){border-color:rgba(66,217,255,.34)!important}
.fc-bottom-nav button:nth-child(4){border-color:rgba(139,92,246,.34)!important}
.fc-bottom-nav button:nth-child(5){border-color:rgba(255,216,77,.30)!important}

/* Universal back button for every non-home section */
.cx-backbar{
  height:38px;display:flex;align-items:center;justify-content:space-between;
  margin:0 0 9px;gap:10px;
}
.cx-back{
  border:1px solid #315173;background:linear-gradient(180deg,#162b45,#0e1b2e);
  color:#fff;border-radius:11px;min-height:34px;padding:6px 13px;font-weight:900;
  font-size:10px;display:flex;align-items:center;gap:7px;
}
.cx-back:before{content:"‹";font-size:20px;line-height:10px;color:var(--cx-green)}
.cx-section-name{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8fa7c2;font-weight:900}

/* Cards get more spacing + colour accents */
.card{
  border:1px solid rgba(72,112,160,.32)!important;
  background:linear-gradient(145deg,rgba(17,32,52,.97),rgba(8,18,31,.97))!important;
  box-shadow:0 10px 25px rgba(0,0,0,.17)!important;
}
.card:nth-of-type(3n+1){border-top-color:rgba(103,243,167,.42)!important}
.card:nth-of-type(3n+2){border-top-color:rgba(66,217,255,.42)!important}
.card:nth-of-type(3n){border-top-color:rgba(139,92,246,.42)!important}

/* Landscape spacing: don't crush everything like V38 did */
@media (orientation:landscape) and (max-height:600px){
  .shell{padding:7px 12px 9px!important}
  .fc-topline{height:38px!important;min-height:38px!important;margin-bottom:8px!important}
  .fc-top-actions{height:38px!important}
  .fc-hub{height:calc(100vh - 100px)!important;gap:11px!important}
  .fc-hero-inner{padding:16px!important}
  .fc-headline{font-size:32px!important}
  .fc-quick{gap:11px!important}
  .fc-tile{padding:11px!important}
  .fc-tile h3{font-size:17px!important}
  .fc-bottom-nav{gap:7px!important;margin-top:7px!important}
  .fc-bottom-nav button{min-height:34px!important}
}

body.cx-v41-home .fc-tile h3{font-size:17px!important;margin:2px 0!important}
body.cx-v41-home .fc-tile p{font-size:9px!important;line-height:1.25!important;margin:2px 0!important}
body.cx-v41-home .fc-tile .btn{margin:0!important;padding:8px!important;font-size:9px!important}
body.cx-v41-home .fc-bottom-nav{display:none!important}

/* Career: stop one enormous vertical column */
body.cx-v41-detail .shell > .card{max-width:none!important}
@media (orientation:landscape) and (min-width:850px){
 body.cx-v41-detail .shell{
   display:grid!important;grid-template-columns:minmax(0,1.45fr) minmax(300px,.72fr)!important;
   grid-auto-flow:row dense!important;gap:9px 12px!important;align-items:start!important
 }
 body.cx-v41-detail .shell > .top,
 body.cx-v41-detail .shell > .cx-backbar{grid-column:1/-1!important}
 body.cx-v41-detail .shell > .card:nth-of-type(odd){grid-column:1!important}
 body.cx-v41-detail .shell > .card:nth-of-type(even){grid-column:2!important}
}

/* Training is now a compact game panel, not a huge page */
.training-arena{
 height:190px!important;min-height:190px!important;max-height:190px!important;
 border-radius:14px!important;margin-top:8px!important
}
.train-hud{gap:7px!important}
.train-hud .stat{padding:7px!important}
.train-hud .stat b{font-size:17px!important}
.float-ball{width:46px!important;height:46px!important;font-size:27px!important}

/* Match decisions: compact horizontal choices */
@media (orientation:landscape) and (min-width:800px){
 .choices,.decision-options,.match-options{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:8px!important}
 .choice,.decision-option,.match-choice{min-height:42px!important;padding:8px 11px!important;margin:0!important}
}

/* Tables/team boards: compact vertical board on right rather than giant rows */
table{font-size:9px!important}
th,td{padding:5px 7px!important}
.rankrow{padding:7px 4px!important;min-height:34px!important}
.rankrow .avatar{width:30px!important;height:30px!important;font-size:12px!important}

/* Keep landscape pages visually inside the phone viewport where sensible */
@media (orientation:landscape) and (max-height:520px){
 body{font-size:9.5px!important}
 .shell{padding-top:5px!important;padding-bottom:7px!important}
 .card{padding:9px 11px!important;margin-bottom:6px!important}
 h2{font-size:19px!important} h3{font-size:13px!important}
 .training-arena{height:145px!important;min-height:145px!important;max-height:145px!important}
 body.cx-v41-home .fc-topline{height:40px!important}
 body.cx-v41-home .fc-hub{height:calc(100vh - 58px)!important;gap:10px!important}
 body.cx-v41-home .fc-hero-inner{padding:16px!important}
 body.cx-v41-home .fc-headline{font-size:30px!important}
 body.cx-v41-home .fc-tile{padding:7px 10px!important}
}


/* V42 — lock the UI to the approved console mockup proportions */
:root{
 --cx-bg:#030b15;--cx-panel:#071626;--cx-panel2:#0b1b2e;
 --cx-green:#4be38f;--cx-blue:#4fb9ff;--cx-purple:#cb62ff;--cx-gold:#f1c84b;
 --cx-line:#203b57;--cx-text:#f5f8fc;--cx-muted:#9aacc0;
}
html,body{background:radial-gradient(circle at 48% 15%,#0b1c2e 0,#030b15 54%)!important;color:var(--cx-text)!important}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif!important}
.shell{max-width:1536px!important}
.card,.fc-tile,.fc-hero{border:1px solid var(--cx-line)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 12px 35px rgba(0,0,0,.18)!important}
.btn.primary,.primary{background:linear-gradient(90deg,#45d98b,#62e9a2)!important;color:#04130c!important}
.cx-v41-back{left:18px!important;top:14px!important;border:0!important;background:transparent!important;font-size:36px!important;box-shadow:none!important}

/* Approved mockup home: 55/45 visual split and four right feature strips */

.cx-selector{
 min-height:100vh;box-sizing:border-box;padding:24px 5vw;
 display:grid;grid-template-columns:minmax(320px,.9fr) minmax(480px,1.1fr);gap:42px;
 background:
 radial-gradient(circle at 18% 45%,rgba(42,220,142,.14),transparent 30%),
 radial-gradient(circle at 75% 20%,rgba(63,155,255,.10),transparent 28%),
 #030b15;color:#f6f9fc;align-items:center

.cx-selector-hero{padding:20px 4vw}
.cx-selector-hero .brand{font-size:30px;font-weight:900}
.cx-kicker,.cx-saves-head span,.cx-save-slot span{font-size:10px;letter-spacing:.22em;color:#8da3b9;font-weight:800}
.cx-selector-hero h1{font-size:58px;line-height:.92;margin:22px 0 16px;letter-spacing:-.055em}
.cx-selector-hero h1 span{color:#55e89b}
.cx-selector-hero p{max-width:470px;color:#9fb0c1;font-size:15px;line-height:1.5}
.cx-saves{padding:18px}
.cx-saves-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:13px}
.cx-saves-head h2{font-size:28px;margin:3px 0 0}
.cx-saves-head>b{color:#55e89b;font-size:14px}
.cx-save-slot{

 display:grid;grid-template-columns:64px 1fr 44px;align-items:stretch;
 border:1px solid #203b57;border-radius:16px;overflow:hidden;
 background:linear-gradient(110deg,#0a1b2d,#07121f);color:white;text-align:left

.cx-save-slot:hover{border-color:#55e89b}
.cx-slot-num{display:flex;align-items:center;justify-content:center;background:#0d2237;color:#55e89b;font-size:18px;font-weight:900}
.cx-slot-main,.cx-save-slot.empty{

}
.cx-slot-main{padding:13px 16px;display:flex;flex-direction:column;justify-content:center}
.cx-slot-main b,.cx-save-slot.empty b{font-size:20px;margin:3px 0}
.cx-slot-main small,.cx-save-slot.empty small{color:#9fb0c1;font-size:11px}
.cx-slot-delete{border:0;border-left:1px solid #1d344c;background:transparent;color:#71869a;font-size:22px;cursor:pointer}
.cx-slot-delete:hover{color:#ff7c87;background:rgba(255,80,90,.07)}
.cx-save-slot.empty{display:grid;grid-template-columns:64px 1fr 44px;padding:0;border-style:dashed}
.cx-save-slot.empty>div:nth-child(2){padding:13px 16px;display:flex;flex-direction:column;justify-content:center}
.cx-save-slot.empty>strong{display:flex;align-items:center;justify-content:center;font-size:26px;color:#55e89b}
@media (orientation:landscape) and (max-height:520px){

}

     players.push({id:id++,name:rngName(id+j),club:cl.name,league,pos,age,ovr,rep,apps:0,goals:0,assists:0,rating:6.5,minutes:0,form:6.5,value:Math.max(1,Math.round((ovr-55)*1.7*(age<24?1.25:1)))});

function simPeerWeek(){
 if(!save.worldPlayers)return;
 save.worldPlayers.forEach(p=>{
   if(Math.random()<.78){
    p.apps++;p.minutes+=Math.floor(65+Math.random()*26);
    let attack=["ST","LW","RW","CAM"].includes(p.pos);
    let mid=["CM","CDM"].includes(p.pos);
    let gChance=attack?.12+Math.max(0,p.ovr-70)*.007:mid?.035:.018;
    let aChance=attack?.09+Math.max(0,p.ovr-70)*.004:mid?.07:.025;
    if(Math.random()<gChance)p.goals++;
    if(Math.random()<aChance)p.assists++;
    let perf=6.15+(p.ovr-65)*.018+(Math.random()-.5)*1.2+(p.goals/p.apps)*.35+(p.assists/p.apps)*.25;
    p.rating=clamp((p.rating*(p.apps-1)+perf)/p.apps,5.8,8.5);
   }
 })
}
function peerScore(p){

 let score=p.ovr*.94+(p.rep||p.ovr)*.10;
 let ratingImpact=Math.max(-1.2,Math.min(1.2,(p.rating||6.5)-6.5))*1.25*sample;
 let output=0;
 if(["ST","LW","RW","CAM"].includes(p.pos))output=((p.goals||0)*.11+(p.assists||0)*.08)*sample;
 else if(["CM","CDM","LB","RB"].includes(p.pos))output=((p.assists||0)*.08+(p.goals||0)*.06)*sample;
 else output=((p.rating||6.5)-6.5)*.8*sample;
 return score+ratingImpact+output;

function internalClubName(raw,league){
  const n=normText(raw);
  if(V11_CLUB_ALIAS[n])return V11_CLUB_ALIAS[n];
  const clubs=(LEAGUES[league]||[]).map(x=>x.name);
  const exact=clubs.find(c=>normText(c)===n);
  if(exact)return exact;
  // Conservative fuzzy match for prefixes such as FC/AC/RC.
  let best=null,bestScore=0;
  for(const c of clubs){
    const cn=normText(c),a=new Set(n.split(" ")),b=new Set(cn.split(" "));
    let same=0;for(const w of a)if(w.length>2&&b.has(w))same++;
    let score=same/Math.max(1,Math.min(a.size,b.size));
    if(score>bestScore){bestScore=score;best=c}
  }
  return bestScore>=0.66?best:String(raw||"Unknown Club");
}

function parseCsvRow(line){
  let out=[],cur="",q=false;
  for(let i=0;i<line.length;i++){

    if(ch==='"'){
      if(q&&line[i+1]==='"'){cur+='"';i++} else q=!q;
    }else if(ch===","&&!q){out.push(cur);cur=""}

}

async function fetchMaybeGzip(url){

function estimateOvr(value,age,clubStrength,pos){

function buildFcOnlyFallbackV11(ratingsText){

async function loadRealPlayerDatabaseV11(){
  let roster=null,ratings=null,ratingsText=null,rosterError=null,ratingsError=null;
  try{roster=await loadTransfermarktRosterV11()}catch(e){rosterError=e}
  try{
    loadingDb("Building 2026/27 database","Loading the ratings layer for every player Career XI can match.","Loading ratings and attributes");
    const rr=await fetch(V11_DB.ratingsUrl,{cache:"no-store"});if(!rr.ok)throw new Error("Ratings request failed");
    ratingsText=await rr.text();
    // Parse from the already downloaded text.
    const lines=ratingsText.split(/\n/).filter(Boolean),idx=csvIndex(lines[0]),map=new Map(),clubLast=new Map();let rows=0;
    for(let li=1;li<lines.length;li++){
      const r=parseCsvRow(lines[li].replace(/\r$/,""));if(r.length<10)continue;
      const rec={short:r[idx.short_name]||"",long:r[idx.long_name]||"",club:r[idx.club_name]||"",pos:fcPosition(r[idx.player_positions]),overall:+r[idx.overall]||0,potential:+r[idx.potential]||0,age:+r[idx.age]||24,height:+r[idx.height_cm]||0,weight:+r[idx.weight_kg]||0,foot:r[idx.preferred_foot]||"",pace:+r[idx.pace]||0,shooting:+r[idx.shooting]||0,passing:+r[idx.passing]||0,dribbling:+r[idx.dribbling]||0,defending:+r[idx.defending]||0,physic:+r[idx.physic]||0,value:+r[idx.value_eur]||0};
      if(!rec.overall)continue;rows++;for(const k of [...nameKeys(rec.long),normText(rec.short)])if(k&&!map.has(k))map.set(k,rec);
      const lp=normText(rec.long).split(" ").filter(Boolean).pop();if(lp)clubLast.set(normText(rec.club)+"|"+lp,rec);
    }
    ratings={map,clubLast,rows};
  }catch(e){ratingsError=e}
  if(roster){
    const built=buildRealWorldV11(roster,ratings||{map:new Map(),clubLast:new Map(),rows:0});
    return {players:built.players,meta:{mode:"Live roster",players:built.players.length,ratingMatches:built.matches,ratingsRows:ratings?.rows||0,rosterSource:"Transfermarkt dataset",ratingSource:ratings?"EA FC 26 + estimates":"Market-value estimates",loadedAt:new Date().toISOString(),warning:ratingsError?String(ratingsError.message||ratingsError):""}};
  }
  // Real-player-only fallback: FC26 contains 16k+ real players. It can seed the five league clubs if live roster is temporarily unavailable.
  if(ratingsText){
    const players=buildFcOnlyFallbackV11(ratingsText);
    if(players.length>=1000)return {players,meta:{mode:"Real-player fallback",players:players.length,ratingMatches:players.length,ratingsRows:players.length,rosterSource:"EA FC 26 club squads",ratingSource:"EA FC 26",loadedAt:new Date().toISOString(),warning:"Live Transfermarkt roster was unavailable. No fictional senior players were inserted."}};
  }
  throw rosterError||ratingsError||new Error("No real-player data source could be reached.");
}

// Future-season newgens: young, unique, and added only after the real 2026/27 starting world exists.
function regenSeasonPlayers(){
  if(!save||!save.worldPlayers||save.season==="2026/27")return;
  const clubs=Object.entries(LEAGUES).flatMap(([league,cs])=>cs.map(c=>({league,club:c.name,strength:c.strength})));
  let next=Date.now()%100000000;
  for(const c of clubs){
    const count=Math.random()<0.45?1:0;
    for(let z=0;z<count;z++){
      const positions=["GK","CB","LB","RB","CDM","CM","CAM","LW","RW","ST"],pos=positions[Math.floor(Math.random()*positions.length)];
      const ovr=clamp(Math.round(c.strength-19+Math.random()*10),52,73),age=16+Math.floor(Math.random()*4);
      const name=uniqueGeneratedName(save.worldPlayers);
      save.worldPlayers.push({id:"ng"+(next++),name,club:c.club,league:c.league,pos,age,ovr,potential:clamp(ovr+9+Math.floor(Math.random()*15),68,94),
        rep:Math.max(42,ovr-6),apps:0,goals:0,assists:0,rating:6.5,minutes:0,form:6.5,value:Math.max(250000,(ovr-48)*250000),
        real:false,generated:true,nationality:"",height:0,weight:0,foot:"",attrs:derivedAiAttrs(pos,ovr),ratingSource:"Newgen"});
    }
  }
}
function developWorldPlayers(){
  if(!save?.worldPlayers)return;
  for(const p of save.worldPlayers){
    p.age=(p.age||24)+1;
    const pot=p.potential||p.ovr;
    if(p.age<=23&&p.ovr<pot&&Math.random()<0.58)p.ovr=Math.min(pot,p.ovr+1+(Math.random()<0.12?1:0));
    else if(p.age>=31&&Math.random()<0.48)p.ovr=Math.max(50,p.ovr-1);
    p.rep=clamp(Math.round((p.rep||p.ovr)+(p.rating-6.5)*1.2+(p.goals>15?1:0)),40,97);
    p.apps=0;p.goals=0;p.assists=0;p.rating=6.5;p.minutes=0;
  }
  save.worldPlayers=save.worldPlayers.filter(p=>!(p.age>=36&&Math.random()<0.55));
}

function matchPlayersForClub(club){
 return (save.worldPlayers||[]).filter(p=>sameClub(p.club,club));
}
function appearanceChanceV19(p,clubStrength){
 const rel=(p.ovr||65)-clubStrength;
 return clamp(.55+rel*.025, .20, .96);
}
function weightedPickV19(arr,weightFn){
 if(!arr.length)return null;
 let weights=arr.map(x=>Math.max(.01,weightFn(x))),sum=weights.reduce((a,b)=>a+b,0),r=Math.random()*sum;
 for(let i=0;i<arr.length;i++){r-=weights[i];if(r<=0)return arr[i]}
 return arr[arr.length-1];
}
function recordAppearanceV19(p,mins){
 if(!p)return;
 p.apps=(p.apps||0)+1;
 p.minutes=(p.minutes||0)+mins;
 p._matchGoals=0;p._matchAssists=0;
}
function scorerWeightV19(p){
 const pos={ST:1.8,LW:1.45,RW:1.45,CAM:1.1,CM:.65,CDM:.3,LB:.22,RB:.22,CB:.16,GK:.01}[p.pos]||.45;
 return pos*Math.max(.35,((p.ovr||65)-45)/35);
}
function assisterWeightV19(p){
 const pos={ST:.8,LW:1.35,RW:1.35,CAM:1.65,CM:1.3,CDM:.7,LB:.65,RB:.65,CB:.2,GK:.04}[p.pos]||.5;
 return pos*Math.max(.35,((p.ovr||65)-45)/38);
}
function simulateClubLineupV19(club){
 const strengthNow=strength(club),pool=matchPlayersForClub(club);
 if(!pool.length)return [];
 let selected=pool.filter(p=>Math.random()<appearanceChanceV19(p,strengthNow));
 if(selected.length<11){
   selected=[...pool].sort((a,b)=>(b.ovr||0)-(a.ovr||0)).slice(0,Math.min(14,pool.length));
 }
 selected=selected.slice(0,16);
 selected.forEach((p,i)=>recordAppearanceV19(p,i<11?90:15+Math.floor(Math.random()*31)));
 return selected;
}
function simulateNamedFixtureV19(a,b,ga,gb){
 const A=simulateClubLineupV19(a),B=simulateClubLineupV19(b);
 const goalLines=[];
 function goalsFor(team,players,n){
   for(let i=0;i<n;i++){
     const scorer=weightedPickV19(players,scorerWeightV19);
     if(!scorer)continue;
     scorer.goals=(scorer.goals||0)+1;scorer._matchGoals=(scorer._matchGoals||0)+1;
     let candidates=players.filter(x=>x!==scorer);
     const assisted=Math.random()<.72;
     const assister=assisted?weightedPickV19(candidates,assisterWeightV19):null;
     if(assister){assister.assists=(assister.assists||0)+1;assister._matchAssists=(assister._matchAssists||0)+1}
     goalLines.push(`${team}: ${scorer.name}${assister?` (assist: ${assister.name})`:""}`);
   }
 }
 goalsFor(a,A,ga);goalsFor(b,B,gb);
 [...A,...B].forEach(p=>{
   const base=6.15+((p.ovr||65)-70)*.008+(Math.random()-.5)*.65;
   const perf=clamp(base+(p._matchGoals||0)*.72+(p._matchAssists||0)*.42,5.5,9.6);
   const oldApps=Math.max(0,(p.apps||1)-1);
   p.rating=oldApps?clamp(((p.rating||6.5)*oldApps+perf)/(oldApps+1),5.7,9):perf;
   delete p._matchGoals;delete p._matchAssists;
 });
 return goalLines;
}

function updateMarketValueV21(){

 const apps=save.apps||0,form=clamp(save.form||6.5,5.5,9.5);
 const base=startingValueV22();

 // Slow growth: early senior appearances should move value gradually, not by hundreds of thousands at once.
 const appBoost=1+Math.min(.45,apps*.018);

 let target=base*appBoost*formBoost*abilityBoost*repBoost;

 // Hard early-career caps to stop instant £m values.
 if(apps<5)target=Math.min(target,250000);
 else if(apps<10)target=Math.min(target,500000);
 else if(apps<20)target=Math.min(target,1000000);

 // Smooth changes week to week instead of jumping straight to the new target.

 const maxUp=current*1.12;      // max +12% per update
 const maxDown=current*0.92;    // max -8% per update

/* Appearance balance:
   - prospects receive more bench opportunities
   - no substitute appearance starts later than 75'
   - three consecutive DNPs heavily increase the chance of being on the bench */
function selectionInfo(){
 let p=save.player,clubStrength=strength(save.club),peers=squadCompetition(),best=peers[0]?.ovr||clubStrength-5;
 let gap=p.ovr-best,trust=save.trust||50,formBoost=(save.form-6.5)*3,elitePenalty=Math.max(0,(clubStrength-80)*.75),youthPenalty=p.age<=17?4:p.age<=19?2:0;
 let score=gap*2+(trust-50)*.45+formBoost-elitePenalty-youthPenalty;
 let recent=(save.history||[]).slice(-4),dnp=0;
 for(let i=recent.length-1;i>=0;i--){if(recent[i].rating==="DNP")dnp++;else break}
 let startChance=clamp(.07+score/115,.025,.70);
 let benchChance=clamp(.52+score/150+dnp*.13,.36,.88);
 if(dnp>=3)benchChance=Math.max(benchChance,.82);
 let r=Math.random(),status,minute=0;
 if(r<startChance)status="Starter";
 else if(r<startChance+benchChance){
   status="Bench";
   const quality=clamp((score+40)/80,0,1);
   minute=clamp(Math.round(69-quality*18+Math.random()*10),45,75);
 }else status="Not Selected";
 let role=score>28?"Key Player":score>14?"Starter":score>2?"Rotation":score>-15?"Prospect":"Development Player";
 return {status,minute,role,startChance,benchChance,score,best};
}

 const A=simulateClubLineupV19(a),B=simulateClubLineupV19(b),goals=[];
 const scoreGoals=(team,players,opponents,n)=>{
   for(let i=0;i<n;i++){
     // Own goals should exist, but be genuinely rare.
     const ownGoal=Math.random()<0.0075 && opponents.length;
     if(ownGoal){
       const og=weightedPickV19(opponents,defenderWeightV28)||opponents.find(x=>x.pos!=="GK")||opponents[0];
       if(og){
         og.ownGoals=(og.ownGoals||0)+1;
         goals.push({team,scorer:og.name,assister:null,ownGoal:true});
         continue;
       }
     }
     const scorer=weightedPickV19(players,scorerWeightV19);
     if(!scorer)continue;
     scorer.goals=(scorer.goals||0)+1;scorer._matchGoals=(scorer._matchGoals||0)+1;
     const candidates=players.filter(x=>x!==scorer);
     const assister=Math.random()<.70?weightedPickV19(candidates,assisterWeightV19):null;
     if(assister){assister.assists=(assister.assists||0)+1;assister._matchAssists=(assister._matchAssists||0)+1}
     goals.push({team,scorer:scorer.name,assister:assister?.name||null,ownGoal:false});
   }
 };
 scoreGoals(a,A,B,ga);scoreGoals(b,B,A,gb);
 [...A,...B].forEach(p=>{
   const base=6.15+((p.ovr||65)-70)*.008+(Math.random()-.5)*.65;
   const perf=clamp(base+(p._matchGoals||0)*.72+(p._matchAssists||0)*.42-(p.ownGoals?0.04:0),5.5,9.6);
   const oldApps=Math.max(0,(p.apps||1)-1);
   p.rating=oldApps?clamp(((p.rating||6.5)*oldApps+perf)/(oldApps+1),5.7,9):perf;
   delete p._matchGoals;delete p._matchAssists;
 });
 return goals;
}
function simulateWholeWeekV28(userA,userB,userGA,userGB){
 const reports=[],userDetails=simulateNamedFixtureV28(userA,userB,userGA,userGB);
 save.lastUserFixtureDetails={home:userA,away:userB,homeScore:userGA,awayScore:userGB,goals:userDetails};
 reports.push(...userDetails);
 const rest=save.table.map(x=>x.team).filter(x=>x!==userA&&x!==userB);
 for(let i=0;i+1<rest.length;i+=2){
   const a=rest[i],b=rest[i+1],[ga,gb]=simScore(strength(a),strength(b));
   apply(a,b,ga,gb);
   const details=simulateNamedFixtureV28(a,b,ga,gb);
   reports.push(...details);
 }
 save.lastLeagueGoalDetails=reports.slice(0,60);
 save.lastLeagueScorers=reports.slice(0,40).map(g=>`${g.team}: ${compactGoalLineV28(g)}`);
 return reports;
}

/* Trust is now performance-based and can swing significantly in either direction. */
function managerTrustDeltaV28(rating,minutes){
 const r=Number(rating)||6.5,m=Number(minutes)||0;
 let delta=0;
 if(r>=9.0)delta=5;
 else if(r>=8.3)delta=4;
 else if(r>=7.7)delta=3;
 else if(r>=7.2)delta=2;
 else if(r>=6.8)delta=1;
 else if(r>=6.35)delta=0;
 else if(r>=6.0)delta=-1;
 else if(r>=5.6)delta=-3;
 else delta=-5;
 if(m<25){delta=Math.round(delta*.65)}
 return delta;
}
function applyManagerTrustV28(rating,minutes){
 const delta=managerTrustDeltaV28(rating,minutes);
 save.trust=clamp((save.trust||50)+delta,0,100);
 save.lastTrustChange=delta;
 return delta;
}

function hashV33(str){
 let h=2166136261>>>0;
 str=String(str||"");
 for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
 return h>>>0;
}
function rngV33(seed){
 let s=seed>>>0;
 return function(){ s=(Math.imul(1664525,s)+1013904223)>>>0; return s/4294967296; };
}
function shortNameV33(name){
 name=String(name||"").replace(/\s+/g," ").trim();
 if(!name) return "";
 let parts=name.split(" ");
 if(parts.length<=2) return name;
 return parts[0]+" "+parts[parts.length-1];
}
function starsV33(num){
 let full=Math.max(1,Math.min(5,Math.round(num)));
 return "★".repeat(full)+"☆".repeat(5-full);
}
function clubStrengthV33(club){ return typeof strength==="function" ? strength(club) : 70; }

 let c=canonClub ? canonClub(club) : club;
 let players=(save.worldPlayers||[]).filter(p=>(canonClub?canonClub(p.club):p.club)===c).map(p=>({...p}));
 if((canonClub?canonClub(save.club):save.club)===c){
   const me={name:save.player.name,club:save.club,league:save.league,pos:save.player.pos,age:save.player.age,ovr:save.player.ovr,rating:save.form||6.5,apps:save.apps||0,goals:save.goals||0,assists:save.assists||0,real:false};
   const idx=players.findIndex(p=>p.name===me.name && p.pos===me.pos && p.age===me.age);
   if(idx>=0) players[idx]={...players[idx],...me};
   else players.push(me);
 }
 return players.sort((a,b)=>(b.ovr||0)-(a.ovr||0));
}
function formationForClubV33(club){
 let str=clubStrengthV33(club), seed=hashV33(save.season+"|"+save.fixtureIndex+"|"+club);
 let pool=str>=84?[0,1,3,0,1]:str>=76?[1,0,2,3]:[2,1,0,3];
 return V33_FORMATIONS[pool[seed%pool.length]];
}
function fitScoreV33(player,slot,club,selStatus){
 let score=(player.ovr||60);
 let pos=player.pos||"";
 if(slot.accept.includes(pos)) score+=18;
 else if(slot.accept.some(x=>String(pos).includes(x))) score+=10;
 else if(["LW","RW","LM","RM"].includes(pos)&&["LW","RW","LM","RM"].some(x=>slot.accept.includes(x))) score+=12;
 else if(["CM","CDM","CAM"].includes(pos)&&["CM","CDM","CAM"].some(x=>slot.accept.includes(x))) score+=11;
 else if(["LB","RB","LWB","RWB"].includes(pos)&&["LB","RB","LWB","RWB"].some(x=>slot.accept.includes(x))) score+=11;
 else if(pos==="CB" && (slot.accept.includes("CDM")||slot.accept.includes("LB")||slot.accept.includes("RB"))) score+=6;
 else score-=20;
 if(club===save.club && player.name===save.player.name){
   if(selStatus==="Starter") score+=42;
   else if(selStatus==="Bench") score-=18;
   else score-=34;
 }
 if((player.apps||0)>10) score += 2;
 if((player.rating||6.5)>6.9) score += 2;
 return score;
}
function lineupForClubV33(club,selStatus="Starter"){
 let squad=squadV33(club), form=formationForClubV33(club), used=new Set(), picks=[];
 form.slots.forEach(slot=>{
   const options=squad.map((p,i)=>({p,i,score:fitScoreV33(p,slot,club,selStatus)}))
     .filter(x=>!used.has(x.i)).sort((a,b)=>b.score-a.score);
   if(options[0]){
     used.add(options[0].i);
     picks.push({...slot, player:options[0].p});
   }
 });
 const bench=squad.map((p,i)=>({p,i})).filter(x=>!used.has(x.i)).slice(0,7).map(x=>x.p);
 return {formation:form,picks,bench,squad};
}

function scoutInfoV33(club){

function isFullscreenV34(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}
async function toggleFullscreenV34(){
  try{
    if(!isFullscreenV34()){
      const el = document.documentElement;
      if(el.requestFullscreen) await el.requestFullscreen();
      else if(el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
      else if(el.msRequestFullscreen) await el.msRequestFullscreen();
    }else{
      if(document.exitFullscreen) await document.exitFullscreen();
      else if(document.webkitExitFullscreen) await document.webkitExitFullscreen();
      else if(document.msExitFullscreen) await document.msExitFullscreen();
    }
  }catch(err){
    console.error(err);
    alert("Fullscreen couldn't be opened on this tap. Try again once the page is fully loaded.");
  }
  setTimeout(syncFullscreenUiV34, 50);
}
function syncFullscreenUiV34(){
  const active = isFullscreenV34();
  document.body.classList.toggle('is-fullscreen', active);
  document.querySelectorAll('.js-fullscreen-toggle').forEach(btn=>{
    btn.classList.toggle('fs-active', active);
    btn.innerHTML = active ? '<span class="fs-ico">⤢</span><span>Exit Full Screen</span>' : '<span class="fs-ico">⛶</span><span>Full Screen</span>';
  });
}
document.addEventListener('fullscreenchange', syncFullscreenUiV34);

          <div><div class="fc-kicker">Career</div><h3>Player</h3><p>Stats, form and development.</p></div>
          <button class="btn secondary" onclick="show('career')">OPEN</button>
        </section>
        <section class="fc-tile">
          <div><div class="fc-kicker">World</div><h3>Social</h3><p>Weekly fan reaction and stories.</p></div>
          <button class="btn secondary" onclick="show('social')">OPEN</button>
        </section>
        <section class="fc-tile">
          <div><div class="fc-kicker">Competition</div><h3>League</h3><p>Standings, results and form.</p></div>

      </div>

/* Add page buttons rather than a persistent sidebar */
const _appV37 = app;
app = function(html){
  _appV37(html);
  document.body.classList.add('v37-no-sidebar');
};


(function(){
  const oldHomeV38 = home;
  home = function(){
    oldHomeV38();
    document.documentElement.classList.add('careerxi-compact');
    window.scrollTo(0,0);
  };
})();





/* V41 reliable navigation state: works even when career()/match()/training render directly */
(function(){
  const baseAppV41 = app;
  app = function(html){
    baseAppV41(html);
    const detail = !!save && page !== 'home';
    document.body.classList.toggle('cx-v41-home', !!save && page === 'home');
    document.body.classList.toggle('cx-v41-detail', detail);
    document.querySelectorAll('.cx-v41-back').forEach(x=>x.remove());
    if(detail){
      const b=document.createElement('button');
      b.className='cx-v41-back';
      b.type='button';
      b.innerHTML='‹';
      b.setAttribute('aria-label','Back to home');
      b.onclick=()=>show('home');
      document.body.appendChild(b);
    }
  };

  const baseShowV41 = show;
  show = function(p){
    page=p;
    document.body.classList.toggle('cx-v41-home', p==='home');
    document.body.classList.toggle('cx-v41-detail', p!=='home');
    baseShowV41(p);
    window.scrollTo(0,0);
  };
})();


(function(){
 const navPages=[['⌂','HOME','home'],['♟','PLAYER','career'],['⚽','MATCH','match'],['♟♟','SOCIAL','social'],['♜','LEAGUE','table'],['⇄','TRANSFERS','transfers']];
 function drawV42Nav(){
   document.querySelectorAll('.cx-v42-nav').forEach(n=>n.remove());
   if(!save)return;
   const n=document.createElement('nav');n.className='cx-v42-nav';
   n.innerHTML=navPages.map(([i,l,p])=>`<button class="${page===p?'active':''}" data-p="${p}"><span>${i}</span> ${l}</button>`).join('');
   n.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.p));
   document.body.appendChild(n);
 }
 const oldApp42=app;
 app=function(html){oldApp42(html);drawV42Nav()};
 const oldShow42=show;
 show=function(p){oldShow42(p);setTimeout(drawV42Nav,0)};
})();

start();

<script>
/* ===== V44 interaction changes ===== */
function homeV44(){
  updateMarketValueV21();
  const sel=ensureSelection();
  const standing=sortedLeagueV30().findIndex(x=>x.team===save.club)+1;
  app(`<div class="fc-topline">
    <div class="fc-logo">CAREER<i>XI</i></div>
    <div class="fc-top-actions">
      <span class="fc-chip">${save.season}</span>
      <span class="fc-chip">${save.club}</span>
      <button class="top-icon-btn js-fullscreen-toggle" onclick="toggleFullscreenV34()"><span class="fs-ico">⛶</span><span>Full Screen</span></button>
    </div>
  </div>
  <div class="fc-hub">
    <section class="fc-hero">
      <div class="fc-hero-inner">
        <div>
          <div class="fc-kicker">PLAYER CAREER</div>
          <div class="fc-headline">${save.player.name}</div>
          <div class="fc-sub">${save.player.pos} • ${save.player.ovr} OVR • ${save.club} • ${save.league}</div>
        </div>
        <div>
          <div class="fc-kicker">NEXT FIXTURE</div>
          <div style="font-size:23px;font-weight:900;margin:4px 0">${save.club} vs ${save.nextOpponent}</div>
          <div class="fc-sub">${sel.status} • Trust ${Math.round(save.trust||50)} • League #${standing}</div>
          <button class="btn" style="margin-top:10px;width:100%" onclick="show('match')">PLAY MATCH <span style="float:right">›</span></button>
        </div>
      </div>
    </section>
  </div>`);
}
home=homeV44;

function renderPostMatchV44(s){
 page="match";
 document.body.classList.remove("cx-v41-home");
 document.body.classList.add("cx-v41-detail");
 app(`<div class="top"><div><div class="brand">FULL TIME</div><div class="muted">${s.season} • Matchweek ${s.week}</div></div><span class="pill">MATCH COMPLETE</span></div>
 <div class="v44-post"><section class="v44-post-card">
   <div class="fc-kicker">MATCH REPORT</div>
   <div class="v44-score"><span><b>${s.club}</b></span><b>${s.home} — ${s.away}</b><span><b>${s.opp}</b></span></div>
   <div class="v44-post-grid">
    <div class="v44-stat"><span>Your rating</span><b>${s.rating}</b></div>
    <div class="v44-stat"><span>Minutes</span><b>${s.minutes}</b></div>
    <div class="v44-stat"><span>Result</span><b>${s.home>s.away?"WIN":s.home<s.away?"LOSS":"DRAW"}</b></div>
   </div>
   <div class="card" style="margin:10px 0 0"><h3>Match Events</h3>${s.events.slice().reverse().map(e=>`<div class="event">${e}</div>`).join("")}</div>
   <div class="v44-actions">
    <button class="btn secondary" onclick="show('social')">REACTIONS</button>
    <button class="btn secondary" onclick="show('table')">LEAGUE</button>
    <button class="btn" onclick="show('match')">NEXT MATCH</button>
   </div>
 </section></div>`);
}

const finishMatchV44Base=finishMatch;
finishMatch=function(){
 if(!matchState)return;
 const m=matchState;
 const snap={club:save.club,opp:save.nextOpponent,home:m.home,away:m.away,rating:m.rating.toFixed(1),
   minutes:Math.max(1,m.minute-m.entered),events:[...(m.events||[])],season:save.season,week:save.week};
 const realShow=show;
 show=function(p){if(p==="home")renderPostMatchV44(snap);else realShow(p)};

};

/* Full time button is available immediately once full time is reached; no artificial wait. */
const runMatchClockV44Base=runMatchClock;
runMatchClock=function(){
 runMatchClockV44Base();
 if(matchState){
   const limit=matchState.stoppage?90+matchState.stoppage:90;
   if(matchState.minute>=limit && matchState.stoppage!==null){
     matchState.running=false;
     const moment=document.getElementById("moment");
     if(moment)moment.innerHTML=`<div class="card"><div class="fc-kicker">FULL TIME</div><h3 style="margin:5px 0 10px">${save.club} ${matchState.home} — ${matchState.away} ${save.nextOpponent}</h3><button class="btn" onclick="finishMatch()">FINISH MATCH</button></div>`;
   }
 }
};
