.choice{background:#202b45;color:white;border:1px solid #344362;border-radius:14px;padding:13px;width:100%;margin:6px 0;text-align:left}.event{border-left:3px solid #75f0a7;padding:9px 12px;margin:8px 0;background:#10182a;border-radius:0 10px 10px 0}.good{color:#75f0a7}.bad{color:#ff8794}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 4px;border-bottom:1px solid #283550;text-align:left}th{color:#98a5bc}.progress{height:8px;background:#283550;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:#75f0a7}

.rankrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #283550}
.rankrow:last-child{border-bottom:0}.avatar{width:34px;height:34px;border-radius:50%;background:#202b45;display:grid;place-items:center;font-weight:900}
.small{font-size:11px}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#202b45;color:#b9c5d8;font-size:10px;margin-right:4px}
.metric{font-size:28px;font-weight:900}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.center{text-align:center}

.dbline{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #283550}.dbline:last-child{border-bottom:0}
.spinner{width:22px;height:22px;border:3px solid #33415f;border-top-color:#75f0a7;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}.warning{border-left-color:#ffbe69}.mono{font-variant-numeric:tabular-nums}

 "strength": 78}, {"name": "Como", "strength": 77}, {"name": "Torino", "strength": 75}, {"name": "Genoa", "strength": 74}, {"name": "Udinese", "strength": 74}, {"name": "Parma", "strength": 73}, {"name": "Cagliari", "strength": 72}, {"name": "Lecce", "strength": 71}, {"name": "Sassuolo", "strength": 73}, {"name": "Venezia", "strength": 69}, {"name": "Frosinone", "strength": 69}, {"name": "Monza", "strength": 70}], "Bundesliga": [{"name": "Bayern Munich", "strength": 90}, {"name": "Borussia Dortmund", "strength": 84}, {"name": "Bayer Leverkusen", "strength": 84}, {"name": "RB Leipzig", "strength": 81}, {"name": "Eintracht Frankfurt", "strength": 80}, {"name": "VfB Stuttgart", "strength": 79}, {"name": "Freiburg", "strength": 77}, {"name": "Mainz", "strength": 76}, {"name": "Hoffenheim", "strength": 75}, {"name": "Werder Bremen", "strength": 75}, {"name": "Hamburg", "strength": 74}, {"name": "Union Berlin", "strength": 74}, {"name": "Cologne", "strength": 73}, {"name": "Augsburg", "strength": 72}, {"name": "Borussia Mönchengladbach", "strength": 75}, {"name": "Schalke 04", "strength": 71}, {"name": "Elversberg", "strength": 68}, {"name": "Paderborn", "strength": 69}], "Ligue 1": [{"name": "Paris Saint-Germain", "strength": 92}, {"name": "Lens", "strength": 82}, {"name": "Lille", "strength": 81}, {"name": "Lyon", "strength": 80}, {"name": "Marseille", "strength": 79}, {"name": "Rennes", "strength": 78}, {"name": "Monaco", "strength": 78}, {"name": "Strasbourg", "strength": 77}, {"name": "Toulouse", "strength": 75}, {"name": "Lorient", "strength": 73}, {"name": "Paris FC", "strength": 74}, {"name": "Brest", "strength": 75}, {"name": "Angers", "strength": 71}, {"name": "Le Havre", "strength": 70}, {"name": "Auxerre", "strength": 72}, {"name": "Nice", "strength": 75}, {"name": "Troyes", "strength": 68}, {"name": "Le Mans", "strength": 67}]};
const $=s=>document.querySelector(s);
let save=JSON.parse(localStorage.getItem("careerXI11")||"null"),page="home",matchState=null;
const persist=()=>localStorage.setItem("careerXI11",JSON.stringify(save));
function app(h){$("#app").innerHTML=`<main class="shell">${h}</main>`}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function start(){document.querySelector("#nav").classList.add("hidden");app(`<div class="hero"><div class="brand">CAREER<span class="accent">XI</span></div><h1>Your career.<br>Your decisions.</h1><p class="muted">Build a player and live a career across Europe's top five leagues.</p></div><div class="card"><h3>Player Career</h3><p class="muted">2026/27 real-player database • five leagues • full tables</p><button class="btn" onclick="creator()">New Career</button>${save?`<button class="btn secondary" onclick="show('home')">Continue ${save.player.name}</button>`:""}</div>`)}
function heightOptions(){let a=[];for(let inch=60;inch<=81;inch++){let ft=Math.floor(inch/12),i=inch%12;a.push(`<option value="${inch}" ${inch===69?"selected":""}>${ft}'${i}" (${Math.round(inch*2.54)} cm)</option>`)}return a.join("")}
function weightOptions(){let a=[];for(let kg=50;kg<=115;kg+=2)a.push(`<option value="${kg}" ${kg===70?"selected":""}>${kg} kg (${Math.round(kg*2.20462)} lb)</option>`);return a.join("")}
function creator(){app(`<div class="top"><div class="brand">CAREER<span class="accent">XI</span></div><span class="pill">NEW CAREER</span></div><h2>Create Player</h2><div class="card">
<label>Name</label><input id="name" value="Cole"><div class="grid"><div><label>Nationality</label><select id="nat"><option>England</option><option>Scotland</option><option>Wales</option><option>France</option><option>Spain</option><option>Germany</option><option>Italy</option><option>Brazil</option><option>Portugal</option><option>Netherlands</option></select></div><div><label>Age</label><select id="age">${[16,17,18,19].map(x=>`<option>${x}</option>`).join("")}</select></div></div>
<div class="grid"><div><label>Height</label><select id="height" onchange="previewBuild()">${heightOptions()}</select></div><div><label>Weight</label><select id="weight" onchange="previewBuild()">${weightOptions()}</select></div></div>
<div id="buildPreview" class="card" style="margin:12px 0 0"></div>
<div class="grid"><div><label>Preferred Foot</label><select id="foot"><option>Right</option><option>Left</option></select></div><div><label>Position</label><select id="pos" onchange="positionChanged()"><option>ST</option><option>LW</option><option>RW</option><option>CAM</option><option>CM</option><option>CDM</option><option>LB</option><option>RB</option><option>CB</option><option>GK</option></select></div></div>
<label>Playstyle</label><select id="style"></select>
<label>League</label><select id="league" onchange="clubsForLeague()">${Object.keys(LEAGUES).map(x=>`<option>${x}</option>`).join("")}</select>
<label>Starting Club</label><select id="club"></select><button class="btn" onclick="createCareer()">Start Career</button></div>`);clubsForLeague();positionChanged()}
function clubsForLeague(){let l=$("#league").value;$("#club").innerHTML=LEAGUES[l].map(x=>`<option>${x.name}</option>`).join("")}
function buildMods(h,w){
 // Balanced around 5'9 / 70kg. Height trades agility/pace for strength/jumping;
 // weight trades pace/agility for strength. Effects are deliberately moderate.
 let tall=(h-69), heavy=(w-70)/5;
 return {
  Pace:Math.round(-0.45*tall-0.55*heavy),
  Agility:Math.round(-0.65*tall-0.75*heavy),
  Strength:Math.round(0.7*tall+1.05*heavy),
  Jumping:Math.round(0.8*tall+0.15*heavy)
 }}
function previewBuild(){let h=+$("#height").value,w=+$("#weight").value,m=buildMods(h,w);$("#buildPreview").innerHTML=`<div class="section-title">Physical build effect</div><div class="grid">${Object.entries(m).map(([k,v])=>`<div class="stat"><span class="muted">${k}</span><b class="${v>0?"good":v<0?"bad":""}">${v>0?"+":""}${v}</b></div>`).join("")}</div><p class="note">These are starting-attribute modifiers, not permanent limits.</p>`}

const POSITION_DATA={
 ST:{styles:["Advanced Forward","Poacher","Target Forward","False 9"],base:{Pace:70,Agility:67,Shooting:70,Passing:56,Dribbling:65,Defending:28,Strength:64,Jumping:65,Stamina:62}},
 LW:{styles:["Inside Forward","Traditional Winger","Wide Playmaker"],base:{Pace:73,Agility:72,Shooting:63,Passing:63,Dribbling:71,Defending:34,Strength:53,Jumping:50,Stamina:65}},
 RW:{styles:["Inside Forward","Traditional Winger","Wide Playmaker"],base:{Pace:73,Agility:72,Shooting:63,Passing:63,Dribbling:71,Defending:34,Strength:53,Jumping:50,Stamina:65}},
 CAM:{styles:["Playmaker","Shadow Striker","Advanced Playmaker"],base:{Pace:64,Agility:70,Shooting:62,Passing:71,Dribbling:70,Defending:38,Strength:51,Jumping:46,Stamina:63}},
 CM:{styles:["Box-to-Box","Deep-Lying Playmaker","Playmaker"],base:{Pace:61,Agility:64,Shooting:57,Passing:70,Dribbling:65,Defending:59,Strength:58,Jumping:54,Stamina:72}},
 CDM:{styles:["Ball Winning Midfielder","Holding Midfielder","Deep-Lying Playmaker"],base:{Pace:58,Agility:57,Shooting:47,Passing:65,Dribbling:57,Defending:70,Strength:68,Jumping:63,Stamina:72}},
 LB:{styles:["Attacking Fullback","Defensive Fullback","Inverted Fullback"],base:{Pace:70,Agility:67,Shooting:42,Passing:61,Dribbling:62,Defending:66,Strength:60,Jumping:58,Stamina:72}},
 RB:{styles:["Attacking Fullback","Defensive Fullback","Inverted Fullback"],base:{Pace:70,Agility:67,Shooting:42,Passing:61,Dribbling:62,Defending:66,Strength:60,Jumping:58,Stamina:72}},
 CB:{styles:["Ball Playing Defender","Stopper","No-Nonsense Defender"],base:{Pace:57,Agility:51,Shooting:35,Passing:57,Dribbling:49,Defending:73,Strength:72,Jumping:72,Stamina:64}},
 GK:{styles:["Sweeper Keeper","Shot Stopper","Traditional Keeper"],base:{Pace:42,Agility:58,Shooting:20,Passing:51,Dribbling:30,Defending:30,Strength:61,Jumping:66,Stamina:46,Diving:70,Handling:67,Kicking:64,Reflexes:71,Positioning:68}}
};
function positionChanged(){
 let p=$("#pos").value,d=POSITION_DATA[p];
 $("#style").innerHTML=d.styles.map(x=>`<option>${x}</option>`).join("");
 previewBuild();
}
function startingAttrs(pos,h,w){
 let base={...POSITION_DATA[pos].base},m=buildMods(h,w);
 for(let k of Object.keys(m)) if(base[k]!=null) base[k]=clamp(base[k]+m[k],20,85);
 return base;
}
function calcOVR(pos,a){
 const weights={
 ST:{Shooting:3,Pace:2,Dribbling:2,Strength:1,Agility:1},
 LW:{Pace:3,Dribbling:3,Agility:2,Passing:1,Shooting:1},RW:{Pace:3,Dribbling:3,Agility:2,Passing:1,Shooting:1},
 CAM:{Passing:3,Dribbling:3,Agility:2,Shooting:1,Pace:1},CM:{Passing:3,Stamina:2,Dribbling:2,Defending:1,Agility:1},
 CDM:{Defending:3,Strength:2,Stamina:2,Passing:2},LB:{Pace:2,Defending:3,Stamina:2,Passing:1,Dribbling:1},RB:{Pace:2,Defending:3,Stamina:2,Passing:1,Dribbling:1},
 CB:{Defending:4,Strength:2,Jumping:2,Passing:1,Pace:1},GK:{Diving:3,Reflexes:3,Handling:2,Positioning:2,Kicking:1}
 }[pos];
 let total=0,w=0;for(let [k,v] of Object.entries(weights)){total+=(a[k]||0)*v;w+=v}return Math.round(total/w);
}
function positionMoments(pos){
 if(pos==="GK")return [["Shot on Target","The striker shoots towards goal.",["Save","Hold Position"]],["Cross","A cross comes into your box.",["Claim","Punch","Stay"]],["Distribution","You have the ball in your hands.",["Short Pass","Long Pass"]]];
 if(pos==="CB")return [["Defensive Duel","An attacker runs at the defence.",["Tackle","Track Runner","Hold Position"]],["Aerial Ball","A high ball is played into your area.",["Head Away","Clear","Hold Position"]],["Build Up","You receive the ball at the back.",["Short Pass","Long Pass","Carry Ball"]],["Attacking Corner","Your team has a corner.",["Near Post","Far Post","Stay Back"]]];
 if(["LB","RB"].includes(pos))return [["Wide Defence","The winger attacks your side.",["Tackle","Track Runner","Hold Position"]],["Wide Attack","You receive the ball in space.",["Cross","Pass","Dribble"]],["Overlap","Your team attacks down your side.",["Overlap","Come Short","Hold Position"]]];
 if(pos==="CDM")return [["Midfield Defence","The opposition breaks through midfield.",["Tackle","Track Runner","Hold Position"]],["Build Up","You receive the ball in midfield.",["Short Pass","Long Pass","Through Ball"]],["Second Ball","A loose ball drops in midfield.",["Press","Hold Position","Clear"]]];
 if(pos==="CM")return [["Midfield","You receive the ball in midfield.",["Pass","Through Ball","Dribble"]],["Defensive Transition","The opposition starts a counter.",["Press","Track Runner","Hold Position"]],["Attack","You arrive outside the box.",["Shoot","Through Ball","Pass"]]];
 if(pos==="CAM")return [["Final Third","You receive the ball between the lines.",["Through Ball","Dribble","Shoot","Pass"]],["Counter Attack","Your team breaks forward.",["Make Run","Through Ball","Pass"]],["Edge of Box","You receive the ball outside the box.",["Shoot","Through Ball","Dribble"]]];
 if(["LW","RW"].includes(pos))return [["Attacking Third","You receive the ball on the wing.",["Dribble","Cut Inside","Cross","Through Ball","Pass"]],["Counter Attack","Your team breaks forward.",["Make Run","Come Short","Dribble","Through Ball","Pass"]],["Inside the Box","You receive the ball inside the box.",["Shoot","Cross","Pass"]],["One-on-One","You break through with only the goalkeeper to beat.",["Shoot","Round Keeper","Square Ball"]],["Byline","You reach the byline with teammates arriving.",["Cross","Cut Back","Pass"]]];
 return [["Final Third","You receive the ball near the box.",["Shoot","Through Ball","Pass","Dribble"]],["Back to Goal","You receive the ball with a defender tight behind you.",["Hold Up Ball","Turn","Pass"]],["Inside the Box","The ball falls to you inside the box.",["Shoot","Pass"]],["Counter Attack","Your team breaks forward.",["Make Run","Come Short","Hold Up Ball"]],["Attacking Cross","A cross is delivered into the box.",["Attack Near Post","Attack Far Post","Hold Position"]]];
}
function createCareer(){
 let h=+$("#height").value,w=+$("#weight").value,m=buildMods(h,w),league=$("#league").value,club=$("#club").value;
 let pos=$("#pos").value; let base=startingAttrs(pos,h,w);
 let p={name:$("#name").value||"Player",nationality:$("#nat").value,age:+$("#age").value,height:h,weight:w,foot:$("#foot").value,pos,style:$("#style").value,club,ovr:calcOVR(pos,base),attrs:base};
 let clubs=LEAGUES[league];
 save={player:p,league,season:"2026/27",week:1,club,trust:55,fitness:100,form:6.8,apps:0,goals:0,assists:0,trainedThisWeek:false,table:clubs.map(t=>({team:t.name,strength:t.strength,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0})),history:[],schedule:makeSchedule(clubs.map(x=>x.name),club),fixtureIndex:0,trainedForFixture:-1,rankings:null,showAwards:false};
 save.nextOpponent=save.schedule[0];save.worldPlayers=buildWorld();cleanOpeningWorld();save.rankHistory=[];save.awardHistory=[];save.skillPoints=0;save.reputation=Math.max(45,p.ovr-8);refreshRanks();persist();show("home")
}
function makeSchedule(teams,club){let opp=teams.filter(x=>x!==club),arr=[];for(let x of opp)arr.push(x);for(let x of [...opp].reverse())arr.push(x);return arr}
function nav(){let n=$("#nav");n.classList.remove("hidden");n.innerHTML=[["home","Home"],["career","Career"],["match","Match"],["table","Table"],["history","History"]].map(([p,n])=>`<button class="${page===p?"active":""}" onclick="show('${p}')">${n}</button>`).join("")}

function migrateV9(){
 if(!save||save.v9Migrated)return;
 cleanOpeningWorld();
 let seen=new Set();
 (save.worldPlayers||[]).forEach(p=>{
   p.club=canonClub(p.club);
   if(!p.real){
     if(seen.has(p.name))p.name=uniqueGeneratedName(save.worldPlayers);
     seen.add(p.name);
   }
 });
 save.skillPoints=Math.min(15,save.skillPoints||0);
 save.inbox=save.inbox||[];
 save.v9Migrated=true;refreshRanks();persist();
}

function show(p){migrateV9();if(save&&!save.worldPlayers){save.worldPlayers=buildWorld();cleanOpeningWorld();save.rankHistory=[];save.awardHistory=[];save.skillPoints=0;save.reputation=Math.max(45,p.ovr-8);refreshRanks();persist()}page=p;nav();({home,career,match,table,history}[p])()}

function expectedGoals(a,b){

function poisson(lambda){let L=Math.exp(-lambda),p=1,k=0;do{k++;p*=Math.random()}while(p>L);return k-1}
function simScore(a,b){let noiseA=(Math.random()-.5)*.65,noiseB=(Math.random()-.5)*.65;return [poisson(clamp(expectedGoals(a,b)+noiseA,.15,3.6)),poisson(clamp(expectedGoals(b,a)+noiseB,.15,3.6))]}

function addRealPlayers(players){

 players=players.filter(p=>!keys.has(p.league+"|"+p.club+"|"+p.pos));

function developWorldPlayers(){

const FIRST=["Mateo","Lucas","Noah","Leo","Hugo","Luca","Elias","Theo","Oscar","Adam","Daniel","Rafael","Marco","Nico","Julian","Milan","Gabriel","Samuel","Victor","Alex"];
const LAST=["Silva","Martinez","Costa","Müller","Rossi","Dubois","Santos","Garcia","Bauer","Moretti","Fernandes","Romero","Keller","Lopes","Martin","Schmidt","Conti","Torres","Pereira","Bernard"];
function rngName(i){return FIRST[i%FIRST.length]+" "+LAST[(i*7+3)%LAST.length]}
function positionGroup(pos){return pos==="GK"?"GK":pos==="CB"?"CB":["LB","RB"].includes(pos)?"FB":pos==="CDM"?"DM":pos==="CM"?"CM":pos==="CAM"?"AM":["LW","RW"].includes(pos)?"W":"ST"}
function squadPositions(){return ["GK","GK","CB","CB","CB","CB","LB","RB","CDM","CM","CM","CAM","LW","RW","ST","ST","LW","RB","CDM","ST"]}
function buildWorld(){
 let players=[],id=1;
 Object.entries(LEAGUES).forEach(([league,clubs])=>clubs.forEach(cl=>{
   let ps=squadPositions();
   ps.forEach((pos,j)=>{
     let spread=(Math.random()*13-6), roleBoost=(j<17?0:-4);
     let ovr=clamp(Math.round(cl.strength-7+spread+roleBoost),55,91);
     let age=Math.floor(18+Math.random()*16);
     let rep=clamp(Math.round(ovr+(age>25?2:0)+(cl.strength-75)*.12),50,95);
     players.push({id:id++,name:rngName(id+j),club:cl.name,league,pos,age,ovr,rep,apps:0,goals:0,assists:0,rating:6.5,minutes:0,form:6.5,value:Math.max(1,Math.round((ovr-55)*1.7*(age<24?1.25:1)))});
   })
 }));

}
function simPeerWeek(){
 if(!save.worldPlayers)return;
 save.worldPlayers.forEach(p=>{
   if(Math.random()<.78){
    p.apps++;p.minutes+=Math.floor(65+Math.random()*26);
    let attack=["ST","LW","RW","CAM"].includes(p.pos);
    let mid=["CM","CDM"].includes(p.pos);
    let gChance=attack?.12+Math.max(0,p.ovr-70)*.007:mid?.035:.018;
    let aChance=attack?.09+Math.max(0,p.ovr-70)*.004:mid?.07:.025;
    if(Math.random()<gChance)p.goals++;
    if(Math.random()<aChance)p.assists++;
    let perf=6.15+(p.ovr-65)*.018+(Math.random()-.5)*1.2+(p.goals/p.apps)*.35+(p.assists/p.apps)*.25;
    p.rating=clamp((p.rating*(p.apps-1)+perf)/p.apps,5.8,8.5);
   }
 })
}
function peerScore(p){
 let apps=p.apps||0, sample=Math.min(1,apps/28);
 let score=p.ovr*.80+(p.rep||p.ovr)*.18;
 let ratingImpact=Math.max(-1.2,Math.min(1.2,(p.rating||6.5)-6.5))*3.2*sample;
 let output=0;
 if(["ST","LW","RW","CAM"].includes(p.pos))output=((p.goals||0)*.42+(p.assists||0)*.28)*sample;
 else if(["CM","CDM","LB","RB"].includes(p.pos))output=((p.assists||0)*.25+(p.goals||0)*.18)*sample;
 else output=((p.rating||6.5)-6.5)*2.2*sample;
 return score+ratingImpact+output;
}

function internalClubName(raw,league){
  const n=normText(raw);
  if(V11_CLUB_ALIAS[n])return V11_CLUB_ALIAS[n];
  const clubs=(LEAGUES[league]||[]).map(x=>x.name);
  const exact=clubs.find(c=>normText(c)===n);
  if(exact)return exact;
  // Conservative fuzzy match for prefixes such as FC/AC/RC.
  let best=null,bestScore=0;
  for(const c of clubs){
    const cn=normText(c),a=new Set(n.split(" ")),b=new Set(cn.split(" "));
    let same=0;for(const w of a)if(w.length>2&&b.has(w))same++;

    if(score>bestScore){bestScore=score;best=c}

function nameKeys(name,first,last){
  let keys=new Set(),add=x=>{let n=normText(x);if(n)keys.add(n)};
  add(name);add((first||"")+" "+(last||""));
  let n=normText(name),parts=n.split(" ").filter(Boolean);
  if(parts.length>=2)add(parts[0]+" "+parts[parts.length-1]);
  return [...keys];
}

async function loadFcRatingsV11(){
  loadingDb("Building 2026/27 database","The live squad list is ready. Now Career XI is matching ratings and attributes.","Matching EA FC 26 ratings");
  const text=await (await fetch(V11_DB.ratingsUrl,{cache:"no-store"})).text();
  const lines=text.split(/\n/).filter(Boolean),idx=csvIndex(lines[0]),map=new Map(),clubLast=new Map();
  let rows=0;
  for(let li=1;li<lines.length;li++){
    const r=parseCsvRow(lines[li].replace(/\r$/,"")); if(r.length<10)continue;
    const club=r[idx.club_name]||"",positions=r[idx.player_positions]||"";
    const rec={
      short:r[idx.short_name]||"",long:r[idx.long_name]||"",club,
      pos:fcPosition(positions),overall:+r[idx.overall]||0,potential:+r[idx.potential]||0,
      age:+r[idx.age]||24,height:+r[idx.height_cm]||0,weight:+r[idx.weight_kg]||0,
      foot:r[idx.preferred_foot]||"",pace:+r[idx.pace]||0,shooting:+r[idx.shooting]||0,
      passing:+r[idx.passing]||0,dribbling:+r[idx.dribbling]||0,defending:+r[idx.defending]||0,
      physic:+r[idx.physic]||0,value:+r[idx.value_eur]||0
    };
    if(!rec.overall)continue;rows++;
    const keys=nameKeys(rec.long);keys.push(normText(rec.short));
    for(const k of keys)if(k&&!map.has(k))map.set(k,rec);
    const lp=normText(rec.long).split(" ").filter(Boolean).pop();
    if(lp)clubLast.set(normText(rec.club)+"|"+lp,rec);
  }
  return {map,clubLast,rows};
}
function findRatingV11(tm,ratings){
  for(const k of nameKeys(tm.name,tm.first,tm.last)){
    const x=ratings.map.get(k);if(x)return x;
  }
  const last=normText(tm.last||tm.name).split(" ").filter(Boolean).pop();
  if(last){
    const candidates=[tm.club,internalClubName(tm.club,tm.league)];
    for(const c of candidates){
      let x=ratings.clubLast.get(normText(c)+"|"+last);if(x)return x;
    }
  }
  return null;
}
async function loadTransfermarktRosterV11(){
  loadingDb("Building 2026/27 database","Career XI is downloading the current top-five-league squad database.","Loading live real-player rosters");
  const text=await fetchMaybeGzip(V11_DB.rosterUrl);
  const lines=text.split(/\n/).filter(Boolean),idx=csvIndex(lines[0]),raw=[];
  for(let li=1;li<lines.length;li++){
    const r=parseCsvRow(lines[li].replace(/\r$/,""));
    const comp=r[idx.current_club_domestic_competition_id],league=V11_DB.comps[comp];
    if(!league)continue;
    const clubRaw=r[idx.current_club_name]||"";
    raw.push({
      tmId:+r[idx.player_id]||li,name:r[idx.name]||"Unknown Player",first:r[idx.first_name]||"",
      last:r[idx.last_name]||"",club:internalClubName(clubRaw,league),clubRaw,league,

  if(raw.length<1000)throw new Error(`The live roster returned only ${raw.length} top-five-league players, so Career XI stopped rather than filling the gaps with fake players.`);
  return raw;
}
function clubStrengthV11(club,league){
  let c=(LEAGUES[league]||[]).find(x=>normText(x.name)===normText(internalClubName(club,league)));
  return c?.strength||73;
}
function buildRealWorldV11(raw,ratings){
  let out=[],matches=0;
  for(const tm of raw){
    const rt=findRatingV11(tm,ratings),cs=clubStrengthV11(tm.club,tm.league);
    if(rt)matches++;
    const ovr=rt?.overall||estimateOvr(tm.value,tm.age,cs,tm.pos);
    const potential=rt?.potential||clamp(ovr+(tm.age<=19?8:tm.age<=22?5:tm.age<=25?2:0),ovr,94);
    let attrs;
    if(rt&&tm.pos!=="GK"){
      attrs={
        Pace:rt.pace||Math.max(35,ovr-5),Agility:rt.dribbling||Math.max(35,ovr-4),
        Shooting:rt.shooting||Math.max(25,ovr-10),Passing:rt.passing||Math.max(30,ovr-7),
        Dribbling:rt.dribbling||Math.max(30,ovr-6),Defending:rt.defending||Math.max(20,ovr-15),
        Strength:rt.physic||Math.max(35,ovr-5),Jumping:rt.physic||Math.max(35,ovr-5),
        Stamina:rt.physic||Math.max(35,ovr-5)
      };
    } else attrs=derivedAiAttrs(tm.pos,ovr);
    out.push({
      id:"tm"+tm.tmId,tmId:tm.tmId,name:tm.name,club:tm.club,league:tm.league,pos:tm.pos,
      age:tm.age,ovr,potential,rep:clamp(Math.round(ovr+(tm.value>=50000000?3:tm.value>=20000000?1:0)),45,96),
      apps:0,goals:0,assists:0,rating:6.5,minutes:0,form:6.5,value:tm.value||rt?.value||0,
      real:true,generated:false,nationality:tm.nationality,height:tm.height||rt?.height||0,
      weight:rt?.weight||0,foot:tm.foot||rt?.foot||"",contract:tm.contract||"",attrs,
      ratingSource:rt?"FC26":"Estimated"
    });
  }
  // Remove accidental duplicate IDs/names at the same club.
  const seen=new Set();
  out=out.filter(p=>{let k=p.tmId+"|"+normText(p.name)+"|"+normText(p.club);if(seen.has(k))return false;seen.add(k);return true});
  return {players:out,matches};
}
function buildFcOnlyFallbackV11(ratingsText){
  const lines=ratingsText.split(/\n/).filter(Boolean),idx=csvIndex(lines[0]),out=[],id=1;
  const clubLookup=new Map();
  Object.entries(LEAGUES).forEach(([league,clubs])=>clubs.forEach(c=>clubLookup.set(normText(c.name),{league,club:c.name,strength:c.strength})));
  for(let li=1;li<lines.length;li++){
    const r=parseCsvRow(lines[li].replace(/\r$/,"")); if(r.length<10)continue;
    const rawClub=r[idx.club_name]||"";
    let found=null;
    for(const [league,clubs] of Object.entries(LEAGUES)){
      const c=internalClubName(rawClub,league);
      const hit=clubs.find(x=>normText(x.name)===normText(c));if(hit){found={league,club:hit.name};break}
    }
    if(!found)continue;
    const pos=fcPosition(r[idx.player_positions]),ovr=+r[idx.overall]||65;
    out.push({id:"fc"+id++,name:r[idx.long_name]||r[idx.short_name],club:found.club,league:found.league,pos,
      age:+r[idx.age]||24,ovr,potential:+r[idx.potential]||ovr,rep:clamp(ovr,45,96),apps:0,goals:0,assists:0,rating:6.5,minutes:0,form:6.5,
      value:+r[idx.value_eur]||0,real:true,generated:false,nationality:r[idx.nationality_name]||"",height:+r[idx.height_cm]||0,weight:+r[idx.weight_kg]||0,
      foot:r[idx.preferred_foot]||"",attrs:{Pace:+r[idx.pace]||60,Agility:+r[idx.dribbling]||60,Shooting:+r[idx.shooting]||50,Passing:+r[idx.passing]||55,Dribbling:+r[idx.dribbling]||55,Defending:+r[idx.defending]||45,Strength:+r[idx.physic]||60,Jumping:+r[idx.physic]||60,Stamina:+r[idx.physic]||60},ratingSource:"FC26"});
  }
  return out;
}
async function loadRealPlayerDatabaseV11(){
  let roster=null,ratings=null,ratingsText=null,rosterError=null,ratingsError=null;
  try{roster=await loadTransfermarktRosterV11()}catch(e){rosterError=e}
  try{
    loadingDb("Building 2026/27 database","Loading the ratings layer for every player Career XI can match.","Loading ratings and attributes");
    const rr=await fetch(V11_DB.ratingsUrl,{cache:"no-store"});if(!rr.ok)throw new Error("Ratings request failed");
    ratingsText=await rr.text();
    // Parse from the already downloaded text.
    const lines=ratingsText.split(/\n/).filter(Boolean),idx=csvIndex(lines[0]),map=new Map(),clubLast=new Map();let rows=0;
    for(let li=1;li<lines.length;li++){
      const r=parseCsvRow(lines[li].replace(/\r$/,""));if(r.length<10)continue;
      const rec={short:r[idx.short_name]||"",long:r[idx.long_name]||"",club:r[idx.club_name]||"",pos:fcPosition(r[idx.player_positions]),overall:+r[idx.overall]||0,potential:+r[idx.potential]||0,age:+r[idx.age]||24,height:+r[idx.height_cm]||0,weight:+r[idx.weight_kg]||0,foot:r[idx.preferred_foot]||"",pace:+r[idx.pace]||0,shooting:+r[idx.shooting]||0,passing:+r[idx.passing]||0,dribbling:+r[idx.dribbling]||0,defending:+r[idx.defending]||0,physic:+r[idx.physic]||0,value:+r[idx.value_eur]||0};
      if(!rec.overall)continue;rows++;for(const k of [...nameKeys(rec.long),normText(rec.short)])if(k&&!map.has(k))map.set(k,rec);
      const lp=normText(rec.long).split(" ").filter(Boolean).pop();if(lp)clubLast.set(normText(rec.club)+"|"+lp,rec);
    }
    ratings={map,clubLast,rows};
  }catch(e){ratingsError=e}
  if(roster){
    const built=buildRealWorldV11(roster,ratings||{map:new Map(),clubLast:new Map(),rows:0});
    return {players:built.players,meta:{mode:"Live roster",players:built.players.length,ratingMatches:built.matches,ratingsRows:ratings?.rows||0,rosterSource:"Transfermarkt dataset",ratingSource:ratings?"EA FC 26 + estimates":"Market-value estimates",loadedAt:new Date().toISOString(),warning:ratingsError?String(ratingsError.message||ratingsError):""}};
  }
  // Real-player-only fallback: FC26 contains 16k+ real players. It can seed the five league clubs if live roster is temporarily unavailable.
  if(ratingsText){
    const players=buildFcOnlyFallbackV11(ratingsText);
    if(players.length>=1000)return {players,meta:{mode:"Real-player fallback",players:players.length,ratingMatches:players.length,ratingsRows:players.length,rosterSource:"EA FC 26 club squads",ratingSource:"EA FC 26",loadedAt:new Date().toISOString(),warning:"Live Transfermarkt roster was unavailable. No fictional senior players were inserted."}};
  }
  throw rosterError||ratingsError||new Error("No real-player data source could be reached.");
}

function buildWorld(){return []}

function rankingList(scope){
  const u=userPeer();
  let arr=(save.worldPlayers||[]).filter(p=>p.pos===u.pos);
  if(scope==="club")arr=arr.filter(p=>sameClubV11(p.club,save.club));
  if(scope==="league")arr=arr.filter(p=>p.league===save.league);
  arr=[...arr,{...u,isUser:true}].sort((a,b)=>peerScore(b)-peerScore(a));
  return arr;
}
function squadCompetition(){
  let exact=(save.worldPlayers||[]).filter(p=>sameClubV11(p.club,save.club)&&p.pos===save.player.pos).sort((a,b)=>b.ovr-a.ovr);
  if(exact.length)return exact;
  const g=positionGroup(save.player.pos);
  return (save.worldPlayers||[]).filter(p=>sameClubV11(p.club,save.club)&&positionGroup(p.pos)===g).sort((a,b)=>b.ovr-a.ovr);
}
function sameClub(a,b){return sameClubV11(a,b)}

// Future-season newgens: young, unique, and added only after the real 2026/27 starting world exists.
function regenSeasonPlayers(){
  if(!save||!save.worldPlayers||save.season==="2026/27")return;
  const clubs=Object.entries(LEAGUES).flatMap(([league,cs])=>cs.map(c=>({league,club:c.name,strength:c.strength})));
  let next=Date.now()%100000000;
  for(const c of clubs){
    const count=Math.random()<0.45?1:0;
    for(let z=0;z<count;z++){
      const positions=["GK","CB","LB","RB","CDM","CM","CAM","LW","RW","ST"],pos=positions[Math.floor(Math.random()*positions.length)];
      const ovr=clamp(Math.round(c.strength-19+Math.random()*10),52,73),age=16+Math.floor(Math.random()*4);
      const name=uniqueGeneratedName(save.worldPlayers);
      save.worldPlayers.push({id:"ng"+(next++),name,club:c.club,league:c.league,pos,age,ovr,potential:clamp(ovr+9+Math.floor(Math.random()*15),68,94),
        rep:Math.max(42,ovr-6),apps:0,goals:0,assists:0,rating:6.5,minutes:0,form:6.5,value:Math.max(250000,(ovr-48)*250000),
        real:false,generated:true,nationality:"",height:0,weight:0,foot:"",attrs:derivedAiAttrs(pos,ovr),ratingSource:"Newgen"});
    }
  }
}
function developWorldPlayers(){
  if(!save?.worldPlayers)return;
  for(const p of save.worldPlayers){
    p.age=(p.age||24)+1;
    const pot=p.potential||p.ovr;
    if(p.age<=23&&p.ovr<pot&&Math.random()<0.58)p.ovr=Math.min(pot,p.ovr+1+(Math.random()<0.12?1:0));
    else if(p.age>=31&&Math.random()<0.48)p.ovr=Math.max(50,p.ovr-1);
    p.rep=clamp(Math.round((p.rep||p.ovr)+(p.rating-6.5)*1.2+(p.goals>15?1:0)),40,97);
    p.apps=0;p.goals=0;p.assists=0;p.rating=6.5;p.minutes=0;
  }
  save.worldPlayers=save.worldPlayers.filter(p=>!(p.age>=36&&Math.random()<0.55));
}
// Override fixture advancement so the first newgen intake arrives AFTER season 1.
function advanceFixture(){
  save.trainedForFixture=-1;save.trainedThisWeek=false;save.selection=null;save.week++;save.fixtureIndex++;
  if(save.fixtureIndex>=save.schedule.length){
    save.showAwards=true;developWorldPlayers();save.player.age++;
    save.fixtureIndex=0;save.season=(parseInt(save.season.slice(0,4))+1)+"/"+String((parseInt(save.season.slice(0,4))+2)%100).padStart(2,"0");
    save.week=1;save.table.forEach(x=>Object.assign(x,{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
    regenSeasonPlayers();
  }
  save.nextOpponent=save.schedule[save.fixtureIndex];
}
