<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Career XI</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#0b1020;color:#f7f8fb}button,input,select{font:inherit}
.shell{max-width:540px;margin:auto;min-height:100vh;padding:18px 16px 94px}.brand{font-weight:900;letter-spacing:-1px;font-size:28px}.accent{color:#75f0a7}.muted{color:#9ca7bd}
.card{background:#141c30;border:1px solid #26324d;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0003}.hero{padding:28px 0 12px}.hero h1{font-size:42px;line-height:.95;margin:12px 0}
.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;margin:7px 0;background:#75f0a7;color:#07130c;font-weight:800}.btn.secondary{background:#202b45;color:#fff}
label{display:block;font-size:13px;color:#aeb8cc;margin:12px 0 5px}input,select{width:100%;background:#0d1426;color:white;border:1px solid #33415f;border-radius:12px;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0d1426;border-radius:14px;padding:12px}.stat b{font-size:21px;display:block}.top{display:flex;justify-content:space-between;align-items:center}
.pill{padding:6px 9px;border-radius:999px;background:#23304c;color:#cbd5e1;font-size:12px}.fixture{text-align:center;padding:12px}.clubs{display:flex;justify-content:space-around;gap:8px;align-items:center;font-weight:800;font-size:17px}.vs{color:#75f0a7}
.nav{position:fixed;bottom:0;left:0;right:0;background:#10182a;border-top:1px solid #283550;display:flex;justify-content:center;z-index:5}.nav button{max-width:108px;flex:1;background:none;border:0;color:#95a2bb;padding:14px 4px 18px;font-size:12px}.nav button.active{color:#75f0a7;font-weight:800}.hidden{display:none!important}
.choice{background:#202b45;color:white;border:1px solid #344362;border-radius:14px;padding:13px;width:100%;margin:6px 0;text-align:left}.event{border-left:3px solid #75f0a7;padding:9px 12px;margin:8px 0;background:#10182a;border-radius:0 10px 10px 0}.good{color:#75f0a7}.bad{color:#ff8794}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 4px;border-bottom:1px solid #283550;text-align:left}th{color:#98a5bc}.progress{height:8px;background:#283550;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:#75f0a7}
h2{margin:18px 0 8px}h3{margin:5px 0}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:#7f8ba4;margin-top:20px}.note{font-size:12px;line-height:1.45;color:#91a0b9}
</style></head><body><div id="app"></div><nav id="nav" class="nav hidden"></nav><script>
const LEAGUES={"Premier League": [{"name": "Arsenal", "strength": 88}, {"name": "Manchester City", "strength": 87}, {"name": "Manchester United", "strength": 82}, {"name": "Aston Villa", "strength": 81}, {"name": "Liverpool", "strength": 84}, {"name": "Chelsea", "strength": 81}, {"name": "Newcastle United", "strength": 80}, {"name": "Tottenham Hotspur", "strength": 78}, {"name": "Crystal Palace", "strength": 77}, {"name": "Brighton", "strength": 77}, {"name": "Bournemouth", "strength": 76}, {"name": "Brentford", "strength": 76}, {"name": "Fulham", "strength": 75}, {"name": "Everton", "strength": 75}, {"name": "Nottingham Forest", "strength": 75}, {"name": "Leeds United", "strength": 74}, {"name": "Sunderland", "strength": 73}, {"name": "Coventry City", "strength": 69}, {"name": "Ipswich Town", "strength": 70}, {"name": "Hull City", "strength": 68}], "La Liga": [{"name": "Barcelona", "strength": 90}, {"name": "Real Madrid", "strength": 89}, {"name": "Villarreal", "strength": 82}, {"name": "Atlético Madrid", "strength": 83}, {"name": "Real Betis", "strength": 79}, {"name": "Celta Vigo", "strength": 76}, {"name": "Getafe", "strength": 75}, {"name": "Rayo Vallecano", "strength": 75}, {"name": "Valencia", "strength": 76}, {"name": "Real Sociedad", "strength": 78}, {"name": "Espanyol", "strength": 74}, {"name": "Athletic Club", "strength": 78}, {"name": "Sevilla", "strength": 75}, {"name": "Alavés", "strength": 72}, {"name": "Elche", "strength": 72}, {"name": "Levante", "strength": 71}, {"name": "Osasuna", "strength": 74}, {"name": "Racing Santander", "strength": 69}, {"name": "Deportivo La Coruña", "strength": 70}, {"name": "Málaga", "strength": 68}], "Serie A": [{"name": "Inter", "strength": 87}, {"name": "Napoli", "strength": 85}, {"name": "AC Milan", "strength": 84}, {"name": "Juventus", "strength": 83}, {"name": "Roma", "strength": 82}, {"name": "Atalanta", "strength": 81}, {"name": "Lazio", "strength": 79}, {"name": "Fiorentina", "strength": 78}, {"name": "Bologna", "strength": 78}, {"name": "Como", "strength": 77}, {"name": "Torino", "strength": 75}, {"name": "Genoa", "strength": 74}, {"name": "Udinese", "strength": 74}, {"name": "Parma", "strength": 73}, {"name": "Cagliari", "strength": 72}, {"name": "Lecce", "strength": 71}, {"name": "Sassuolo", "strength": 73}, {"name": "Venezia", "strength": 69}, {"name": "Frosinone", "strength": 69}, {"name": "Monza", "strength": 70}], "Bundesliga": [{"name": "Bayern Munich", "strength": 90}, {"name": "Borussia Dortmund", "strength": 84}, {"name": "Bayer Leverkusen", "strength": 84}, {"name": "RB Leipzig", "strength": 81}, {"name": "Eintracht Frankfurt", "strength": 80}, {"name": "VfB Stuttgart", "strength": 79}, {"name": "Freiburg", "strength": 77}, {"name": "Mainz", "strength": 76}, {"name": "Hoffenheim", "strength": 75}, {"name": "Werder Bremen", "strength": 75}, {"name": "Hamburg", "strength": 74}, {"name": "Union Berlin", "strength": 74}, {"name": "Cologne", "strength": 73}, {"name": "Augsburg", "strength": 72}, {"name": "Borussia Mönchengladbach", "strength": 75}, {"name": "Schalke 04", "strength": 71}, {"name": "Elversberg", "strength": 68}, {"name": "Paderborn", "strength": 69}], "Ligue 1": [{"name": "Paris Saint-Germain", "strength": 92}, {"name": "Lens", "strength": 82}, {"name": "Lille", "strength": 81}, {"name": "Lyon", "strength": 80}, {"name": "Marseille", "strength": 79}, {"name": "Rennes", "strength": 78}, {"name": "Monaco", "strength": 78}, {"name": "Strasbourg", "strength": 77}, {"name": "Toulouse", "strength": 75}, {"name": "Lorient", "strength": 73}, {"name": "Paris FC", "strength": 74}, {"name": "Brest", "strength": 75}, {"name": "Angers", "strength": 71}, {"name": "Le Havre", "strength": 70}, {"name": "Auxerre", "strength": 72}, {"name": "Nice", "strength": 75}, {"name": "Troyes", "strength": 68}, {"name": "Le Mans", "strength": 67}]};
const $=s=>document.querySelector(s);
let save=JSON.parse(localStorage.getItem("careerXI2")||"null"),page="home",matchState=null;
const persist=()=>localStorage.setItem("careerXI2",JSON.stringify(save));
function app(h){$("#app").innerHTML=`<main class="shell">${h}</main>`}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function start(){document.querySelector("#nav").classList.add("hidden");app(`<div class="hero"><div class="brand">CAREER<span class="accent">XI</span></div><h1>Your career.<br>Your decisions.</h1><p class="muted">Build a player and live a career across Europe's top five leagues.</p></div><div class="card"><h3>Player Career</h3><p class="muted">2026/27 database • five leagues • full tables</p><button class="btn" onclick="creator()">New Career</button>${save?`<button class="btn secondary" onclick="show('home')">Continue ${save.player.name}</button>`:""}</div>`)}
function heightOptions(){let a=[];for(let inch=60;inch<=81;inch++){let ft=Math.floor(inch/12),i=inch%12;a.push(`<option value="${inch}" ${inch===69?"selected":""}>${ft}'${i}" (${Math.round(inch*2.54)} cm)</option>`)}return a.join("")}
function weightOptions(){let a=[];for(let kg=50;kg<=115;kg+=2)a.push(`<option value="${kg}" ${kg===70?"selected":""}>${kg} kg (${Math.round(kg*2.20462)} lb)</option>`);return a.join("")}
function creator(){app(`<div class="top"><div class="brand">CAREER<span class="accent">XI</span></div><span class="pill">NEW CAREER</span></div><h2>Create Player</h2><div class="card">
<label>Name</label><input id="name" value="Cole"><div class="grid"><div><label>Nationality</label><select id="nat"><option>England</option><option>Scotland</option><option>Wales</option><option>France</option><option>Spain</option><option>Germany</option><option>Italy</option><option>Brazil</option><option>Portugal</option><option>Netherlands</option></select></div><div><label>Age</label><select id="age">${[16,17,18,19].map(x=>`<option>${x}</option>`).join("")}</select></div></div>
<div class="grid"><div><label>Height</label><select id="height" onchange="previewBuild()">${heightOptions()}</select></div><div><label>Weight</label><select id="weight" onchange="previewBuild()">${weightOptions()}</select></div></div>
<div id="buildPreview" class="card" style="margin:12px 0 0"></div>
<div class="grid"><div><label>Preferred Foot</label><select id="foot"><option>Right</option><option>Left</option></select></div><div><label>Position</label><select id="pos"><option>ST</option><option>LW</option><option>RW</option><option>CAM</option><option>CM</option><option>CDM</option><option>LB</option><option>RB</option><option>CB</option><option>GK</option></select></div></div>
<label>Playstyle</label><select id="style"><option>Inside Forward</option><option>Traditional Winger</option><option>Wide Playmaker</option><option>Advanced Forward</option><option>Poacher</option><option>Box-to-Box</option><option>Ball Winning Midfielder</option><option>Ball Playing Defender</option></select>
<label>League</label><select id="league" onchange="clubsForLeague()">${Object.keys(LEAGUES).map(x=>`<option>${x}</option>`).join("")}</select>
<label>Starting Club</label><select id="club"></select><button class="btn" onclick="createCareer()">Start Career</button></div>`);clubsForLeague();previewBuild()}
function clubsForLeague(){let l=$("#league").value;$("#club").innerHTML=LEAGUES[l].map(x=>`<option>${x.name}</option>`).join("")}
function buildMods(h,w){
 // Balanced around 5'9 / 70kg. Height trades agility/pace for strength/jumping;
 // weight trades pace/agility for strength. Effects are deliberately moderate.
 let tall=(h-69), heavy=(w-70)/5;
 return {
  Pace:Math.round(-0.45*tall-0.55*heavy),
  Agility:Math.round(-0.65*tall-0.75*heavy),
  Strength:Math.round(0.7*tall+1.05*heavy),
  Jumping:Math.round(0.8*tall+0.15*heavy)
 }}
function previewBuild(){let h=+$("#height").value,w=+$("#weight").value,m=buildMods(h,w);$("#buildPreview").innerHTML=`<div class="section-title">Physical build effect</div><div class="grid">${Object.entries(m).map(([k,v])=>`<div class="stat"><span class="muted">${k}</span><b class="${v>0?"good":v<0?"bad":""}">${v>0?"+":""}${v}</b></div>`).join("")}</div><p class="note">These are starting-attribute modifiers, not permanent limits.</p>`}
function createCareer(){
 let h=+$("#height").value,w=+$("#weight").value,m=buildMods(h,w),league=$("#league").value,club=$("#club").value;
 let base={Pace:68,Agility:68,Shooting:62,Passing:64,Dribbling:67,Defending:45,Strength:61,Jumping:62,Stamina:64};
 for(let k of Object.keys(m))base[k]=clamp(base[k]+m[k],35,85);
 let p={name:$("#name").value||"Player",nationality:$("#nat").value,age:+$("#age").value,height:h,weight:w,foot:$("#foot").value,pos:$("#pos").value,style:$("#style").value,club,ovr:64,attrs:base};
 let clubs=LEAGUES[league];
 save={player:p,league,season:"2026/27",week:1,club,trust:55,fitness:100,form:6.8,apps:0,goals:0,assists:0,table:clubs.map(t=>({team:t.name,strength:t.strength,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0})),history:[],schedule:makeSchedule(clubs.map(x=>x.name),club),fixtureIndex:0};
 save.nextOpponent=save.schedule[0];persist();show("home")
}
function makeSchedule(teams,club){let opp=teams.filter(x=>x!==club),arr=[];for(let x of opp)arr.push(x);for(let x of [...opp].reverse())arr.push(x);return arr}
function nav(){let n=$("#nav");n.classList.remove("hidden");n.innerHTML=[["home","Home"],["career","Career"],["match","Match"],["table","Table"],["history","History"]].map(([p,n])=>`<button class="${page===p?"active":""}" onclick="show('${p}')">${n}</button>`).join("")}
function show(p){page=p;nav();({home,career,match,table,history}[p])()}
function home(){app(`<div class="top"><div><div class="brand">CAREER<span class="accent">XI</span></div><div class="muted">${save.season} • ${save.league} • Matchweek ${save.week}</div></div><span class="pill">${save.club}</span></div><div class="card"><div class="section-title">Next Match</div><div class="fixture"><div class="clubs"><span>${save.club}</span><span class="vs">VS</span><span>${save.nextOpponent}</span></div><p class="muted">League Match</p><button class="btn" onclick="show('match')">Play Match</button></div></div><div class="grid"><div class="stat"><span class="muted">OVR</span><b>${save.player.ovr}</b></div><div class="stat"><span class="muted">Manager Trust</span><b>${save.trust}</b></div><div class="stat"><span class="muted">Apps</span><b>${save.apps}</b></div><div class="stat"><span class="muted">G/A</span><b>${save.goals}/${save.assists}</b></div></div><div class="card"><h3>${save.player.name}</h3><p>${save.player.pos} • ${save.player.style}</p><div class="progress"><i style="width:${save.fitness}%"></i></div><p class="muted">Fitness ${save.fitness}% • Form ${save.form.toFixed(1)}</p></div>`)}
function career(){let p=save.player,ft=Math.floor(p.height/12),inch=p.height%12;app(`<div class="top"><h2>Career</h2><span class="pill">${p.pos}</span></div><div class="card"><h3>${p.name}</h3><p class="muted">${p.age} • ${p.nationality} • ${ft}'${inch}" • ${p.weight}kg • ${p.foot} foot</p><div class="grid">${Object.entries(p.attrs).map(([k,v])=>`<div class="stat"><span class="muted">${k}</span><b>${v}</b></div>`).join("")}</div></div><div class="card"><h3>Development</h3><select id="training"><option>Balanced</option>${Object.keys(p.attrs).map(x=>`<option>${x}</option>`).join("")}</select><button class="btn secondary" onclick="train()">Complete Training</button></div>`)}
function train(){let f=$("#training").value;if(f!=="Balanced"&&save.player.attrs[f]<90)save.player.attrs[f]++;save.fitness=Math.max(80,save.fitness-2);save.trust=Math.min(100,save.trust+1);persist();career()}
function expectedGoals(a,b){
 // Strength matters strongly, but noise makes upsets possible.
 let diff=(a-b)/12;
 return clamp(1.25+diff,0.25,3.2)
}
function poisson(lambda){let L=Math.exp(-lambda),p=1,k=0;do{k++;p*=Math.random()}while(p>L);return k-1}
function simScore(a,b){let noiseA=(Math.random()-.5)*.65,noiseB=(Math.random()-.5)*.65;return [poisson(clamp(expectedGoals(a,b)+noiseA,.15,3.6)),poisson(clamp(expectedGoals(b,a)+noiseB,.15,3.6))]}
function strength(name){return save.table.find(x=>x.team===name).strength}
function match(){if(!matchState)matchState={minute:0,home:0,away:0,rating:6.5,events:[]};let m=matchState;app(`<div class="top"><h2>Matchday</h2><span class="pill">${m.minute}'</span></div><div class="card fixture"><div class="clubs"><span>${save.club} ${m.home}</span><span class="vs">-</span><span>${m.away} ${save.nextOpponent}</span></div><p class="muted">${save.player.name} • Rating ${m.rating.toFixed(1)}</p></div><div id="moment">${m.minute>=90?`<div class="card"><h3>Full Time</h3><button class="btn" onclick="finishMatch()">Finish Match</button></div>`:`<button class="btn" onclick="advance()">Continue Match</button>`}</div><div class="card"><h3>Match Events</h3>${m.events.length?m.events.slice().reverse().map(e=>`<div class="event">${e}</div>`).join(""):`<p class="muted">Kick-off awaits.</p>`}</div>`)}
function advance(){let m=matchState;m.minute=Math.min(90,m.minute+Math.floor(5+Math.random()*9));if(Math.random()<.32){decision();return}let usChance=clamp(.5+(strength(save.club)-strength(save.nextOpponent))/80,.25,.75);if(Math.random()<.19){let us=Math.random()<usChance;us?m.home++:m.away++;m.events.push(`${m.minute}' ⚽ ${us?save.club:save.nextOpponent} score.`)}match()}
function decision(){let ds=[["Attacking Third","You receive the ball on the wing.",["Dribble","Cross","Through Ball","Pass"]],["Inside the Box","The ball falls to you inside the box.",["Shoot","Pass","Dribble"]],["Counter Attack","Your team breaks forward.",["Make Run","Come Short","Through Ball","Pass"]],["Attacking Corner","Your teammate is taking the corner.",["Come Short","Edge of Box","Get Forward"]]],d=ds[Math.floor(Math.random()*ds.length)];$("#moment").innerHTML=`<div class="card"><div class="section-title">${matchState.minute}' • ${d[0]}</div><h3>${d[1]}</h3>${d[2].map(o=>`<button class="choice" onclick="choose('${o}')">${o}</button>`).join("")}</div>`}
function choose(o){let m=matchState,a=save.player.attrs;let skill=o==="Shoot"?a.Shooting:o==="Dribble"?a.Dribbling:o==="Cross"||o==="Through Ball"||o==="Pass"?a.Passing:(a.Pace+a.Agility)/2;let ok=Math.random()<clamp(.25+skill/140,.38,.82);if(o==="Shoot"&&ok&&Math.random()<.42){m.home++;save.goals++;m.rating+=.9;m.events.push(`${m.minute}' ⚽ ${save.player.name} scores.`)}else if(["Cross","Through Ball","Pass"].includes(o)&&ok&&Math.random()<.24){m.home++;save.assists++;m.rating+=.6;m.events.push(`${m.minute}' 🅰 ${save.player.name} creates the goal with a ${o.toLowerCase()}.`)}else{m.rating+=ok?.12:-.08;m.events.push(`${m.minute}' ${ok?"✓":"×"} ${o} — ${ok?"successful":"unsuccessful"}.`)}match()}
function finishMatch(){let m=matchState;save.apps++;save.form=clamp(m.rating,5.5,10);save.fitness=Math.max(70,save.fitness-10);save.trust=clamp(save.trust+(m.rating>=7?2:m.rating<6.3?-2:0),0,100);apply(save.club,save.nextOpponent,m.home,m.away);
 // Simulate every other club once this matchweek, pairing shuffled clubs.
 let rest=save.table.map(x=>x.team).filter(t=>t!==save.club&&t!==save.nextOpponent).sort(()=>Math.random()-.5);
 for(let i=0;i<rest.length-1;i+=2){let a=rest[i],b=rest[i+1],[ga,gb]=simScore(strength(a),strength(b));apply(a,b,ga,gb)}
 save.history.push({week:save.week,opp:save.nextOpponent,score:`${m.home}-${m.away}`,rating:m.rating.toFixed(1)});
 save.week++;save.fixtureIndex++;if(save.fixtureIndex>=save.schedule.length){save.fixtureIndex=0;save.season="2027/28";save.week=1;save.table.forEach(x=>Object.assign(x,{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));}
 save.nextOpponent=save.schedule[save.fixtureIndex];matchState=null;persist();show("home")}
function apply(a,b,ga,gb){let A=save.table.find(x=>x.team===a),B=save.table.find(x=>x.team===b);A.p++;B.p++;A.gf+=ga;A.ga+=gb;B.gf+=gb;B.ga+=ga;if(ga>gb){A.w++;B.l++;A.pts+=3}else if(gb>ga){B.w++;A.l++;B.pts+=3}else{A.d++;B.d++;A.pts++;B.pts++}}
function table(){let t=[...save.table].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);app(`<div class="top"><h2>${save.league}</h2><span class="pill">${t.length} clubs</span></div><div class="card"><table><tr><th>#</th><th>Club</th><th>P</th><th>GD</th><th>Pts</th></tr>${t.map((x,i)=>`<tr><td>${i+1}</td><td class="${x.team===save.club?"good":""}">${x.team}</td><td>${x.p}</td><td>${x.gf-x.ga}</td><td><b>${x.pts}</b></td></tr>`).join("")}</table></div><p class="note">Club strength influences results, but every match includes variance so favourites can lose and promoted clubs can overperform.</p>`)}
function history(){app(`<h2>Career History</h2><div class="card"><h3>${save.season}</h3>${save.history.length?save.history.map(x=>`<div class="event">MW${x.week} • ${save.club} ${x.score} ${x.opp}<br><span class="muted">Rating ${x.rating}</span></div>`).join(""):`<p class="muted">No matches played yet.</p>`}</div><button class="btn secondary" onclick="if(confirm('Delete this career?')){localStorage.removeItem('careerXI2');save=null;start()}">Delete Career</button>`)}
start();
</script></body></html>
