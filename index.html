 else if(["CM","CDM","LB","RB"].includes(p.pos))output=((p.assists||0)*.08+(p.goals||0)*.06)*sample;

function internalClubName(raw,league){
  const n=normText(raw);

  const exact=clubs.find(c=>normText(c)===n);
  if(exact)return exact;
  // Conservative fuzzy match for prefixes such as FC/AC/RC.
  let best=null,bestScore=0;
  for(const c of clubs){

    let same=0;for(const w of a)if(w.length>2&&b.has(w))same++;
    let score=same/Math.max(1,Math.min(a.size,b.size));

}

function parseCsvRow(line){

   V19 NAMED LEAGUE SIMULATION
   =========================== */
function matchPlayersForClub(club){
 return (save.worldPlayers||[]).filter(p=>sameClub(p.club,club));
}
function appearanceChanceV19(p,clubStrength){
 const rel=(p.ovr||65)-clubStrength;
 return clamp(.55+rel*.025, .20, .96);
}
function weightedPickV19(arr,weightFn){
 if(!arr.length)return null;
 let weights=arr.map(x=>Math.max(.01,weightFn(x))),sum=weights.reduce((a,b)=>a+b,0),r=Math.random()*sum;
 for(let i=0;i<arr.length;i++){r-=weights[i];if(r<=0)return arr[i]}
 return arr[arr.length-1];
}
function recordAppearanceV19(p,mins){
 if(!p)return;
 p.apps=(p.apps||0)+1;
 p.minutes=(p.minutes||0)+mins;
 p._matchGoals=0;p._matchAssists=0;
}
function scorerWeightV19(p){
 const pos={ST:1.8,LW:1.45,RW:1.45,CAM:1.1,CM:.65,CDM:.3,LB:.22,RB:.22,CB:.16,GK:.01}[p.pos]||.45;
 return pos*Math.max(.35,((p.ovr||65)-45)/35);
}
function assisterWeightV19(p){
 const pos={ST:.8,LW:1.35,RW:1.35,CAM:1.65,CM:1.3,CDM:.7,LB:.65,RB:.65,CB:.2,GK:.04}[p.pos]||.5;
 return pos*Math.max(.35,((p.ovr||65)-45)/38);
}
function simulateClubLineupV19(club){
 const strengthNow=strength(club),pool=matchPlayersForClub(club);
 if(!pool.length)return [];
 let selected=pool.filter(p=>Math.random()<appearanceChanceV19(p,strengthNow));
 if(selected.length<11){
   selected=[...pool].sort((a,b)=>(b.ovr||0)-(a.ovr||0)).slice(0,Math.min(14,pool.length));
 }
 selected=selected.slice(0,16);
 selected.forEach((p,i)=>recordAppearanceV19(p,i<11?90:15+Math.floor(Math.random()*31)));
 return selected;
}
function simulateNamedFixtureV19(a,b,ga,gb){
 const A=simulateClubLineupV19(a),B=simulateClubLineupV19(b);
 const goalLines=[];
 function goalsFor(team,players,n){
   for(let i=0;i<n;i++){
     const scorer=weightedPickV19(players,scorerWeightV19);
     if(!scorer)continue;
     scorer.goals=(scorer.goals||0)+1;scorer._matchGoals=(scorer._matchGoals||0)+1;
     let candidates=players.filter(x=>x!==scorer);
     const assisted=Math.random()<.72;
     const assister=assisted?weightedPickV19(candidates,assisterWeightV19):null;
     if(assister){assister.assists=(assister.assists||0)+1;assister._matchAssists=(assister._matchAssists||0)+1}
     goalLines.push(`${team}: ${scorer.name}${assister?` (assist: ${assister.name})`:""}`);
   }
 }
 goalsFor(a,A,ga);goalsFor(b,B,gb);
 [...A,...B].forEach(p=>{
   const base=6.15+((p.ovr||65)-70)*.008+(Math.random()-.5)*.65;
   const perf=clamp(base+(p._matchGoals||0)*.72+(p._matchAssists||0)*.42,5.5,9.6);
   const oldApps=Math.max(0,(p.apps||1)-1);
   p.rating=oldApps?clamp(((p.rating||6.5)*oldApps+perf)/(oldApps+1),5.7,9):perf;
   delete p._matchGoals;delete p._matchAssists;
 });
 return goalLines;
}

function updateMarketValueV21(){
 ensureDepthV21();
 const apps=save.apps||0,form=clamp(save.form||6.5,5.5,9.5);
 const base=startingValueV22();

 // Slow growth: early senior appearances should move value gradually, not by hundreds of thousands at once.
 const appBoost=1+Math.min(.45,apps*.018);
 const formBoost=clamp(1+(form-6.5)*.055,.88,1.22);
 const ovrGrowth=Math.max(0,(save.player.ovr||60)-60);
 const abilityBoost=1+Math.min(.8,ovrGrowth*.035);
 const repBoost=1+Math.min(.25,Math.max(0,(save.mediaRep||10)-10)*.006);

 let target=base*appBoost*formBoost*abilityBoost*repBoost;

 // Hard early-career caps to stop instant £m values.
 if(apps<5)target=Math.min(target,250000);
 else if(apps<10)target=Math.min(target,500000);
 else if(apps<20)target=Math.min(target,1000000);

 // Smooth changes week to week instead of jumping straight to the new target.
 const current=save.marketValue||base;
 const maxUp=current*1.12;      // max +12% per update
 const maxDown=current*0.92;    // max -8% per update
 let next=target>current?Math.min(target,maxUp):Math.max(target,maxDown);

 save.marketValue=Math.max(50000,Math.round(next/25000)*25000);
}

function startingValueV22(){

function simulateUnselectedCoreV23(){
  const s=ensureSelection();

  const opponent=save.nextOpponent;
  const currentWeek=save.week;
  const [ga,gb]=simScore(strength(save.club),strength(opponent));

  // User fixture table result.
  apply(save.club,opponent,ga,gb);

  // Other fixtures and named player stats. If the detailed named layer ever fails,
  // fall back to a tiny table-only sim instead of freezing the career.
  try{

  }catch(err){
    console.warn("Detailed week sim failed, using fallback:",err);
    const rest=save.table.map(x=>x.team).filter(x=>x!==save.club&&x!==opponent);
    for(let i=0;i+1<rest.length;i+=2){
      const a=rest[i],b=rest[i+1],[x,y]=simScore(strength(a),strength(b));
      apply(a,b,x,y);
    }
  }

  save.history.push({
    week:currentWeek,opp:opponent,score:`${ga}-${gb}`,rating:"DNP",
    status:"Not Selected",minutes:0
  });

  safeOptionalV23(()=>refreshRanks());
  save.lastTrustChange=0;
  save.morale=clamp((save.morale||70)-1,20,100);

  // None of these secondary systems are allowed to stop match progression.
  safeOptionalV23(()=>socialWeekOnceV20());
  safeOptionalV23(()=>generateMediaV21());
  safeOptionalV23(()=>seasonWeekDepthV21());

  if(btn){
    btn.disabled=true;
    btn.textContent="Simulating…";
    btn.style.opacity=".72";
  }

  // Let the browser paint the pressed/loading state before doing the simulation.
  setTimeout(()=>{
    try{
      simulateUnselectedCoreV23();
    }catch(err){
      console.error("Simulation error:",err);
      if(btn){
        btn.disabled=false;
        btn.textContent="Retry Simulation";
        btn.style.opacity="1";
      }
      const shell=document.querySelector(".shell");

    }
  },40);
}

/* Appearance balance:
   - prospects receive more bench opportunities
   - no substitute appearance starts later than 75'
   - three consecutive DNPs heavily increase the chance of being on the bench */
function selectionInfo(){
 let p=save.player,clubStrength=strength(save.club),peers=squadCompetition(),best=peers[0]?.ovr||clubStrength-5;
 let gap=p.ovr-best,trust=save.trust||50,formBoost=(save.form-6.5)*3,elitePenalty=Math.max(0,(clubStrength-80)*.75),youthPenalty=p.age<=17?4:p.age<=19?2:0;
 let score=gap*2+(trust-50)*.45+formBoost-elitePenalty-youthPenalty;
 let recent=(save.history||[]).slice(-4),dnp=0;
 for(let i=recent.length-1;i>=0;i--){if(recent[i].rating==="DNP")dnp++;else break}
 let startChance=clamp(.07+score/115,.025,.70);
 let benchChance=clamp(.52+score/150+dnp*.13,.36,.88);
 if(dnp>=3)benchChance=Math.max(benchChance,.82);
 let r=Math.random(),status,minute=0;
 if(r<startChance)status="Starter";
 else if(r<startChance+benchChance){
   status="Bench";
   const quality=clamp((score+40)/80,0,1);
   minute=clamp(Math.round(69-quality*18+Math.random()*10),45,75);
 }else status="Not Selected";
 let role=score>28?"Key Player":score>14?"Starter":score>2?"Rotation":score>-15?"Prospect":"Development Player";
 return {status,minute,role,startChance,benchChance,score,best};
}

}

function defenderWeightV28(p){
 const w={CB:2.2,LB:1.4,RB:1.4,CDM:.8,CM:.25,GK:.12}[p.pos]||.08;
 return w*Math.max(.5,((p.ovr||65)-45)/35);
}
function compactGoalLineV28(g){
 if(g.ownGoal)return `${g.minute?g.minute+"' • ":""}${g.scorer} (OG)`;
 return `${g.minute?g.minute+"' • ":""}${g.scorer}${g.assister?` — ${g.assister} assist`:""}`;
}
function simulateNamedFixtureV28(a,b,ga,gb){
 const A=simulateClubLineupV19(a),B=simulateClubLineupV19(b),goals=[];
 const scoreGoals=(team,players,opponents,n)=>{
   for(let i=0;i<n;i++){
     // Own goals should exist, but be genuinely rare.
     const ownGoal=Math.random()<0.0075 && opponents.length;
     if(ownGoal){
       const og=weightedPickV19(opponents,defenderWeightV28)||opponents.find(x=>x.pos!=="GK")||opponents[0];
       if(og){
         og.ownGoals=(og.ownGoals||0)+1;
         goals.push({team,scorer:og.name,assister:null,ownGoal:true});
         continue;
       }
     }
     const scorer=weightedPickV19(players,scorerWeightV19);
     if(!scorer)continue;
     scorer.goals=(scorer.goals||0)+1;scorer._matchGoals=(scorer._matchGoals||0)+1;
     const candidates=players.filter(x=>x!==scorer);
     const assister=Math.random()<.70?weightedPickV19(candidates,assisterWeightV19):null;
     if(assister){assister.assists=(assister.assists||0)+1;assister._matchAssists=(assister._matchAssists||0)+1}
     goals.push({team,scorer:scorer.name,assister:assister?.name||null,ownGoal:false});
   }
 };
 scoreGoals(a,A,B,ga);scoreGoals(b,B,A,gb);
 [...A,...B].forEach(p=>{
   const base=6.15+((p.ovr||65)-70)*.008+(Math.random()-.5)*.65;
   const perf=clamp(base+(p._matchGoals||0)*.72+(p._matchAssists||0)*.42-(p.ownGoals?0.04:0),5.5,9.6);
   const oldApps=Math.max(0,(p.apps||1)-1);
   p.rating=oldApps?clamp(((p.rating||6.5)*oldApps+perf)/(oldApps+1),5.7,9):perf;
   delete p._matchGoals;delete p._matchAssists;
 });
 return goals;
}
function simulateWholeWeekV28(userA,userB,userGA,userGB){
 const reports=[],userDetails=simulateNamedFixtureV28(userA,userB,userGA,userGB);
 save.lastUserFixtureDetails={home:userA,away:userB,homeScore:userGA,awayScore:userGB,goals:userDetails};
 reports.push(...userDetails);
 const rest=save.table.map(x=>x.team).filter(x=>x!==userA&&x!==userB);
 for(let i=0;i+1<rest.length;i+=2){
   const a=rest[i],b=rest[i+1],[ga,gb]=simScore(strength(a),strength(b));
   apply(a,b,ga,gb);
   const details=simulateNamedFixtureV28(a,b,ga,gb);
   reports.push(...details);
 }
 save.lastLeagueGoalDetails=reports.slice(0,60);
 save.lastLeagueScorers=reports.slice(0,40).map(g=>`${g.team}: ${compactGoalLineV28(g)}`);
 return reports;
}

/* Trust is now performance-based and can swing significantly in either direction. */
function managerTrustDeltaV28(rating,minutes){
 const r=Number(rating)||6.5,m=Number(minutes)||0;
 let delta=0;
 if(r>=9.0)delta=5;
 else if(r>=8.3)delta=4;
 else if(r>=7.7)delta=3;
 else if(r>=7.2)delta=2;
 else if(r>=6.8)delta=1;
 else if(r>=6.35)delta=0;
 else if(r>=6.0)delta=-1;
 else if(r>=5.6)delta=-3;
 else delta=-5;
 if(m<25){delta=Math.round(delta*.65)}
 return delta;
}
function applyManagerTrustV28(rating,minutes){
 const delta=managerTrustDeltaV28(rating,minutes);
 save.trust=clamp((save.trust||50)+delta,0,100);
 save.lastTrustChange=delta;
 return delta;
}

function hashV33(str){
 let h=2166136261>>>0;
 str=String(str||"");
 for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
 return h>>>0;
}
function rngV33(seed){
 let s=seed>>>0;
 return function(){ s=(Math.imul(1664525,s)+1013904223)>>>0; return s/4294967296; };
}
function shortNameV33(name){
 name=String(name||"").replace(/\s+/g," ").trim();
 if(!name) return "";
 let parts=name.split(" ");
 if(parts.length<=2) return name;
 return parts[0]+" "+parts[parts.length-1];
}
function starsV33(num){
 let full=Math.max(1,Math.min(5,Math.round(num)));
 return "★".repeat(full)+"☆".repeat(5-full);
}
function clubStrengthV33(club){ return typeof strength==="function" ? strength(club) : 70; }
function squadV33(club){
 let c=canonClub ? canonClub(club) : club;
 let players=(save.worldPlayers||[]).filter(p=>(canonClub?canonClub(p.club):p.club)===c).map(p=>({...p}));
 if((canonClub?canonClub(save.club):save.club)===c){
   const me={name:save.player.name,club:save.club,league:save.league,pos:save.player.pos,age:save.player.age,ovr:save.player.ovr,rating:save.form||6.5,apps:save.apps||0,goals:save.goals||0,assists:save.assists||0,real:false};
   const idx=players.findIndex(p=>p.name===me.name && p.pos===me.pos && p.age===me.age);
   if(idx>=0) players[idx]={...players[idx],...me};
   else players.push(me);
 }
 return players.sort((a,b)=>(b.ovr||0)-(a.ovr||0));
}
function formationForClubV33(club){
 let str=clubStrengthV33(club), seed=hashV33(save.season+"|"+save.fixtureIndex+"|"+club);
 let pool=str>=84?[0,1,3,0,1]:str>=76?[1,0,2,3]:[2,1,0,3];
 return V33_FORMATIONS[pool[seed%pool.length]];
}
function fitScoreV33(player,slot,club,selStatus){
 let score=(player.ovr||60);
 let pos=player.pos||"";
 if(slot.accept.includes(pos)) score+=18;
 else if(slot.accept.some(x=>String(pos).includes(x))) score+=10;
 else if(["LW","RW","LM","RM"].includes(pos)&&["LW","RW","LM","RM"].some(x=>slot.accept.includes(x))) score+=12;
 else if(["CM","CDM","CAM"].includes(pos)&&["CM","CDM","CAM"].some(x=>slot.accept.includes(x))) score+=11;
 else if(["LB","RB","LWB","RWB"].includes(pos)&&["LB","RB","LWB","RWB"].some(x=>slot.accept.includes(x))) score+=11;
 else if(pos==="CB" && (slot.accept.includes("CDM")||slot.accept.includes("LB")||slot.accept.includes("RB"))) score+=6;
 else score-=20;
 if(club===save.club && player.name===save.player.name){
   if(selStatus==="Starter") score+=42;
   else if(selStatus==="Bench") score-=18;
   else score-=34;
 }
 if((player.apps||0)>10) score += 2;
 if((player.rating||6.5)>6.9) score += 2;
 return score;
}
function lineupForClubV33(club,selStatus="Starter"){
 let squad=squadV33(club), form=formationForClubV33(club), used=new Set(), picks=[];
 form.slots.forEach(slot=>{
   const options=squad.map((p,i)=>({p,i,score:fitScoreV33(p,slot,club,selStatus)}))
     .filter(x=>!used.has(x.i)).sort((a,b)=>b.score-a.score);
   if(options[0]){
     used.add(options[0].i);
     picks.push({...slot, player:options[0].p});
   }
 });
 const bench=squad.map((p,i)=>({p,i})).filter(x=>!used.has(x.i)).slice(0,7).map(x=>x.p);
 return {formation:form,picks,bench,squad};
}
function recentFormV33(club){
 let seed=hashV33(save.season+"|"+save.week+"|"+club), rand=rngV33(seed), s=clubStrengthV33(club), arr=[];
 for(let i=0;i<5;i++){
   let r=rand(), v=s/100;
   arr.push(r<(0.22+v*0.45)?"W":r<(0.5+v*0.22)?"D":"L");
 }
 return arr;
}
function scoutInfoV33(club){

 let poolStrengths=["Pace","Wide threat","Recent form","Set pieces","Pressing","Creativity","Ball retention","Aerial duels","Transition play","Defensive shape","Clinical finishing","Work rate"];
 let poolWeaknesses=["Aerial defending","Decision making","Squad depth","Set-piece defending","Aggression control","Tracking runners","Build-up under pressure","Finishing consistency","Concentration","Lack of pace","Weak bench","Counter protection"];
 let strengths=[], weaknesses=[];
 while(strengths.length<3){
   let item=poolStrengths[Math.floor(rand()*poolStrengths.length)];
   if(!strengths.includes(item)) strengths.push(item);
 }
 while(weaknesses.length<2){
   let item=poolWeaknesses[Math.floor(rand()*poolWeaknesses.length)];
   if(!weaknesses.includes(item) && !strengths.includes(item)) weaknesses.push(item);
 }
 if(clubStrengthV33(club)>=84 && rand()>.45) weaknesses=["Few obvious weaknesses"];
 let keyPlayer=lineup.picks.slice().sort((a,b)=>(b.player?.ovr||0)-(a.player?.ovr||0))[0]?.player || lineup.squad[0];
 let style = lineup.formation.style || (clubStrengthV33(club)>=82?"Attacking":"Balanced");
 return {lineup, strengths, weaknesses, keyPlayer, style};
}
function weatherV33(){
 const arr=[
  {text:"Clear",icon:"☀️",temp:25},
  {text:"Partly cloudy",icon:"⛅",temp:21},
  {text:"Overcast",icon:"☁️",temp:18},
  {text:"Light rain",icon:"🌧️",temp:16},
  {text:"Drizzle",icon:"🌦️",temp:17},
  {text:"Windy",icon:"💨",temp:14}
 ];
 return arr[hashV33(save.season+"|"+save.week+"|weather") % arr.length];
}
function venueV33(){
 let base = save.club;
 let lookup={"Arsenal":"Emirates Stadium","Manchester City":"Etihad Stadium","Liverpool":"Anfield","Chelsea":"Stamford Bridge","Manchester United":"Old Trafford","Tottenham Hotspur":"Tottenham Hotspur Stadium","Newcastle United":"St James' Park","Aston Villa":"Villa Park","Barcelona":"Estadi Olímpic","Real Madrid":"Santiago Bernabéu","Málaga":"La Rosaleda"};
 return lookup[base] || (base + " Stadium");
}
function unavailableForV33(club,lineup){
 let key="v33hub|"+save.season+"|"+save.fixtureIndex+"|"+club;
 save.v33HubCache=save.v33HubCache||{};
 if(save.v33HubCache[key]?.unavailable) return save.v33HubCache[key].unavailable;
 let rand=rngV33(hashV33(key)), reasons=["Hamstring","Knock","Suspended","Illness","International duty","Tight calf"];
 let usedNames=new Set(lineup.picks.map(x=>x.player?.name));
 let candidates=lineup.squad.filter(p=>!usedNames.has(p.name) && p.name!==save.player.name);
 let count=Math.min(candidates.length, clubStrengthV33(club)>=84?4:3);
 let take = Math.floor(rand()*(count+1));
 let arr=[];
 for(let i=0;i<take;i++){
   let idx=Math.floor(rand()*candidates.length);
   let p=candidates.splice(idx,1)[0];
   if(!p) break;
   arr.push({name:shortNameV33(p.name), reason:reasons[Math.floor(rand()*reasons.length)]});
 }
 save.v33HubCache[key]={...(save.v33HubCache[key]||{}), unavailable:arr};
 persist();
 return arr;
}
function punditQuoteV33(selStatus){
 let diff=clubStrengthV33(save.club)-clubStrengthV33(save.nextOpponent);
 if(selStatus==="Not Selected"){
   return `${save.club} go into this one as ${diff>=4?"favourites":"slight underdogs"}, but all eyes will still be on team selection and whether the bench can change the game.`;
 }
 if(diff>=8) return `${save.club} should control long spells here, but the real story is whether ${save.player.name} can turn promise into influence on the pitch.`;
 if(diff<=-8) return `${save.club} will need discipline and bravery tonight. It could be the perfect stage for a breakout performance from ${save.player.name}.`;
 return `This looks finely balanced on paper. A single moment of quality could decide it — and ${save.player.name} may get the chance to provide it.`;
}
function renderPitchV33(lineup,highlightName=""){
 return `<div class="v33-pitch"><div class="v33-circle"></div>${lineup.picks.map(s=>`<div class="v33-spot ${s.cls||""} ${s.player?.name===highlightName?"you":""}" style="left:${s.x}%;top:${100-s.y}%">${s.label}</div>`).join("")}</div>`;
}
function matchPreviewHeaderV33(){
 const myForm=recentFormV33(save.club), oppForm=recentFormV33(save.nextOpponent), weather=weatherV33();
 return `<section class="v33-card v33-col-7">
   <div class="v33-match-hero"><div class="inner">
     <div class="v33-kicker">${save.league}</div>
     <div class="v33-title">Pre‑Match Hub</div>
     <div class="v33-sub">${venueV33()} • ${weather.icon} ${weather.text} • ${weather.temp}°C</div>
     <div class="v33-clubs">
       <div class="v33-teambox">
         <div class="v33-teamname">${save.club}</div>
         <div class="v33-stars">${starsV33(Math.round(clubStrengthV33(save.club)/18))}</div>
         <div class="v33-form">${myForm.map(r=>`<span class="${r}">${r}</span>`).join("")}</div>
       </div>
       <div class="v33-vs">VS</div>
       <div class="v33-teambox">
         <div class="v33-teamname">${save.nextOpponent}</div>
         <div class="v33-stars">${starsV33(Math.round(clubStrengthV33(save.nextOpponent)/18))}</div>
         <div class="v33-form">${oppForm.map(r=>`<span class="${r}">${r}</span>`).join("")}</div>
       </div>
     </div>
   </div></div>
 </section>`;
}
function selectionPanelV33(sel){
 let appearance = sel.status==="Starter" ? "Expected to start" : sel.status==="Bench" ? `Likely bench — expected entry around ${sel.minute}'` : "Outside the matchday squad";
 return `<section class="v33-card pad v33-col-5">
   <div class="v33-header"><div><div class="v33-kicker">Your status</div><div class="v33-title">${appearance}</div></div><span class="pill">${save.squadRole||sel.role||"Prospect"}</span></div>
   <div class="v33-small-grid">
     <div class="v33-small-stat"><span>OVR</span><b>${save.player.ovr}</b></div>
     <div class="v33-small-stat"><span>Trust</span><b>${Math.round(save.trust||50)}</b></div>
     <div class="v33-small-stat"><span>Sharpness</span><b>${Math.round(save.sharpness||65)}</b></div>
     <div class="v33-small-stat"><span>Morale</span><b>${Math.round(save.morale||70)}</b></div>
   </div>
   <div class="v33-strip">
     <span class="v33-chip">${save.player.pos} • ${save.player.style}</span>
     <span class="v33-chip">Value ${fmtMoneyV21(save.marketValue)}</span>
     <span class="v33-chip">Apps ${save.apps||0}</span>
     <span class="v33-chip">Goals ${save.goals||0}</span>
   </div>
   <div class="v33-note" style="margin-top:12px">${sel.status==="Not Selected"?"You can simulate the match instantly, or head back to other sections while you wait for your chance.":"Match time flows live once kick‑off begins and will pause whenever your next decision arrives."}</div>
 </section>`;
}
function clubPanelV33(club,scout,isOpponent=false){
 let unavailable = unavailableForV33(club, scout.lineup);
 let title = isOpponent ? "Opponent Scout" : "Club Setup";
 let subtitle = `${club} • ${scout.style} • ${scout.lineup.formation.name}`;
 let keyPlayer = scout.keyPlayer ? shortNameV33(scout.keyPlayer.name) : "TBC";
 return `<section class="v33-card pad ${isOpponent?"v33-col-5":"v33-col-7"}">
   <div class="v33-header"><div><div class="v33-kicker">${title}</div><div class="v33-title">${club}</div><div class="v33-sub">${subtitle}</div></div><span class="pill">Key player: ${keyPlayer}</span></div>
   <div class="v33-split">
     <div>
       ${renderPitchV33(scout.lineup, !isOpponent && ensureSelection().status==="Starter" ? save.player.name : "")}
       <div class="v33-strip" style="margin-top:12px">
         ${scout.lineup.picks.slice(0,5).map(s=>`<span class="v33-chip">${s.label}: ${shortNameV33(s.player?.name)}</span>`).join("")}
       </div>
     </div>
     <div>
       <div class="v33-kicker">Unavailable</div>
       <div class="v33-unavailable" style="margin-top:10px">
         ${unavailable.length ? unavailable.map(p=>`<div class="item"><b>${p.name}</b><span class="v33-reason">${p.reason}</span></div>`).join("") : `<div class="v33-note">No major absences to report.</div>`}
       </div>
     </div>
   </div>
 </section>`;
}
function reportPanelV33(myScout,oppScout,sel){
 return `<section class="v33-card pad v33-col-12">
   <div class="v33-header"><div><div class="v33-kicker">Analysis</div><div class="v33-title">Strengths, weaknesses & preview</div></div><span class="pill">${save.clubStrength || clubStrengthV33(save.club)} vs ${clubStrengthV33(save.nextOpponent)}</span></div>
   <div class="v33-dual">
     <div>
       <div class="v33-kicker">${save.nextOpponent}</div>
       <div class="v33-title" style="font-size:18px">Strengths</div>
       <ul class="v33-bullets">${oppScout.strengths.map(x=>`<li>${x}</li>`).join("")}</ul>
     </div>
     <div>
       <div class="v33-kicker">${save.nextOpponent}</div>
       <div class="v33-title" style="font-size:18px">Weaknesses</div>
       <ul class="v33-bullets">${oppScout.weaknesses.map(x=>`<li>${x}</li>`).join("")}</ul>
     </div>
   </div>
   <div class="v33-note" style="margin-top:14px">
     <div class="v33-kicker" style="margin-bottom:8px">Pundit preview</div>
     <div class="v33-quote">"${punditQuoteV33(sel.status)}"</div>
   </div>
 </section>`;
}
function launchMatchV33(){
 try{
   matchState=null;
   matchV32Base();
   startMatchClock();
 }catch(err){
   console.error(err);
   alert("Couldn't start the match. Try reopening the Match tab.");
 }
}
const matchV32Base = match;
match = function(){
 let useOld = !!(matchState && (matchState.started || matchState.running || matchState.minute>0 || (matchState.events&&matchState.events.length) || matchState.finished));
 if(useOld){ matchV32Base(); return; }
 let sel=ensureSelection();
 let myScout=scoutInfoV33(save.club), oppScout=scoutInfoV33(save.nextOpponent);
 app(`${topBlockV31("MATCHDAY", `${save.club} vs ${save.nextOpponent}`, `${save.season} • MW ${save.week}`)}
   <div class="v33-grid">
     ${matchPreviewHeaderV33()}
     ${selectionPanelV33(sel)}
     ${clubPanelV33(save.club,myScout,false)}
     ${clubPanelV33(save.nextOpponent,oppScout,true)}
     ${reportPanelV33(myScout,oppScout,sel)}
     <section class="v33-card pad v33-col-12">
       <div class="v33-actionbar">
         <div>
           <div class="v33-kicker">Ready?</div>
           <div class="v33-title">${sel.status==="Not Selected"?"Simulate this fixture":"Start the match flow"}</div>
           <div class="v33-sub">${sel.status==="Not Selected"?"The result, scorers and awards data will all update normally.":"The live clock will run until your next player decision appears."}</div>
         </div>
         <div class="v33-buttonrow">
           ${sel.status==="Not Selected"
             ? `<button class="btn" onclick="simulateUnselected()">Simulate Match</button>`
             : `<button class="btn" onclick="launchMatchV33()">Kick Off</button>`}
           <button class="btn secondary" onclick="show('career')">Player Profile</button>
           <button class="btn secondary" onclick="show('social')">Social</button>
           <button class="btn secondary" onclick="show('table')">League Table</button>
         </div>
       </div>
     </section>
   </div>`);
};

start();
</script></body></html>
